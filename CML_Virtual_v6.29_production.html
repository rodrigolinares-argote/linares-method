function integrityReport(){
  const issues=[];
  const warnings=[];
  const info=[];
  const clientIds=new Set(state.clients.map(c=>c.id));
  const normalizedNames=new Map();

  state.clients.forEach(client=>{
    const key=normalizeClientKey(client.name);
    if(!client.id)issues.push({type:'client_missing_id',label:`Cliente sin identificador: ${client.name||'Sin nombre'}`});
    if(!client.name?.trim())issues.push({type:'client_missing_name',label:`Cliente ${client.id||'sin ID'} sin nombre`});
    if(Number(client.balance||0)<0)issues.push({type:'client_negative_balance',label:`Saldo negativo en ${client.name}`});
    if(!Number.isFinite(Number(client.order)))warnings.push({type:'client_invalid_order',label:`Orden inválido en ${client.name}`});
    if(key){
      if(normalizedNames.has(key))issues.push({type:'duplicate_client_name',label:`Nombre duplicado: ${client.name}`});
      else normalizedNames.set(key,client.id);
    }
  });

  const dayDates=new Set();
  state.history.forEach(day=>{
    if(!day.date)issues.push({type:'day_missing_date',label:'Jornada sin fecha'});
    if(day.date&&day.date>dateKey())warnings.push({type:'future_day',label:`Jornada futura detectada: ${day.date}`});
    if(dayDates.has(day.date))issues.push({type:'duplicate_day',label:`Jornada duplicada: ${day.date}`});
    dayDates.add(day.date);
    if(!['preparation','active','closed'].includes(day.status))issues.push({type:'invalid_day_status',label:`Estado inválido en jornada ${day.date||'sin fecha'}`});
    if(day.openingCash!==undefined&&(Number(day.openingCash)<0||!Number.isFinite(Number(day.openingCash))))issues.push({type:'invalid_opening_cash',label:`Capital inicial inválido en jornada ${day.date}`});
    if(day.openingCash===undefined)info.push({type:'legacy_opening_cash',label:`Jornada anterior usa capital configurado: ${day.date}`});
    if(day.status==='closed'&&!day.closedAt)issues.push({type:'closed_day_missing_timestamp',label:`Jornada cerrada sin fecha de cierre: ${day.date}`});
    if(day.status==='closed'&&!day.preCloseBalances)warnings.push({type:'legacy_close_without_balance_snapshot',label:`Cierre anterior sin copia de saldos: ${day.date}`});
    if(day.status!=='closed'&&day.reconciliation)warnings.push({type:'active_day_with_reconciliation',label:`Jornada activa conserva conciliación: ${day.date}`});
    if(Number(day.reopenCount||0)!==(Array.isArray(day.reopenHistory)?day.reopenHistory.length:0))warnings.push({type:'reopen_history_mismatch',label:`Historial de reaperturas inconsistente: ${day.date}`});
    if(Number(day.reopenCount||0)>3)issues.push({type:'reopen_limit_exceeded',label:`Límite de reaperturas excedido: ${day.date}`});
    if(day.status!=='closed'&&day.date<dateKey())warnings.push({type:'old_open_day',label:`Jornada anterior sin cerrar: ${day.date}`});
    (day.clientIds||[]).forEach(id=>{
      if(!clientIds.has(id))issues.push({type:'orphan_day_client',label:`Jornada ${day.date}: cliente inexistente ${id}`});
    });
    (day.routeOrder||[]).forEach(id=>{
      if(!(day.clientIds||[]).includes(id))warnings.push({type:'route_order_outside_day',label:`Orden de ruta inconsistente en ${day.date}: ${id}`});
    });
    Object.entries(day.accreditations||{}).forEach(([id,value])=>{
      if(!clientIds.has(id))issues.push({type:'orphan_accreditation',label:`Acreditación huérfana en ${day.date}: ${id}`});
      if(Number(value)<0||!Number.isFinite(Number(value)))issues.push({type:'invalid_accreditation',label:`Acreditación inválida en ${day.date}`});
    });
    Object.entries(day.payments||{}).forEach(([id,payments])=>{
      if(!clientIds.has(id))issues.push({type:'orphan_payment_client',label:`Pago asociado a cliente inexistente en ${day.date}: ${id}`});
      if(!Array.isArray(payments))issues.push({type:'invalid_payment_collection',label:`Pagos inválidos en ${day.date}: ${id}`});
      else {
        const seenPayments=new Set();
        payments.forEach(payment=>{
        if(!payment.id)issues.push({type:'payment_missing_id',label:`Pago sin identificador en ${day.date}: ${id}`});
        if(Number(payment.amount)<=0||!Number.isFinite(Number(payment.amount)))issues.push({type:'invalid_payment',label:`Pago inválido en ${day.date}: ${id}`});
        if(!['cash','transfer'].includes(payment.method))warnings.push({type:'unknown_payment_method',label:`Medio de pago no reconocido en ${day.date}: ${payment.method||'vacío'}`});
        if(day.closedAt&&Number(payment.createdAt||0)>Number(day.closedAt))warnings.push({type:'payment_after_close',label:`Pago posterior al cierre en ${day.date}: ${id}`});
        const duplicateKey=`${Number(payment.amount||0)}|${payment.method}|${Math.floor(Number(payment.createdAt||0)/8000)}`;
        if(seenPayments.has(duplicateKey))warnings.push({type:'possible_duplicate_payment',label:`Posible pago duplicado en ${day.date}: ${id}`});
        seenPayments.add(duplicateKey);
      });
      }
    });
  });

  state.expenses.forEach(expense=>{
    if(Number(expense.amount)<=0||!Number.isFinite(Number(expense.amount)))issues.push({type:'invalid_expense',label:`Gasto inválido: ${expense.detail||expense.id}`});
    if(expense.method&&!['cash','transfer'].includes(expense.method))issues.push({type:'invalid_expense_method',label:`Forma de pago inválida en gasto: ${expense.id}`});
    if(!expense.method)info.push({type:'legacy_expense_method',label:`Gasto anterior tratado como efectivo: ${expense.id}`});
    if(expense.dayDate&&!dayDates.has(expense.dayDate))warnings.push({type:'orphan_expense_day',label:`Gasto sin jornada relacionada: ${expense.dayDate}`});
  });

  [...state.history,state.day].filter(Boolean).forEach(day=>{
    if(day.status!=='closed'&&day.status!=='active'&&day.status!=='preparation')return;
    if(day.status!=='preparation'&&!dailyDataReady(day)){
      issues.push({type:'active_day_without_daily_load',label:`Jornada sin carga diaria confirmada: ${day.date}`});
    }
  });
  state.history.filter(day=>day.status==='closed').forEach(day=>{
    if(!day.preCloseBalances||typeof day.preCloseBalances!=='object'){
      warnings.push({type:'missing_preclose_balances',label:`Jornada cerrada sin saldos iniciales históricos: ${day.date}`});
    }
    Object.entries(day.preCloseBalances||{}).forEach(([clientId,value])=>{
      if(!Number.isFinite(Number(value))||Number(value)<0){
        issues.push({type:'invalid_preclose_balance',label:`Saldo inicial histórico inválido: ${day.date} · ${clientId}`});
      }
    });
  });
  state.audit.forEach(entry=>{
    if(!entry.id)issues.push({type:'audit_missing_id',label:'Evento de auditoría sin identificador'});
    if(!entry.action)issues.push({type:'audit_missing_action',label:`Evento de auditoría sin acción: ${entry.id||'sin ID'}`});
    if(!Number(entry.createdAt))warnings.push({type:'audit_missing_date',label:`Evento de auditoría sin fecha: ${entry.id||entry.action||'desconocido'}`});
  });
  state.reconciliations.forEach(rec=>{
    if(rec.dayDate&&!dayDates.has(rec.dayDate))warnings.push({type:'orphan_reconciliation',label:`Conciliación sin jornada: ${rec.dayDate}`});
    if(Number(rec.countedCash)<0)issues.push({type:'invalid_reconciliation_amount',label:`Conciliación con efectivo contado negativo: ${rec.dayDate}`});
    const differences=reconciliationDifferenceSummary(rec);
    if(roundCurrency(rec.cashDifference||0)!==differences.cashDifference)warnings.push({type:'reconciliation_cash_mismatch',label:`Diferencia de efectivo inconsistente: ${rec.dayDate}`});
    if(roundCurrency(rec.transferDifference||0)!==differences.transferDifference)warnings.push({type:'reconciliation_transfer_mismatch',label:`Diferencia de transferencias inconsistente: ${rec.dayDate}`});
    if(roundCurrency(rec.totalDifference||0)!==differences.totalDifference)warnings.push({type:'reconciliation_total_mismatch',label:`Diferencia total inconsistente: ${rec.dayDate}`});
  });

  state.loans.forEach(loan=>{
    if(Number(loan.remaining)<0)issues.push({type:'negative_loan_remaining',label:`Préstamo con saldo negativo: ${loan.person||loan.id}`});
    if(Number(loan.amount||0)<0)issues.push({type:'negative_loan_amount',label:`Préstamo con monto negativo: ${loan.person||loan.id}`});
  });

  const lastBackupAt=Number(state.settings.lastBackupAt||0);
  const backupAge=daysSince(lastBackupAt);
  if(!lastBackupAt)warnings.push({type:'never_backed_up',label:'Todavía no se registró ningún backup'});
  else if(backupAge>=7)warnings.push({type:'stale_backup',label:`Último backup hace ${backupAge} días`});
  else info.push({type:'backup_ok',label:`Último backup hace ${backupAge} día(s)`});
  const localSnapshots=readEmergencySnapshots();
  if(!localSnapshots.length)warnings.push({type:'no_emergency_snapshot',label:'No hay copias locales de emergencia'});
  else info.push({type:'emergency_snapshots',label:`${localSnapshots.length} copia(s) local(es) de emergencia`});
  if(state.storageInfo?.persisted===false)warnings.push({type:'storage_not_persistent',label:'El navegador no confirmó almacenamiento persistente'});
  if(state.storageInfo?.persisted===true)info.push({type:'storage_persistent',label:'Almacenamiento persistente confirmado'});

  const closedDays=state.history.filter(d=>d.status==='closed').length;
  info.push({type:'counts',label:`${state.clients.length} clientes · ${state.history.length} jornadas · ${closedDays} cerradas`});

  return {
    issues,
    warnings,
    info,
    score:Math.max(0,100-(issues.length*18)-(warnings.length*2)),
    checkedAt:Date.now()
  };
}

function isSafeBackupId(value){
  const id=String(value??'');
  return id.length>0&&id.length<=128&&/^[A-Za-z0-9_-]+$/.test(id);
}
function isValidBackupDate(value){
  const raw=String(value??'');
  return /^\d{4}-\d{2}-\d{2}$/.test(raw)&&dateKey(localDateFromKey(raw))===raw;
}
function validateBackupStructure(data){
  const errors=[];
  if(!data||typeof data!=='object'||Array.isArray(data))errors.push('El archivo no contiene un objeto válido.');
  if(!Array.isArray(data?.clients))errors.push('Falta la lista de clientes.');
  if(!Array.isArray(data?.days))errors.push('Falta la lista de jornadas.');
  const clientIds=new Set();
  (data?.clients||[]).forEach((client,index)=>{
    if(!isSafeBackupId(client?.id))errors.push(`Cliente ${index+1} con identificador inválido.`);
    else if(clientIds.has(client.id))errors.push(`Identificador de cliente duplicado: ${client.id}.`);
    else clientIds.add(client.id);
    if(typeof client?.name!=='string'||!client.name.trim())errors.push(`Cliente ${index+1} sin nombre.`);
    const balance=Number(client?.balance||0);
    if(!Number.isFinite(balance)||balance<0)errors.push(`Saldo inválido en ${client?.name||'cliente '+(index+1)}.`);
  });
  const dates=new Set();
  (data?.days||[]).forEach((day,index)=>{
    if(!isValidBackupDate(day?.date))errors.push(`Fecha inválida en jornada ${index+1}.`);
    else if(dates.has(day.date))errors.push(`Jornada duplicada: ${day.date}.`);
    else dates.add(day.date);
    if(day?.status&&!['preparation','active','closed'].includes(day.status))errors.push(`Estado inválido en jornada ${day.date||index+1}.`);
    if(day?.status==='closed'&&(!Number(day.closedAt)||!day.reconciliation))errors.push(`La jornada ${day.date||index+1} figura cerrada pero no contiene un cierre completo.`);
    [...(Array.isArray(day?.clientIds)?day.clientIds:[]),...(Array.isArray(day?.routeOrder)?day.routeOrder:[])].forEach(id=>{
      if(!isSafeBackupId(id)||!clientIds.has(id))errors.push(`Referencia de cliente inválida en jornada ${day.date||index+1}.`);
    });
    Object.entries(day?.payments||{}).forEach(([clientId,payments])=>{
      if(!clientIds.has(clientId)||!Array.isArray(payments))errors.push(`Colección de pagos inválida en jornada ${day.date||index+1}.`);
      else payments.forEach((payment,paymentIndex)=>{
        if(payment?.id!==undefined&&payment?.id!==null&&payment?.id!==''&&!isSafeBackupId(payment.id))errors.push(`Pago ${paymentIndex+1} con identificador inválido en jornada ${day.date}.`);
        const amount=Number(payment?.amount);
        if(!Number.isFinite(amount)||amount<=0)errors.push(`Pago ${paymentIndex+1} con monto inválido en jornada ${day.date}.`);
        if(!['cash','transfer'].includes(payment?.method))errors.push(`Pago ${paymentIndex+1} con forma inválida en jornada ${day.date}.`);
      });
    });
  });
  const validateRecordIds=(records,label)=>{
    const seen=new Set();
    (records||[]).forEach((record,index)=>{
      if(!isSafeBackupId(record?.id))errors.push(`${label} ${index+1} con identificador inválido.`);
      else if(seen.has(record.id))errors.push(`Identificador duplicado en ${label.toLowerCase()}: ${record.id}.`);
      else seen.add(record.id);
    });
  };
  if(data?.settings!==undefined&&!Array.isArray(data.settings))errors.push('La lista de configuración es inválida.');
  if(data?.loans!==undefined&&!Array.isArray(data.loans))errors.push('La lista de préstamos es inválida.');
  if(data?.expenses!==undefined&&!Array.isArray(data.expenses))errors.push('La lista de gastos es inválida.');
  if(data?.audit!==undefined&&!Array.isArray(data.audit))errors.push('La lista de auditoría es inválida.');
  if(data?.imports!==undefined&&!Array.isArray(data.imports))errors.push('La lista de importaciones es inválida.');
  if(data?.reconciliations!==undefined&&!Array.isArray(data.reconciliations))errors.push('La lista de conciliaciones es inválida.');
  validateRecordIds(data?.loans,'Préstamo');
  validateRecordIds(data?.expenses,'Gasto');
  validateRecordIds(data?.audit,'Evento de auditoría');
  validateRecordIds(data?.imports,'Importación');
  (data?.loans||[]).forEach((loan,index)=>{
    (loan?.payments||[]).forEach((payment,paymentIndex)=>{
      if(payment?.id!==undefined&&payment?.id!==null&&payment?.id!==''&&!isSafeBackupId(payment.id))errors.push(`Pago ${paymentIndex+1} del préstamo ${index+1} con identificador inválido.`);
    });
  });
  (data?.expenses||[]).forEach((expense,index)=>{
    if(expense?.dayDate&&!isValidBackupDate(expense.dayDate))errors.push(`Gasto ${index+1} con fecha de jornada inválida.`);
    const amount=Number(expense?.amount);
    if(!Number.isFinite(amount)||amount<=0)errors.push(`Gasto ${index+1} con monto inválido.`);
    if(expense?.method&&!['cash','transfer'].includes(expense.method))errors.push(`Gasto ${index+1} con forma de pago inválida.`);
  });
  (data?.reconciliations||[]).forEach((record,index)=>{
    if(!isValidBackupDate(record?.dayDate))errors.push(`Conciliación ${index+1} con fecha inválida.`);
  });
  (data?.settings||[]).forEach((setting,index)=>{
    const key=String(setting?.key??'');
    if(!/^[A-Za-z][A-Za-z0-9_.-]{0,63}$/.test(key)||['__proto__','prototype','constructor'].includes(key))errors.push(`Configuración ${index+1} con clave inválida.`);
  });
  return [...new Set(errors)];
}

function reportData(){
  const days=daysInReportRange();
  const byClient=new Map();
  let accredited=0,collected=0,cash=0,transfer=0,expenses=0,loanPayments=0,bankCommission=0,pending=0,managed=0,visitsWithoutPayment=0;
  days.forEach(day=>{
    const totals=calcDay(day);
    accredited+=totals.accredited;
    collected+=totals.paid;
    cash+=totals.cash;
    transfer+=totals.transfer;
    expenses+=totals.expenses;
    loanPayments+=totals.loanPayments;
    bankCommission+=Number(totals.bankCommission||0);
    pending+=totals.pending;
    const stats=routeVisitStats(day);
    managed+=stats.managed;
    visitsWithoutPayment+=stats.visited;
    operationalClients(day).forEach(client=>{
      const payments=day.payments?.[client.id]||[];
      const paid=payments.reduce((sum,p)=>sum+Number(p.amount||0),0);
      const acc=Number(day.accreditations?.[client.id]||0);
      const current=byClient.get(client.id)||{
        clientId:client.id,name:client.name,collected:0,accredited:0,
        visits:0,payments:0,cash:0,transfer:0
      };
      current.collected+=paid;
      current.accredited+=acc;
      current.visits+=1;
      current.payments+=payments.length;
      current.cash+=payments.filter(p=>p.method==='cash').reduce((s,p)=>s+Number(p.amount||0),0);
      current.transfer+=payments.filter(p=>p.method==='transfer').reduce((s,p)=>s+Number(p.amount||0),0);
      byClient.set(client.id,current);
    });
  });
  const clients=[...byClient.values()].sort((a,b)=>b.collected-a.collected||a.name.localeCompare(b.name,'es'));
  const average=days.length?Math.round(collected/days.length):0;
  const effectiveness=(collected+pending)>0?Math.round((collected/(collected+pending))*100):0;
  return {
    days,clients,accredited,collected,cash,transfer,expenses,loanPayments,bankCommission,
    net:collected-expenses-loanPayments-bankCommission,
    pending,average,effectiveness,managed,visitsWithoutPayment
  };
}

function parseMoneyInput(value){
  let text=String(value??'').trim().replace(/\s/g,'').replace(/\$/g,'');
  if(!text)return 0;

  const negative=text.startsWith('-');
  text=text.replace(/-/g,'').replace(/[^\d.,]/g,'');

  const lastComma=text.lastIndexOf(',');
  const lastDot=text.lastIndexOf('.');
  let normalized=text;

  if(lastComma>=0&&lastDot>=0){
    const decimalSeparator=lastComma>lastDot?',':'.';
    const thousandsSeparator=decimalSeparator===','?'.':',';
    normalized=text.split(thousandsSeparator).join('');
    normalized=normalized.replace(decimalSeparator,'.');
  }else if(lastComma>=0){
    const decimals=text.length-lastComma-1;
    normalized=decimals>0&&decimals<=2
      ?text.replace(/\./g,'').replace(',','.')
      :text.replace(/,/g,'');
  }else if(lastDot>=0){
    const decimals=text.length-lastDot-1;
    const dotCount=(text.match(/\./g)||[]).length;
    normalized=dotCount===1&&decimals>0&&decimals<=2
      ?text
      :text.replace(/\./g,'');
  }

  const number=Number((negative?'-':'')+normalized);
  return Number.isFinite(number)?roundCurrency(number):0;
}

function dayHasRecordedActivity(day){
  if(!day)return false;
  if(day.status==='active'||day.status==='closed')return true;
  if(day.dailyLoad?.confirmedAt||day.accreditationImport?.appliedAt||day.routeActivatedAt)return true;
  if(day.openingCashConfirmed||String(day.note||'').trim())return true;
  if(Array.isArray(day.routeOrder)&&day.routeOrder.length)return true;
  if(Object.keys(day.visits||{}).length)return true;
  const visitCredits=Object.values(day.visitCredits||{}).some(value=>Number(value||0)!==0);
  const accreditations=Object.values(day.accreditations||{}).some(value=>Number(value||0)!==0);
  const payments=Object.values(day.payments||{}).some(list=>Array.isArray(list)&&list.some(payment=>Number(payment?.amount||0)!==0));
  return visitCredits||accreditations||payments;
}

  }
}
async function repairUtcShiftedEmptyPreparationDay(){
  const localToday=dateKey();
  let changed=false;

  // v6.13: elimina únicamente jornadas futuras vacías que fueron creadas
  // automáticamente al cerrar el día. Antes de hacerlo conserva una copia local.
  const invalidFutureDays=state.history.filter(day=>
    day.date>localToday&&
    day.status==='preparation'&&
    day.createdFrom==='previous_day_close'&&
    !dayHasRecordedActivity(day)&&
    !hasRelatedDayRecords(day.date)
  );
  for(const candidate of invalidFutureDays){
    const backupKey=preserveMigrationCandidate(candidate,'future_day_created_on_close');
    await del('days',candidate.date);
    await auditLog('invalid_future_day_removed','Se retiró una jornada futura vacía creada automáticamente',{
      dayDate:candidate.date,backupKey,createdFrom:candidate.createdFrom
    });
    changed=true;
  }

  state.history=(await getAll('days')).sort((a,b)=>b.date.localeCompare(a.date));

  // Compatibilidad con una versión antigua que podía usar la fecha UTC al crear
  // manualmente una jornada. Solo se mueve si hoy no existe y no hay actividad.
  const utcTomorrow=addCalendarDays(localToday,1);
  if(!state.history.some(day=>day.date===localToday)){
    const candidate=state.history.find(day=>
      day.date===utcTomorrow&&
      day.status==='preparation'&&
      day.createdFrom==='manual'&&
      dateKey(new Date(Number(day.createdAt||0)))===localToday
    );
    if(candidate&&!dayHasRecordedActivity(candidate)&&!hasRelatedDayRecords(candidate.date)){
      const originalDate=candidate.date;
      preserveMigrationCandidate(candidate,'utc_shifted_manual_day');
      const corrected={...candidate,date:localToday,utcDateRepair:{from:originalDate,repairedAt:Date.now(),version:APP_VERSION}};
      await put('days',corrected);
      await del('days',originalDate);
      await auditLog('utc_day_repaired','Jornada vacía corregida por desfase UTC',{
        from:originalDate,to:localToday
      });
      changed=true;
    }
  }

  if(changed){
    state.history=(await getAll('days')).sort((a,b)=>b.date.localeCompare(a.date));
  }
  return changed;
}

async function ensureCurrentDayOpeningBalances(){
  const day=state.day;

  ensureDayCollections(day);
  const allowed=new Set(day.clientIds||state.clients.filter(client=>client.active!==false).map(client=>client.id));

  state.clients.filter(client=>allowed.has(client.id)).forEach(client=>{

}

function bindTabs(){
  document.querySelectorAll('.tab').forEach(button=>{
    button.onclick=()=>{
      if(document.getElementById('sheetBackdrop')?.classList.contains('show'))closeSheet();
      const nextTab=button.dataset.tab;
      if(!['today','clients','route','more'].includes(nextTab))return;
      state.tab=nextTab;
      resetMainScroll();
      document.querySelectorAll('.tab').forEach(tab=>tab.classList.toggle('active',tab===button));
      render();
    };
  });
  const tabs=[...document.querySelectorAll('.tab')];
  tabs.forEach((tab,index)=>{
    tab.onkeydown=event=>{
      if(!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
      event.preventDefault();
      let next=index;
      if(event.key==='ArrowLeft')next=(index-1+tabs.length)%tabs.length;
      if(event.key==='ArrowRight')next=(index+1)%tabs.length;
      if(event.key==='Home')next=0;
      if(event.key==='End')next=tabs.length-1;
      tabs[next].focus();
      tabs[next].click();
    };
  });
  const backdrop=document.getElementById('sheetBackdrop');
  if(backdrop)backdrop.onclick=event=>{if(event.target.id==='sheetBackdrop')closeSheet()};

function render(){
  document.body.className='v52 v53 v54 v55 v56 v57 v58 v59 v60 v61 v62 v63 v64 v65 v66 v67 v68 v69 v610 v612 v617 v618';
  document.body.dataset.view=state.tab;
  document.body.dataset.dayStatus=state.day?.status||'none';
  const screenKey=`${state.tab}:${state.tab==='today'?(state.day?.status||'none'):'section'}`;
  if(state._lastScreenKey!==screenKey){
    resetMainScroll();
    state._lastScreenKey=screenKey;
  }
  updateHeaderDate();
  const titles={today:'CML Virtual',clients:'Clientes',route:'Ruta de hoy',balance:'Balance',more:'Más'};
  const title=document.getElementById('title');
  const view=document.getElementById('view');
  title.textContent=titles[state.tab]||'CML Virtual';
  document.title=`${titles[state.tab]||'CML Virtual'} · CML Virtual`;
  document.querySelectorAll('.tab').forEach(tab=>{
    const active=tab.dataset.tab===state.tab;
    tab.classList.toggle('active',active);
    tab.setAttribute('aria-selected',String(active));
    tab.tabIndex=active?0:-1;
  });
  document.body.classList.toggle(
    'x-home-dashboard',
    state.tab==='today' && state.day?.status==='active' && state.todayMode!=='route'
  );
  view.classList.remove('view-enter');
  void view.offsetWidth;
  view.classList.add('view-enter');
  try{
    if(state.tab==='today')return renderToday();
    if(state.tab==='clients')return renderClients();
    if(state.tab==='route'){
      return document.getElementById('view').innerHTML=!state.day
        ?renderRouteUnavailable()
        :state.day.status==='active'?renderRoute(state.day):renderRouteReadOnly(state.day);
    }
    if(state.tab==='balance')return renderBalance();
    if(state.tab==='more')return renderMore();
    state.tab='today';
    document.querySelectorAll('.tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.tab==='today'));
    return renderToday();
  }catch(error){
    console.error(`Error al renderizar ${state.tab}`,error);
    view.innerHTML=`<div class="card">
      <div class="eyebrow">ERROR DE PANTALLA</div>
      <h2>No se pudo abrir ${escapeHtml(titles[state.tab]||'esta sección')}</h2>
      <p class="note">${escapeHtml(error?.message||String(error))}</p>
      <button class="btn secondary" onclick="recoverNavigation()">VOLVER A HOY</button>
    </div>`;
    auditLog('render_error','Error de renderizado',{tab:state.tab,message:error?.message||String(error)}).catch(console.error);
  }
}
function recoverNavigation(){
  state.tab='today';
  document.querySelectorAll('.tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.tab==='today'));
  render();
}


function localDateFromKey(value){
  const [year,month,day]=String(value||dateKey()).split('-').map(Number);
  return new Date(year,month-1,day,12,0,0);
}
function weekdayScheduleKey(dayDate=state.day?.date||dateKey()){
  return ['sun','mon','tue','wed','thu','fri','sat'][localDateFromKey(dayDate).getDay()];
}
function weekdayScheduleLabel(key=weekdayScheduleKey()){
  return {sun:'domingo',mon:'lunes',tue:'martes',wed:'miércoles',thu:'jueves',fri:'viernes',sat:'sábado'}[key]||key;
}
function configuredRouteForDate(dayDate=state.day?.date||dateKey()){
  const key=weekdayScheduleKey(dayDate);
  const configured=state.settings.routeSchedules?.[key];
  if(!Array.isArray(configured))return [];
  const validIds=new Set(state.clients.filter(client=>client.active!==false).map(client=>client.id));
  return configured.filter(id=>validIds.has(id));
}
function shouldShowFridayPinReminder(dayDate=state.day?.date||dateKey()){
  return weekdayScheduleKey(dayDate)==='fri'&&state.settings.pinFridayReminderDismissedDate!==dayDate;
}
async function dismissFridayPinReminder(){
  const dayDate=state.day?.date||dateKey();
  state.settings.pinFridayReminderDismissedDate=dayDate;
  await put('settings',{key:'pinFridayReminderDismissedDate',value:dayDate});
  await auditLog('pin_friday_reminder_dismissed','Recordatorio de PINWEB descartado',{dayDate});
  render();
}
function routeScheduleBanner(day=state.day){
  if(!day)return '';
  const key=weekdayScheduleKey(day.date);
  const label=weekdayScheduleLabel(key);
  const ids=configuredRouteForDate(day.date);
  if(!ids.length){
    return `<div class="card">
      <div class="toolbar">
        <div>
          <div class="eyebrow">RUTA SUGERIDA · ${label.toUpperCase()}</div>
          <div class="client-name">Todavía no configurada</div>
        </div>

      </div>
      <p class="note">Podés guardar qué clientes visitás habitualmente los ${label}. La sugerencia nunca bloquea ni impide registrar otros pagos.</p>
      <button class="btn secondary" onclick="configureRouteSchedule('${key}')">CONFIGURAR RUTA DE ${label.toUpperCase()}</button>
    </div>`;
  }
  const names=ids.map(id=>state.clients.find(client=>client.id===id)?.name).filter(Boolean);
  return `<div class="card">
    <div class="toolbar">
      <div>

        <div class="client-name">${names.length} cliente(s) configurados</div>

      <button class="btn secondary" onclick="configureRouteSchedule('${key}')">EDITAR</button>

  </div>`;
}
function fridayPinReminderBanner(day=state.day){
  if(!day||!shouldShowFridayPinReminder(day.date))return '';
  return `<div class="card">
    <div class="toolbar">
      <div>
        <div class="eyebrow">RECORDATORIO DE VIERNES</div>
        <div class="client-name">Revisar adelanto PINWEB</div>
      </div>
      <span class="badge partial">PINWEB</span>

    <p class="note">Revisá si necesitás solicitar un adelanto. Este aviso es informativo y no bloquea la jornada.</p>
    <div class="actions">

      <button class="btn secondary" onclick="dismissFridayPinReminder()">DESCARTAR HOY</button>
    </div>
  </div>`;
}
function configureRouteSchedule(key=weekdayScheduleKey()){
  const label=weekdayScheduleLabel(key);
  const selected=new Set(state.settings.routeSchedules?.[key]||[]);
  const clients=state.clients.filter(client=>client.active!==false)
    .sort((a,b)=>Number(a.order||999)-Number(b.order||999)||a.name.localeCompare(b.name,'es'));
  openSheet(`<div class="sheet-handle"></div>
    <div class="eyebrow">CRONOGRAMA HABITUAL</div>
    <h2>Ruta de ${label}</h2>
    <p class="note">Marcá los clientes que normalmente visitás. Es una sugerencia editable, no una restricción.</p>
    <div class="card">
      ${clients.map(client=>`<label class="client-row">
        <span>
          <b>${escapeHtml(client.name)}</b>
          ${client.pinwebUser?`<div class="note">Usuario PINWEB: ${escapeHtml(client.pinwebUser)}</div>`:''}
        </span>
        <input type="checkbox" class="route-schedule-client" value="${client.id}" ${selected.has(client.id)?'checked':''}>
      </label>`).join('')}
    </div>
    <button class="btn" onclick="saveRouteSchedule('${key}')">GUARDAR RUTA DE ${label.toUpperCase()}</button>
    <button class="btn secondary" style="margin-top:10px" onclick="closeSheet()">CANCELAR</button>`);
}
async function saveRouteSchedule(key){
  const ids=[...document.querySelectorAll('.route-schedule-client:checked')].map(input=>input.value);
  state.settings.routeSchedules={...(state.settings.routeSchedules||{}),[key]:ids};
  await put('settings',{key:'routeSchedules',value:state.settings.routeSchedules});
  await auditLog('route_schedule_saved','Cronograma habitual actualizado',{
    weekday:key,clients:ids.length
  });
  closeSheet();
  render();
  toast('Ruta habitual guardada');
}
async function applyConfiguredRoute(key=weekdayScheduleKey()){
  if(!state.day||state.day.status==='closed')return toast('No hay una jornada editable');
  const ids=(state.settings.routeSchedules?.[key]||[])
    .filter(id=>state.day.clientIds?.includes(id)&&state.clients.some(client=>client.id===id&&client.active!==false));
  if(!ids.length)return toast('La ruta sugerida no tiene clientes configurados');
  state.day.routeOrder=[...ids];
  state.day.routeScheduleApplied={
    weekday:key,
    appliedAt:Date.now(),
    clientIds:[...ids]
  };
  await saveDay();
  await auditLog('route_schedule_applied','Ruta sugerida aplicada',{
    weekday:key,clients:ids.length,dayDate:state.day.date
  });
  render();
  toast(`Ruta de ${weekdayScheduleLabel(key)} aplicada`);
}

  if(!state.day){

    v.innerHTML=`<div class="v51-start">

        <div class="v51-start-step"><span>1</span><b>Carga financiera</b><small>Acreditaciones, capital y saldos del día.</small></div>
        <div class="v51-start-step"><span>2</span><b>Revisión de ruta</b><small>Clientes y secuencia de recorrido.</small></div>

        <small>Recorrido habitual</small><b>${configured.length?'Revisar ruta':'Configurar ruta'}</b>

async function saveRescheduledFollowUp(dayDate,clientId){
  const day=state.history.find(d=>d.date===dayDate);
  const visit=day?.visits?.[clientId];
  const newDate=document.getElementById('followUpNewDate').value;
  const note=document.getElementById('followUpRescheduleNote').value.trim();
  if(!day||!visit)return toast('No se encontró el seguimiento');
  if(!newDate)return toast('Seleccioná una fecha');
  const previousDate=visit.followUpDate;
  visit.followUpDate=newDate;
  visit.note=note;
  visit.updatedAt=Date.now();
  visit.followUpResolvedAt=null;
  visit.followUpResolution='';
  await put('days',day);
  state.history.sort((a,b)=>b.date.localeCompare(a.date));
  if(state.day?.date===day.date)state.day=day;
  await auditLog('followup_rescheduled','Seguimiento reprogramado',{clientId,dayDate,previousDate,newDate});
  showFollowUps();
  toast('Seguimiento reprogramado');
}
async function resolveFollowUp(dayDate,clientId){
  const day=state.history.find(d=>d.date===dayDate);
  const client=state.clients.find(c=>c.id===clientId);
  const visit=day?.visits?.[clientId];
  if(!day||!visit||!client)return toast('No se encontró el seguimiento');
  const resolution=prompt(`¿Cómo se resolvió el seguimiento de ${client.name}?`,'Contactado / resuelto');
  if(resolution===null)return;
  if(!resolution.trim())return toast('Ingresá una resolución');
  visit.followUpResolvedAt=Date.now();
  visit.followUpResolution=resolution.trim();
  visit.updatedAt=Date.now();
  await put('days',day);
  if(state.day?.date===day.date)state.day=day;
  await auditLog('followup_resolved','Seguimiento resuelto',{clientId,dayDate,resolution:resolution.trim()});
  showFollowUps();
  toast('Seguimiento resuelto');
}

async function saveExpense(){
  if(!state.day)return toast('Abrí una jornada antes de registrar gastos','error');
  if(state.day.status==='closed')return toast('La jornada está cerrada. Reabrila para modificar gastos','error');
  const category=document.getElementById('expenseCategory').value;
  const amount=parseMoneyInput(document.getElementById('expenseAmount').value);
  const method=document.getElementById('expenseMethod').value;
  const note=document.getElementById('expenseNote').value.trim();
  if(amount<=0)return toast('Ingresá un monto válido');
  if(!['cash','transfer'].includes(method))return toast('Forma de pago inválida');
  const expense={id:'ex_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),dayDate:state.day.date,category,amount,method,note,createdAt:Date.now()};
  state.expenses.unshift(expense);
  await put('expenses',expense);
  await auditLog('expense_created',`Gasto registrado: ${category}`,{expenseId:expense.id,amount,method});
  showExpenses();
  toast('Gasto registrado');
}
async function deleteExpense(id){
  if(!state.day)return toast('No hay una jornada abierta','error');
  if(state.day.status==='closed')return toast('La jornada está cerrada. Reabrila para modificar gastos','error');
  const expense=state.expenses.find(e=>e.id===id);
  if(!expense)return;
  if(expense.dayDate!==state.day.date)return toast('El gasto no pertenece a la jornada actual','error');
  if(!confirm('¿Eliminar este gasto?'))return;
  await del('expenses',id);
  state.expenses=state.expenses.filter(e=>e.id!==id);
  await auditLog('expense_deleted',`Gasto eliminado: ${expense.category}`,{expenseId:id,amount:expense.amount});
  showExpenses();
  toast('Gasto eliminado');
}

const CASH_DENOMINATIONS=[20000,10000,2000,1000,500,200,100,50,20,10];
const BANK_CASH_COMMISSION_RATE=0.008;
function cashBreakdownFromDom(){
  const breakdown={};
  let total=0;
  CASH_DENOMINATIONS.forEach(value=>{
    const qty=Math.max(0,parseInt(document.getElementById(`cash_${value}`)?.value||'0',10)||0);
    breakdown[value]=qty;
    total+=value*qty;
  });
  return {breakdown,total};
}

function operationalIncidents(day=state.day){
  if(!day)return [];
  const incidents=[];
  const totals=calcDay(day);
  const clients=operationalClients(day);
  const importReady=accreditationImportReady(day);

  if(!importReady){
    incidents.push({
      id:'missing_import',severity:'critical',category:'preparation',
      title:'Falta confirmar la carga diaria',
      detail:'La jornada no tiene una carga manual o importación confirmada.',
      action:'showDailyLoad()',actionLabel:'CARGAR DATOS'
    });
  }
  if(!day.openingCashConfirmed){
    incidents.push({
      id:'opening_cash_unconfirmed',severity:'warning',category:'preparation',
      title:'Capital inicial sin confirmar',
      detail:`Capital actual: ${money(dayOpeningCash(day))}.`,
      action:"state.tab='today';closeSheet();render()",actionLabel:'REVISAR'
    });
  }
  if(day.status==='active'&&day.routeSnapshot?.fingerprint&&day.routeSnapshot.fingerprint!==dailyLoadFingerprint(day)){
    incidents.push({
      id:'route_snapshot_changed',severity:'critical',category:'closing',
      title:'La base financiera cambió después de generar la ruta',
      detail:'Los saldos, acreditaciones o pagos previos ya no coinciden con la revisión confirmada.',
      action:'showOperationalIncidents()',actionLabel:'REVISAR'
    });
  }

  clients.forEach(client=>{
    if(!client.phone?.trim()){
      incidents.push({
        id:`phone_${client.id}`,severity:'info',category:'client',clientId:client.id,
        title:`${client.name} sin teléfono`,
        detail:'No se podrá abrir WhatsApp ni enviar un comprobante directo.',
        action:`openClientForm('${client.id}')`,actionLabel:'COMPLETAR'
      });
    }
    if(!client.address?.trim()){
      incidents.push({
        id:`address_${client.id}`,severity:'info',category:'client',clientId:client.id,
        title:`${client.name} sin dirección`,
        detail:'No se podrá abrir la ubicación desde la ruta.',
        action:`openClientForm('${client.id}')`,actionLabel:'COMPLETAR'
      });
    }
  });

  Object.entries(day.payments||{}).forEach(([clientId,payments])=>{
    const client=state.clients.find(item=>item.id===clientId);
    if(!Array.isArray(payments)){
      incidents.push({
        id:`payments_collection_${clientId}`,severity:'critical',category:'data',clientId,
        title:`Pagos inválidos en ${client?.name||clientId}`,
        detail:'La colección de pagos no tiene un formato válido.',
        action:'showControlCenter()',actionLabel:'CONTROL TÉCNICO'
      });
      return;
    }
    payments.forEach((payment,index)=>{
      if(!payment.id||Number(payment.amount)<=0||!['cash','transfer'].includes(payment.method)){
        incidents.push({
          id:`payment_${clientId}_${payment.id||index}`,severity:'critical',category:'data',clientId,
          title:`Pago inconsistente en ${client?.name||clientId}`,
          detail:`Monto: ${money(payment.amount)} · Forma: ${payment.method||'sin definir'}.`,
          action:`openPayment('${clientId}')`,actionLabel:'CORREGIR'
        });
      }
    });
  });

  pendingVirtualCredits(day).forEach(item=>{
    incidents.push({
      id:`virtual_credit_${item.paymentId}`,
      severity:'critical',
      category:'closing',
      clientId:item.clientId,
      title:`Saldo virtual pendiente en ${item.client.name}`,
      detail:`${money(item.amount)} cobrados por encima de la deuda deben confirmarse como acreditados en PINWEB antes del cierre.`,
      action:'openCloseChecklist()',
      actionLabel:'REVISAR ACREDITACIÓN'
    });
  });

  if(totals.cash<0||totals.transfer<0||totals.paid<0){
    incidents.push({
      id:'negative_totals',severity:'critical',category:'data',
      title:'Totales operativos inválidos',
      detail:`Cobrado: ${money(totals.paid)} · Efectivo: ${money(totals.cash)} · Transferencias: ${money(totals.transfer)}.`,
      action:'showControlCenter()',actionLabel:'DIAGNOSTICAR'
    });
  }
  if(totals.expectedCash<0){
    incidents.push({
      id:'negative_expected_cash',severity:'warning',category:'closing',
      title:'El efectivo esperado quedó negativo',
      detail:`Resultado esperado: ${money(totals.expectedCash)}. Los egresos en efectivo superan el capital inicial y lo cobrado; se conciliará con el efectivo real y una justificación.`,
      action:'openClosePreview()',actionLabel:'CONCILIAR'
    });
  }
  if(totals.expectedTransfer<0){
    incidents.push({
      id:'negative_expected_transfer',severity:'warning',category:'closing',
      title:'El neto esperado de transferencias quedó negativo',
      detail:`Resultado esperado: ${money(totals.expectedTransfer)}. Los egresos por transferencia superan lo cobrado durante la jornada; se revisará en la conciliación.`,
      action:'openClosePreview()',actionLabel:'CONCILIAR'
    });
  }

  detectCarryoverMismatches(day).forEach(item=>{
    incidents.push({
      id:`carryover_${item.client.id}`,
      severity:item.financialActivity?'critical':'warning',
      category:'data',
      clientId:item.client.id,
      title:`Saldo anterior inconsistente en ${item.client.name}`,
      detail:`La jornada abrió con ${money(item.current||0)} y el último cierre indica ${money(item.expected)}${item.sourceDate?` (${item.sourceDate})`:''}.`,
      action:'showCarryoverReview()',
      actionLabel:'REVISAR ARRASTRE'
    });
  });

  const reconciliation=getReconciliation(day.date);
  if(reconciliation){
    const {cashDifference,transferDifference}=reconciliationDifferenceSummary(reconciliation);
    if(cashDifference||transferDifference){
      incidents.push({
        id:'reconciliation_difference',severity:'warning',category:'closing',
        title:'Conciliación con diferencia',
        detail:`Efectivo: ${money(cashDifference)} · Transferencias: ${money(transferDifference)}.`,
        action:'openClosePreview()',actionLabel:'REVISAR'
      });
    }
  }

  const expenses=state.expenses.filter(expense=>expense.dayDate===day.date);
  expenses.forEach(expense=>{
    if(Number(expense.amount)<=0||!['cash','transfer'].includes(expense.method||'cash')){
      incidents.push({
        id:`expense_${expense.id}`,severity:'critical',category:'data',
        title:'Gasto operativo inconsistente',
        detail:`${expense.detail||expense.category||'Sin detalle'} · ${money(expense.amount)}.`,
        action:'showExpenses()',actionLabel:'CORREGIR'
      });
    }
  });

  return incidents;
}
function incidentSeverityLabel(severity){
  return {critical:'CRÍTICA',warning:'ADVERTENCIA',info:'INFORMATIVA'}[severity]||severity;

function incidentBadgeClass(severity){

function incidentCategoryLabel(category){

function filteredOperationalIncidents(){

}
function setIncidentFilter(filter){

}
function exportOperationalIncidents(){
  if(!state.day)return toast('No hay una jornada activa');
  const rows=filteredOperationalIncidents();
  const lines=[
    'CML VIRTUAL - INCIDENCIAS OPERATIVAS',
    `Jornada: ${state.day.date}`,
    `Generado: ${new Date().toLocaleString('es-AR')}`,
    `Filtro: ${state.incidentFilter}`,
    `Cantidad: ${rows.length}`,
    ''
  ];
  if(!rows.length)lines.push('Sin incidencias para el filtro seleccionado.');
  rows.forEach((item,index)=>{
    lines.push(`${index+1}. [${incidentSeverityLabel(item.severity)}] ${item.title}`);
    lines.push(`   Categoría: ${incidentCategoryLabel(item.category)}`);
    lines.push(`   ${item.detail}`);
  });
  const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`CML_incidencias_${state.day.date}.txt`;
  a.click();
  URL.revokeObjectURL(a.href);
  auditLog('operational_incidents_exported','Incidencias operativas exportadas',{
    dayDate:state.day.date,records:rows.length,filter:state.incidentFilter
  });
  toast('Incidencias exportadas');
}
function unresolvedClosingWarnings(day=state.day){
  return operationalIncidents(day).filter(item=>item.severity==='warning'&&['route','closing'].includes(item.category));
}
function closeChecklist(day=state.day){
  const totals=calcDay(day);
  const clients=operationalClients(day);
  const unmanaged=clients.filter(c=>clientRouteStatus(c,day).key==='pending');
  const invalidPayments=[];
  Object.entries(day.payments||{}).forEach(([clientId,payments])=>{
    (payments||[]).forEach(payment=>{
      if(!payment.id||Number(payment.amount)<=0||!['cash','transfer'].includes(payment.method)){
        invalidPayments.push({clientId,payment});
      }
    });
  });
  const importReady=accreditationImportReady(day);
  const currentFingerprint=dailyLoadFingerprint(day);
  const routeSnapshotValid=Boolean(day.routeSnapshot?.fingerprint&&day.routeSnapshot.fingerprint===currentFingerprint);
  const incidents=operationalIncidents(day);
  const criticalIncidents=incidents.filter(item=>item.severity==='critical');
  const warningIncidents=incidents.filter(item=>item.severity==='warning');
  const virtualCreditsPending=pendingVirtualCredits(day);
  return {
    importReady,
    routeSnapshotValid,
    unmanaged,
    invalidPayments,
    incidents,
    criticalIncidents,
    warningIncidents,
    virtualCreditsPending,
    negativeTotals:totals.cash<0||totals.transfer<0||totals.paid<0,
    totals,
    openingCashValid:Number.isFinite(totals.openingCash)&&totals.openingCash>=0,
    criticalCount:criticalIncidents.length,
    warningCount:warningIncidents.length
  };
}

function bankDepositValuesFromDom(totals=calcDay(state.day)){
  const cashRaw=document.getElementById('bankDepositCash')?.value?.trim()??'';
  const transferRaw=document.getElementById('bankDepositTransfer')?.value?.trim()??'';
  const cashDeposited=cashRaw===''?null:parseMoneyInput(cashRaw);
  const transferDeposited=transferRaw===''?null:parseMoneyInput(transferRaw);
  const cashCommission=cashDeposited===null?0:roundCurrency(cashDeposited*BANK_CASH_COMMISSION_RATE);
  const cashNotDeposited=cashDeposited===null?null:roundCurrency(Math.max(0,totals.cash-cashDeposited));
  const transferNotIncluded=transferDeposited===null?null:roundCurrency(Math.max(0,totals.transfer-transferDeposited));
  const note=document.getElementById('bankDepositNote')?.value?.trim()||'';
  const completed=cashDeposited!==null&&transferDeposited!==null;
  const exceedsCollected=completed&&(cashDeposited>totals.cash+0.005||transferDeposited>totals.transfer+0.005);
  return {
    cashDeposited,
    transferDeposited,
    cashCommissionRate:BANK_CASH_COMMISSION_RATE,
    transferCommissionRate:0,
    cashCommission,
    bankCommission:cashCommission,
    cashNotDeposited,
    transferNotIncluded,
    totalDeclared:completed?roundCurrency(cashDeposited+transferDeposited):null,
    note,
    completed,
    exceedsCollected
  };
}

function reconciliationValues(){
  const totals=calcDay(state.day);
  const cash=cashBreakdownFromDom();
  const countedCash=parseMoneyInput(document.getElementById('countedCash')?.value);

    countedCash,
    expectedCash:totals.expectedCash,
    verifiedTransfer,

  });

function canReopenDay(day){
  if(!day||day.status!=='closed')return {allowed:false,reason:'La jornada no está cerrada'};
  if(day.date!==dateKey())return {allowed:false,reason:'Solo puede reabrirse la jornada cerrada de hoy'};
  if(state.history.some(item=>item.date>day.date))return {allowed:false,reason:'Existe una jornada posterior'};
  if(Number(day.reopenCount||0)>=3)return {allowed:false,reason:'Se alcanzó el límite de reaperturas'};
  return {allowed:true,reason:''};
}
function reconstructPreCloseBalances(day){
  const result={};
  operationalClients(day).forEach(client=>{
    if(day.preCloseBalances&&Number.isFinite(Number(day.preCloseBalances[client.id]))){
      result[client.id]=Number(day.preCloseBalances[client.id]);
    }else{
      const accreditation=Number(day.accreditations?.[client.id]||0);
      const visitCredit=Number(day.visitCredits?.[client.id]||0);
      const paid=(day.payments?.[client.id]||[]).reduce((sum,payment)=>sum+Number(payment.amount||0),0);
      result[client.id]=Math.max(0,Number(client.balance||0)-accreditation-visitCredit+paid);
    }
  });
  return result;
}
function reopenResumeStatus(day){
  const hasRouteActivity=operationalClients(day).some(client=>
    routePaymentsFor(client.id,day).length>0||clientRouteStatus(client,day).key!=='pending'
  );
  return hasRouteActivity?'active':'preparation';
}
function openReopenDay(dayDate){
  const day=state.history.find(item=>item.date===dayDate)||state.day;
  const permission=canReopenDay(day);

      <p class="note">Para cerrarla nuevamente será obligatorio realizar una nueva conciliación.</p>
      ${legacy?`<p class="danger-text"><b>La jornada fue cerrada con una versión anterior. Los saldos previos serán reconstruidos matemáticamente y se creará una copia de emergencia.</b></p>`:''}
    </div>
    <div class="field"><label>Motivo de reapertura</label><textarea id="reopenReason" class="input" placeholder="Ej.: se registró un pago con monto incorrecto"></textarea></div>
    <div class="field"><label>Confirmación</label><input id="reopenConfirm" class="input" placeholder="Escribí REABRIR"></div>
    <button class="btn danger" onclick="confirmReopenDay('${day.date}')">REABRIR JORNADA</button>
    <button class="btn secondary" style="margin-top:10px" onclick="closeSheet()">CANCELAR</button>`);

async function confirmReopenDay(dayDate){
  const day=state.history.find(item=>item.date===dayDate)||state.day;
  const permission=canReopenDay(day);
  if(!permission.allowed)return toast(permission.reason);
  const reason=document.getElementById('reopenReason')?.value.trim()||'';
  const confirmation=document.getElementById('reopenConfirm')?.value.trim().toUpperCase()||'';
  if(reason.length<10)return toast('Ingresá un motivo claro de al menos 10 caracteres');
  if(confirmation!=='REABRIR')return toast('Escribí REABRIR para confirmar');
  if(!confirm('¿Confirmar la reapertura? Se anulará la conciliación actual.'))return;

  await createEmergencySnapshot('before_day_reopen',true);
  const previousBalances=reconstructPreCloseBalances(day);
  const previousClosure={
    closedAt:day.closedAt||null,
    summary:cloneData(day.summary||null),
    reconciliation:cloneData(day.reconciliation||getReconciliation(day.date)||null),
    reopenedAt:Date.now(),
    reason
  };
  const resumeStatus=reopenResumeStatus(day);

  try{
    for(const client of operationalClients(day)){
      if(previousBalances[client.id]===undefined)continue;
      client.balance=Number(previousBalances[client.id]);
      client.updatedAt=Date.now();
      await put('clients',client);
    }
    if(getReconciliation(day.date)){
      await del('reconciliations',day.date);
      state.reconciliations=state.reconciliations.filter(item=>item.dayDate!==day.date);
    }

    day.closureHistory=Array.isArray(day.closureHistory)?day.closureHistory:[];
    day.closureHistory.push(previousClosure);
    day.reopenHistory=Array.isArray(day.reopenHistory)?day.reopenHistory:[];
    day.reopenHistory.push({reopenedAt:Date.now(),reason,legacyBalanceReconstruction:!day.preCloseBalances});
    day.reopenCount=Number(day.reopenCount||0)+1;
    day.lastReopenedAt=Date.now();
    day.lastReopenReason=reason;
    day.status=resumeStatus;
    day.reconciliationVoidedAt=Date.now();
    day.reconciliationVoidReason=reason;
    delete day.closedAt;
    delete day.summary;
    delete day.reconciliation;
    delete day.closingDraft;
    state.closingDraft=null;
    state.day=day;

    await put('days',day);
    await auditLog('day_reopened','Jornada reabierta',{
      dayDate:day.date,reason,reopenCount:day.reopenCount,
      legacyBalanceReconstruction:!day.preCloseBalances,resumeStatus
    });
    await createEmergencySnapshot('day_reopened',true);
    closeSheet();
    render();
    toast(resumeStatus==='preparation'
      ?'Jornada reabierta en preparación. Revisá la carga financiera'
      :'Jornada reabierta. Debe conciliarse nuevamente');
  }catch(error){
    console.error(error);
    toast('No se pudo reabrir la jornada');
  }
}

function addCalendarDays(dateString,days=1){
  const [year,month,day]=String(dateString||dateKey()).split('-').map(Number);
  const date=new Date(year,month-1,day+days,12,0,0);
  return [
    date.getFullYear(),
    String(date.getMonth()+1).padStart(2,'0'),
    String(date.getDate()).padStart(2,'0')
  ].join('-');
}
function nextOperationalDate(closedDate){
  const today=dateKey();
  return String(closedDate||'')<today?today:'';
}
async function createDayForDate(dayDate,{source='manual'}={}){
  const today=dateKey();
  if(!/^\d{4}-\d{2}-\d{2}$/.test(String(dayDate||'')))return toast('La fecha de la jornada no es válida');
  if(dayDate>today)return toast('No se puede abrir una jornada futura');
  const allDays=await getAll('days');
  const existing=allDays.find(day=>day.date===dayDate);
  if(existing){
    state.day=existing;
    state.history=allDays.sort((a,b)=>b.date.localeCompare(a.date));
    state.tab='today';
    render();
    toast(existing.status==='closed'?'Esa jornada ya está cerrada':'Jornada existente abierta');
    return existing;
  }
  const anotherOpenDay=allDays
    .filter(day=>day.status!=='closed'&&day.date!==dayDate)
    .sort((a,b)=>b.date.localeCompare(a.date))[0]||null;
  if(anotherOpenDay){
    state.day=anotherOpenDay;
    state.history=allDays.sort((a,b)=>b.date.localeCompare(a.date));
    state.tab='today';
    render();
    toast(`Primero cerrá la jornada abierta del ${anotherOpenDay.date}`);
    return anotherOpenDay;
  }

  const activeClients=state.clients.filter(client=>client.active!==false);
  state.day={
    date:dayDate,
    status:'preparation',
    createdAt:Date.now(),
    openingCash:Number(state.settings.capital||0),
    openingCashConfirmed:false,
    clientIds:activeClients.map(client=>client.id),
    routeOrder:[],
    openingBalances:Object.fromEntries(
      activeClients.map(client=>[client.id,expectedOpeningBalanceForClient(client,dayDate).amount])
    ),
    accreditations:Object.fromEntries(activeClients.map(client=>[client.id,0])),
    payments:Object.fromEntries(activeClients.map(client=>[client.id,[]])),
    visits:{},
    note:'',
    dailyLoad:null,
    accreditationImport:null,
    createdFrom:source
  };
  await saveDay();
  await auditLog('day_started','Día operativo iniciado',{dayDate,source});
  await createEmergencySnapshot('new_day_started',true);
  state.tab='today';
  render();
  toast(`Nueva jornada abierta: ${dayDate}`);
  return state.day;
}
async function startDay(){
  return createDayForDate(dateKey(),{source:'manual'});

async function startNextDay(closedDate=state.day?.date){

    const previousBalance=dayOpeningBalance(client,day);
    const accreditation=Number(day?.accreditations?.[client.id]||0);
    const payments=day?.payments?.[client.id]||[];
    const paid=payments.reduce((sum,payment)=>sum+Number(payment.amount||0),0);
    if(previousBalance!==0||accreditation!==0||paid!==0)hasClientData=true;
    previousBalanceTotal+=previousBalance;
    accreditationTotal+=accreditation;
    paymentTotal+=paid;
    clientToCollect+=Math.max(0,previousBalance+accreditation-paid);
    payments.forEach(payment=>{
      if(payment.method==='cash')cashPayments+=Number(payment.amount||0);
      if(payment.method==='transfer')transferPayments+=Number(payment.amount||0);
    });
  });
  const capital=Number(day?.dailyLoad?.capital??dayOpeningCash(day)??200000);
  const pinAdvance=Number(day?.dailyLoad?.pinAdvance||0);
  const bagBalance=Number(day?.dailyLoad?.bagBalance||0);
  const loans=Number(day?.dailyLoad?.loans||0);
  const todayBalances=Number(day?.dailyLoad?.todayBalances||0);
  const todaySales=Number(day?.dailyLoad?.todaySales||0);
  const cash=Number(day?.dailyLoad?.cash||0);
  const manualToCollect=Number(day?.dailyLoad?.manualToCollect||0);
  const bankDiscount=Math.max(0,Number(day?.dailyLoad?.bankDiscount||0));
  const toCollect=hasClientData?clientToCollect:manualToCollect;
  const balanceToCollect=hasClientData?accreditationTotal:manualToCollect;
  const receivableChange=hasClientData?toCollect-previousBalanceTotal:0;
  const bagTotal=roundCurrency(bagBalance+todayBalances-todaySales+cash+balanceToCollect-capital-pinAdvance-loans);
  const netProfit=roundCurrency(bagTotal-bankDiscount);
  const debtors=clients.filter(client=>clientDue(client,day)>0).length;
  return {
    capital,pinAdvance,bagBalance,loans,todayBalances,todaySales,cash,manualToCollect,bankDiscount,
    previousBalanceTotal,accreditationTotal,paymentTotal,cashPayments,transferPayments,
    clientToCollect,toCollect,balanceToCollect,receivableChange,bagTotal,netProfit,hasClientData,debtors,clients:clients.length
  };
}
function sanitizeCargaId(cod){
  return String(cod).replace(/[^A-Za-z0-9_-]/g,'_');

function actualizarTotalCargaOriginal(){

    let hayClientes=false;
    clientesCargaActual().forEach(client=>{
      const sid=sanitizeCargaId(client.id);
      const saldoAnterior=dayOpeningBalance(client,state.day);
      const acred=parseMoneyInput(document.getElementById(`acred_${sid}`)?.value);
      const pago=parseMoneyInput(document.getElementById(`pago_${sid}`)?.value);
      if(saldoAnterior!==0||acred!==0||pago!==0)hayClientes=true;

    });
    const totalACobrar=document.getElementById('totalACobrar');
    if(totalACobrar)totalACobrar.textContent=`Total a cobrar: $${fmt(totalACobrarClientes)}`;

    const capital=parseMoneyInput(document.getElementById('capital')?.value);
    const adelantoPin=parseMoneyInput(document.getElementById('adelantoPin')?.value);
    const saldoBolsaTotal=parseMoneyInput(document.getElementById('saldoBolsaTotal')?.value);
    const prestamos=parseMoneyInput(document.getElementById('prestamos')?.value);
    const saldosHoyTotal=parseMoneyInput(document.getElementById('saldosHoyTotal')?.value);
    const ventasHoyTotal=parseMoneyInput(document.getElementById('ventasHoyTotal')?.value);
    const efectivoTotal=parseMoneyInput(document.getElementById('efectivoTotal')?.value);
    const aCobrarManual=document.getElementById('aCobrarManual')?.value;
    const descuentoBancario=Math.max(0,parseMoneyInput(document.getElementById('descuentoBancario')?.value));
    const aCobrarBalance=hayClientes?acreditacionesHoy:parseMoneyInput(aCobrarManual);
    const gananciaBruta=roundCurrency(saldoBolsaTotal+saldosHoyTotal-ventasHoyTotal+efectivoTotal+aCobrarBalance-capital-adelantoPin-prestamos);
    const gananciaNeta=roundCurrency(gananciaBruta-descuentoBancario);
    const gananciaBrutaEl=document.getElementById('gananciaBruta');
    const descuentoEl=document.getElementById('descuentoBancarioVista');
    const totalBolsa=document.getElementById('totalBolsa');
    if(gananciaBrutaEl)gananciaBrutaEl.textContent=`$${fmt(gananciaBruta)}`;
    if(descuentoEl)descuentoEl.textContent=`-$${fmt(descuentoBancario)}`;
    if(totalBolsa)totalBolsa.textContent=`$${fmt(gananciaNeta)}`;
  }catch(err){
    console.error('Error en actualizarTotal:',err);
  }
}
function validarCargaFinancieraObligatoria(){
  const errors=[];
  const generalFields=[
    ['capital','Capital'],['adelantoPin','Adelanto PIN'],['saldoBolsaTotal','Saldo en bolsa'],
    ['prestamos','Préstamos'],['saldosHoyTotal','Saldos de hoy'],['ventasHoyTotal','Ventas de hoy'],
    ['efectivoTotal','Efectivo'],['aCobrarManual','A cobrar manual'],['descuentoBancario','Descuento bancario']
  ];
  generalFields.forEach(([id,label])=>{
    const element=document.getElementById(id);
    element?.classList.remove('campo-alerta');
    if(element&&parseMoneyInput(element.value)<0){
      element.classList.add('campo-alerta');
      errors.push(`${label}: no puede ser negativo`);
    }
  });

  clientesCargaActual().forEach(client=>{
    const sid=sanitizeCargaId(client.id);
    const accreditation=document.getElementById(`acred_${sid}`);
    const payment=document.getElementById(`pago_${sid}`);
    const method=document.getElementById(`forma_${sid}`);
    accreditation?.classList.remove('campo-alerta');
    payment?.classList.remove('campo-alerta');
    method?.classList.remove('campo-alerta');
    const accreditationAmount=parseMoneyInput(accreditation?.value);
    const paymentAmount=parseMoneyInput(payment?.value);
    if(accreditationAmount<0){
      accreditation?.classList.add('campo-alerta');
      errors.push(`${client.name}: la acreditación no puede ser negativa`);
    }
    if(paymentAmount<0){
      payment?.classList.add('campo-alerta');
      errors.push(`${client.name}: el pago no puede ser negativo`);
    }
    if(paymentAmount>0&&!method?.value){
      method?.classList.add('campo-alerta');
      errors.push(`${client.name}: seleccioná la forma del pago`);
    }
  });

  if(errors.length){
    const alertBox=document.getElementById('alertaMontos');
    if(alertBox){
      alertBox.innerHTML='<strong>Corregí la carga antes de continuar:</strong>'+errors.map(error=>`• ${escapeHtml(error)}`).join('<br>');
      alertBox.style.display='block';
      alertBox.scrollIntoView({behavior:'smooth',block:'center'});
    }
    toast(errors[0],'error');
    return false;
  }
  return true;
}

async function guardarCargaOriginalEnSistema(totalACobrar,total){
  const clients=clientesCargaActual();
  const nextAccreditations={...(state.day.accreditations||{})};
  const nextPayments={...(state.day.payments||{})};

  clients.forEach(client=>{
    const sid=sanitizeCargaId(client.id);
    const clientId=client.id;
    const acred=parseMoneyInput(document.getElementById(`acred_${sid}`)?.value);
    const pago=parseMoneyInput(document.getElementById(`pago_${sid}`)?.value);
    const forma=document.getElementById(`forma_${sid}`)?.value||'';
    const existing=state.day.payments?.[clientId]||[];
    const previousPreparation=existing.find(payment=>payment.source==='daily_load')||null;
    const preserved=existing.filter(payment=>payment.source!=='daily_load');

    nextAccreditations[clientId]=acred;
    nextPayments[clientId]=pago!==0?[...preserved,{
      id:previousPreparation?.id||crypto.randomUUID?.()||'pay_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
      amount:pago,
      method:forma==='Efectivo'?'cash':forma==='Transferencia'?'transfer':'',
      source:'daily_load',
      createdAt:previousPreparation?.createdAt||Date.now(),
      updatedAt:Date.now()
    }]:preserved;
  });

  const capital=parseMoneyInput(document.getElementById('capital')?.value);
  const adelantoPin=parseMoneyInput(document.getElementById('adelantoPin')?.value);
  const saldoBolsaTotal=parseMoneyInput(document.getElementById('saldoBolsaTotal')?.value);
  const prestamos=parseMoneyInput(document.getElementById('prestamos')?.value);
  const saldosHoyTotal=parseMoneyInput(document.getElementById('saldosHoyTotal')?.value);
  const ventasHoyTotal=parseMoneyInput(document.getElementById('ventasHoyTotal')?.value);
  const efectivoTotal=parseMoneyInput(document.getElementById('efectivoTotal')?.value);
  const aCobrarManual=parseMoneyInput(document.getElementById('aCobrarManual')?.value);
  const bankDiscount=Math.max(0,parseMoneyInput(document.getElementById('descuentoBancario')?.value));
  const netProfit=roundCurrency(total-bankDiscount);

  state.day.openingCash=capital;
  state.day.openingCashConfirmed=true;
  state.day.accreditations=nextAccreditations;
  state.day.payments=nextPayments;
  state.day.dailyLoad={
    source:'manual',
    confirmedAt:Date.now(),
    capital,
    pinAdvance:adelantoPin,
    bagBalance:saldoBolsaTotal,
    loans:prestamos,
    todayBalances:saldosHoyTotal,
    todaySales:ventasHoyTotal,
    cash:efectivoTotal,
    manualToCollect:aCobrarManual,
    bankDiscount,
    totals:{toCollect:totalACobrar,bagTotal:total,netProfit},
    clients:clients.length
  };
  const correctedSummary=dailyLoadSummary(state.day);
  state.day.dailyLoad.totals={
    toCollect:correctedSummary.toCollect,
    balanceToCollect:correctedSummary.balanceToCollect,
    previousBalanceTotal:correctedSummary.previousBalanceTotal,
    receivableChange:correctedSummary.receivableChange,
    bagTotal:correctedSummary.bagTotal,
    netProfit:correctedSummary.netProfit
  };
  state.day.accreditationImport=null;
  state.day.routeOrder=clients.map(client=>client.id);
  delete state.day.preRouteValidation;
  delete state.day.routeSnapshot;
  await saveDay();
}
async function generarResumenCargaOriginal(){
  try{
    if(!validarCargaFinancieraObligatoria())return;
    validarMontosCargaOriginal();

    const capital=document.getElementById('capital').value;
    const adelantoPin=document.getElementById('adelantoPin').value;
    const saldoBolsaTotal=document.getElementById('saldoBolsaTotal').value;
    const prestamos=document.getElementById('prestamos').value;
    const saldosHoyTotal=document.getElementById('saldosHoyTotal').value;
    const ventasHoyTotal=document.getElementById('ventasHoyTotal').value;
    const efectivoTotal=document.getElementById('efectivoTotal').value;
    const aCobrarManual=document.getElementById('aCobrarManual').value;
    const descuentoBancario=Math.max(0,parseMoneyInput(document.getElementById('descuentoBancario').value));

    let totalACobrar=0;
    let acreditacionesHoy=0;
    let hayDatos=false;
    let textoClientes='';

    clientesCargaActual().forEach(client=>{
      const sid=sanitizeCargaId(client.id);
      const saldoAnterior=dayOpeningBalance(client,state.day);
      const acred=parseMoneyInput(document.getElementById(`acred_${sid}`).value);
      const pago=parseMoneyInput(document.getElementById(`pago_${sid}`).value);
      const forma=document.getElementById(`forma_${sid}`).value;
      acreditacionesHoy+=acred;
      if(saldoAnterior!==0||acred!==0||pago!==0){
        hayDatos=true;
        const pendiente=Math.max(0,saldoAnterior+acred-pago);
        totalACobrar+=pendiente;
        textoClientes+=`${client.name}: saldo anterior ${fmt(saldoAnterior)}, acreditación ${fmt(acred)}, pagó ${fmt(pago)} ${forma||''} -> pendiente ${fmt(pendiente)}
`;
      }
    });

    if(!hayDatos){
      textoClientes='(sin datos cargados)\n';
      totalACobrar=parseMoneyInput(aCobrarManual);
    }

    let texto='CLIENTES (acreditaciones / pagó / forma):\n';
    texto+=textoClientes;
    texto+=`\nTotal a cobrar (pendiente): ${fmt(totalACobrar)}\n`;
    texto+='\nBALANCE BOLSA TOTAL\n';
    texto+=`Capital: ${fmt(capital)}\n`;
    texto+=`Adelanto PIN: ${fmt(adelantoPin)}\n`;
    texto+=`Saldo en bolsa: ${fmt(saldoBolsaTotal)}\n`;
    texto+=`Préstamos: ${fmt(prestamos)}\n`;
    texto+=`Saldos de hoy: ${fmt(saldosHoyTotal)}\n`;
    texto+=`Ventas de hoy: ${fmt(ventasHoyTotal)}\n`;
    texto+=`Efectivo: ${fmt(efectivoTotal)}\n`;
    const aCobrarBalance=hayDatos?acreditacionesHoy:totalACobrar;
    texto+=`A cobrar total de clientes: ${fmt(totalACobrar)}\n`;
    texto+=`A cobrar generado hoy para el balance: ${fmt(aCobrarBalance)}\n`;

    const total=roundCurrency(parseMoneyInput(saldoBolsaTotal)+parseMoneyInput(saldosHoyTotal)-parseMoneyInput(ventasHoyTotal)+parseMoneyInput(efectivoTotal)+aCobrarBalance-parseMoneyInput(capital)-parseMoneyInput(adelantoPin)-parseMoneyInput(prestamos));
    const gananciaNeta=roundCurrency(total-descuentoBancario);
    texto+=`Ganancia bruta: ${fmt(total)}\n`;
    texto+=`Descuento bancario: ${fmt(descuentoBancario)}\n`;
    texto+=`Ganancia neta: ${fmt(gananciaNeta)}\n`;

    const resultadoDiv=document.getElementById('resultado');
    resultadoDiv.textContent=texto;
    resultadoDiv.style.color='#c8e6ff';
    resultadoDiv.style.display='block';
    document.getElementById('copyBtn').style.display='block';
    resultadoDiv.scrollIntoView({behavior:'smooth',block:'center'});

    await guardarCargaOriginalEnSistema(totalACobrar,total);
    await auditLog('daily_load_confirmed','Resumen generado desde carga_diaria.html',{
      dayDate:state.day.date,totalACobrar,gananciaBruta:total,descuentoBancario,gananciaNeta

async function applyAccreditationImport(){
  const draft=state.accreditationDraft;
  if(!draft||!draft.items.length)return toast('No hay acreditaciones válidas');
  if(!state.day||state.day.status!=='preparation')return toast('La jornada ya no está en preparación');
  if(draft.errors.length)return toast('Corregí los errores antes de aplicar');
  if(draft.unknown.length&&!confirm(`Hay ${draft.unknown.length} cliente(s) no encontrado(s). ¿Aplicar únicamente las coincidencias?`))return;
  if(!confirm(`¿Aplicar ${draft.items.length} acreditaciones por ${money(draft.items.reduce((s,i)=>s+i.amount,0))}?`))return;
  const next={};
  operationalClients(state.day).forEach(c=>next[c.id]=0);
  draft.items.forEach(item=>next[item.clientId]=item.amount);
  state.day.accreditations=next;
  state.day.accreditationImport={
    source:draft.source,
    matched:draft.items.length,
    unknown:draft.unknown.length,

    total:draft.items.reduce((s,i)=>s+i.amount,0),

  };
  state.day.dailyLoad={
    source:'import',
    confirmedAt:state.day.accreditationImport.appliedAt,
    pinAdvance:Number(state.day.dailyLoad?.pinAdvance||state.settings.pinAdvance||0),
    bagBalance:Number(state.day.dailyLoad?.bagBalance||0),
    bankDiscount:Number(state.day.dailyLoad?.bankDiscount??state.settings.bankDiscountDefault??0),
    totals:{accredited:state.day.accreditationImport.total,paid:0,cash:0,transfer:0,toCollect:operationalClients(state.day).reduce((sum,client)=>sum+clientDue(client,state.day),0)},
    clients:operationalClients(state.day).length
  };
  state.day.routeOrder=operationalClients(state.day).map(client=>client.id);
  delete state.day.preRouteValidation;
  delete state.day.routeSnapshot;
  await saveDay();
  const record={
    id:'im_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    type:'daily_accreditations',
    dayDate:state.day.date,

function dailyLoadValidation(day=state.day){
  const rows=[],errors=[];
  let previous=0,accredited=0,paid=0,cash=0,transfer=0,toCollect=0;
  operationalClients(day).forEach(client=>{
    const openingBalance=dayOpeningBalance(client,day);
    const accreditation=Number(day?.accreditations?.[client.id]||0);
    const preparationPayments=(day?.payments?.[client.id]||[]).filter(payment=>payment.source==='daily_load');
    const preparationPaid=preparationPayments.reduce((sum,payment)=>sum+Number(payment.amount||0),0);
    const remaining=Math.max(0,openingBalance+accreditation-preparationPaid);
    if(!Number.isFinite(accreditation)||accreditation<0)errors.push(`${client.name}: acreditación inválida`);
    if(!Number.isFinite(preparationPaid)||preparationPaid<0)errors.push(`${client.name}: pago inválido`);
    if(preparationPayments.length>1)errors.push(`${client.name}: más de un pago cargado`);
    preparationPayments.forEach(payment=>{
      if(payment.method==='cash')cash+=Number(payment.amount||0);
      else if(payment.method==='transfer')transfer+=Number(payment.amount||0);
      else errors.push(`${client.name}: forma de pago inválida`);
    });
    previous+=openingBalance; accredited+=accreditation; paid+=preparationPaid; toCollect+=remaining;
    rows.push({
      clientId:client.id,name:client.name,openingBalance,accreditation,
      paid:preparationPaid,method:preparationPayments[0]?.method||'',remaining
    });
  });
  const debtors=rows.filter(row=>row.remaining>0);
  return {rows,errors,warnings:[],debtors,totals:{previous,accredited,paid,cash,transfer,toCollect},valid:errors.length===0};
}
function dailyLoadFingerprint(day=state.day){
  const validation=dailyLoadValidation(day);
  const source=[
    day?.date||'',dayOpeningCash(day),Number(day?.dailyLoad?.pinAdvance||0),Number(day?.dailyLoad?.bagBalance||0),Number(day?.dailyLoad?.bankDiscount||0),
    ...validation.rows.map(row=>[row.clientId,row.openingBalance,row.accreditation,row.paid,row.method,row.remaining].join(':'))
  ].join('|');
  let hash=2166136261;
  for(let index=0;index<source.length;index++){hash^=source.charCodeAt(index);hash=Math.imul(hash,16777619);}
  return (hash>>>0).toString(16).padStart(8,'0');
}

async function activateRoute(validated=false){

    return toast('La carga cambió. Volvé a revisarla antes de generar la ruta');
  }
  if(!state.day.openingCashConfirmed){
    if(!confirm(`El capital inicial está preestablecido en ${money(dayOpeningCash(state.day))}. ¿Confirmarlo y continuar?`))return;

  const debtors=routeClientsList.filter(client=>clientDue(client,state.day)>0);
  const total=Object.values(state.day.accreditations||{}).reduce((sum,value)=>sum+Number(value||0),0);
  const toCollect=debtors.reduce((sum,client)=>sum+clientDue(client,state.day),0);
  state.day.routeOrder=routeClientsList.map(client=>client.id);
  state.day.status='active';
  state.day.routeActivatedAt=Date.now();
  state.day.whatsappGeneratedAt=Date.now();

    createdAt:Date.now(),fingerprint:currentFingerprint,totalToCollect:toCollect,
    clients:routeClientsList.map(client=>({
      clientId:client.id,name:client.name,
      accreditation:Number(state.day.accreditations?.[client.id]||0),

  await saveDay();
  await auditLog('route_activated','Mensajes y hoja de ruta generados',{

function paidCount(d){return operationalClients(d).filter(c=>(d.payments[c.id]||[]).reduce((s,p)=>s+Number(p.amount||0),0)>0).length}
function calcDay(d){
  ensureDayCollections(d);
  let accredited=0,visitAmounts=0,paid=0,cash=0,transfer=0,currentPending=0;
  const snapshotByClient=new Map(
    (d.routeSnapshot?.clients||[]).map(item=>[item.clientId,Number(item.remaining||0)])
  );
  let plannedInitial=Number(d.routeSnapshot?.totalToCollect||0);
  let plannedRemaining=0;

  operationalClients(d).forEach(client=>{
    const accreditation=Number(d.accreditations?.[client.id]||0);
    const visitAmount=Number(d.visitCredits?.[client.id]||0);
    accredited+=accreditation;
    visitAmounts+=visitAmount;

    const routePayments=routePaymentsFor(client.id,d);
    const routePaid=routePayments.reduce((sum,payment)=>sum+Number(payment.amount||0),0);
    routePayments.forEach(payment=>{
      const amount=Number(payment.amount||0);
      paid+=amount;
      payment.method==='cash'?cash+=amount:transfer+=amount;
    });

    currentPending+=clientDue(client,d);

    const initialForClient=snapshotByClient.has(client.id)
      ?snapshotByClient.get(client.id)
      :Math.max(0,accreditation-(d.payments?.[client.id]||[])
        .filter(payment=>payment.source==='daily_load')
        .reduce((sum,payment)=>sum+Number(payment.amount||0),0));
    plannedRemaining+=Math.max(0,initialForClient-routePaid);
  });

  if(!d.routeSnapshot?.totalToCollect){
    plannedInitial=operationalClients(d).reduce((sum,client)=>{
      const accreditation=Number(d.accreditations?.[client.id]||0);
      const paidBefore=(d.payments?.[client.id]||[])
        .filter(payment=>payment.source==='daily_load')
        .reduce((subtotal,payment)=>subtotal+Number(payment.amount||0),0);
      return sum+Math.max(0,accreditation-paidBefore);
    },0);
  }

  plannedRemaining=Math.min(plannedInitial,plannedRemaining);
  const plannedCollected=Math.max(0,plannedInitial-plannedRemaining);
  const expense=expenseTotals(d.date);
  const loanPayments=state.loans.reduce((totals,loan)=>{
    (loan.payments||[]).forEach(payment=>{
      if(payment.dayDate!==d.date)return;
      const amount=Number(payment.amount||0);
      totals.total+=amount;
      payment.method==='transfer'?totals.transfer+=amount:totals.cash+=amount;
    });
    return totals;
  },{total:0,cash:0,transfer:0});

  const openingCash=dayOpeningCash(d);
  const expectedCash=openingCash+cash-expense.cash-loanPayments.cash;
  const expectedTransfer=transfer-expense.transfer-loanPayments.transfer;
  const totalFunds=cash+transfer;
  const bankCommission=Math.max(0,Number(
    d?.reconciliation?.bankCommission??
    d?.bankDeposit?.bankCommission??
    (d?.status==='closed'?d?.dailyLoad?.bankDiscount:0)??0
  ));

  return {
    accredited,visitAmounts,paid,cash,transfer,totalFunds,
    toCollect:plannedInitial,plannedInitial,plannedCollected,plannedRemaining,
    pending:currentPending,currentPending,
    expenses:expense.total,cashExpenses:expense.cash,transferExpenses:expense.transfer,
    loanPayments:loanPayments.total,loanCashPayments:loanPayments.cash,loanTransferPayments:loanPayments.transfer,
    bankCommission,
    openingCash,expectedCash,expectedTransfer,net:paid-expense.total-loanPayments.total-bankCommission
  };
}
