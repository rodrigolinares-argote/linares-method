function updatePaymentPreview(clientId){
  const day=state.day;
  if(!day)return;
  const client=state.clients.find(item=>item.id===clientId);
  const openingBalance=dayOpeningBalance(client,day);
  const accreditation=Number(day.accreditations?.[clientId]||0);
  const visitCredit=parseMoneyInput(document.getElementById('visitCreditAmount')?.value);
  const previousPaid=(day.payments?.[clientId]||[]).reduce((sum,payment)=>sum+Number(payment.amount||0),0);
  const newPayment=parseMoneyInput(document.getElementById('payAmount')?.value);
  const total=openingBalance+accreditation+visitCredit;
  const remaining=Math.max(0,total-previousPaid-newPayment);
  const totalEl=document.getElementById('paymentDayTotal');
  const remainingEl=document.getElementById('paymentRemaining');
  if(totalEl)totalEl.textContent=money(total);
  if(remainingEl)remainingEl.textContent=money(remaining);
}
async function saveVisitCredit(clientId,amount){
  ensureDayCollections(state.day);
  const normalized=roundCurrency(Math.max(0,Number(amount||0)));
  const previous=Number(state.day.visitCredits?.[clientId]||0);
  state.day.visitCredits[clientId]=normalized;
  if(previous!==normalized){
    const invalidated=invalidateVirtualCreditConfirmationsForClient(clientId,state.day);
    await saveDay();
    await auditLog('visit_credit_updated','Importe del día actualizado',{
      clientId,previous,amount:normalized,dayDate:state.day.date,virtualCreditConfirmationsInvalidated:invalidated
    });
  }
}

function findDayPayment(clientId,paymentId,day=state.day){
  const payments=day?.payments?.[clientId]||[];
  const index=payments.findIndex(payment=>payment.id===paymentId);
  return {payments,index,payment:index>=0?payments[index]:null};
}
function recalculateClientVisitState(clientId,day=state.day){
  if(!day)return;
  ensureDayCollections(day);
  const client=state.clients.find(c=>c.id===clientId);
  if(!client)return;
  const payments=day.payments?.[clientId]||[];
  const paid=payments.reduce((sum,p)=>sum+Number(p.amount||0),0);
  const total=dayOpeningBalance(client,day)+Number(day.accreditations?.[clientId]||0)+Number(day.visitCredits?.[clientId]||0);
  const previous=day.visits?.[clientId];

  if(total===0&&paid>0){
    day.visits[clientId]={
      status:'paid',
      reason:'Pago recibido durante la visita',
      followUpDate:'',
      note:previous?.note||'',
      updatedAt:Date.now(),
      followUpResolvedAt:Date.now(),
      followUpResolution:'Pago recibido durante la visita'
    };
    return;
  }
  if(paid>=total&&total>0){
    day.visits[clientId]={
      status:'paid',
      reason:'Pago registrado',
      followUpDate:'',
      note:previous?.note||'',
      updatedAt:Date.now(),
      followUpResolvedAt:Date.now(),
      followUpResolution:'Pago registrado'
    };
    return;
  }
  if(paid>0){
    day.visits[clientId]={
      status:'partial',
      reason:'Pago parcial registrado',
      followUpDate:previous?.followUpDate||'',
      note:previous?.note||'',
      updatedAt:Date.now(),
      followUpResolvedAt:null,
      followUpResolution:''
    };
    return;
  }
  if(previous?.status==='paid'||previous?.status==='partial'){
    delete day.visits[clientId];
  }
}
function latestDayPayment(day=state.day){
  if(!day)return null;
  let latest=null;
  Object.entries(day.payments||{}).forEach(([clientId,payments])=>{
    (payments||[]).forEach(payment=>{
      if(!latest||Number(payment.createdAt||0)>Number(latest.payment.createdAt||0)){
        latest={clientId,payment};
      }
    });
  });
  return latest;
}
function recentDayPayments(day=state.day,limit=5){
  if(!day)return [];
  const rows=[];
  Object.entries(day.payments||{}).forEach(([clientId,payments])=>{
    const client=state.clients.find(c=>c.id===clientId);
    (payments||[]).forEach(payment=>rows.push({clientId,client,payment}));
  });
  return rows.sort((a,b)=>Number(b.payment.createdAt||0)-Number(a.payment.createdAt||0)).slice(0,limit);
}
function compactTime(timestamp){
  return new Date(timestamp).toLocaleTimeString('es-AR',{
    hour:'2-digit',minute:'2-digit',hour12:false
  });
}
function recentPaymentClients(day=state.day){
  if(!day)return [];
  return Object.entries(day.payments||{}).map(([clientId,payments])=>{
    const client=state.clients.find(c=>c.id===clientId);
    const validPayments=(payments||[]).filter(payment=>payment.source!=='daily_load');
    if(!client||!validPayments.length)return null;
    const totalPaid=validPayments.reduce((sum,payment)=>sum+Number(payment.amount||0),0);
    const lastPayment=[...validPayments].sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0))[0];
    const remaining=clientDue(client,day);
    return {clientId,client,payments:validPayments,totalPaid,lastPayment,remaining};
  }).filter(Boolean).sort((a,b)=>Number(b.lastPayment.createdAt||0)-Number(a.lastPayment.createdAt||0));
}
function paymentReceiptText(clientId,paymentId,day=state.day){
  const client=state.clients.find(c=>c.id===clientId);
  const {payment}=findDayPayment(clientId,paymentId,day);
  if(!client||!payment)return '';
  const remaining=clientDue(client,day);
  return [
    'CML VIRTUAL - COMPROBANTE DE PAGO',
    `Fecha: ${day.date}`,
    `Cliente: ${client.name}`,
    `Monto recibido: ${money(payment.amount)}`,
    `Forma: ${paymentLabel(payment.method)}`,
    `Saldo pendiente: ${money(remaining)}`,
    `Hora: ${new Date(payment.createdAt).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})}`
  ].join('\n');
}

async function registerPayment(clientId,amount,method,source='manual'){
  if(state.paymentLock)throw new Error('El pago anterior todavía se está guardando');
  state.paymentLock=true;
  try{
    const client=state.clients.find(c=>c.id===clientId);
    if(!client||!state.day||state.day.status!=='active')throw new Error('Jornada o cliente inválido');
    const remaining=clientDue(client);
    if(amount<=0)throw new Error('Monto inválido');
    if(!['cash','transfer'].includes(method))throw new Error('Forma de pago inválida');

    const now=Date.now();
    const existing=(state.day.payments?.[clientId]||[]).find(payment=>
      Number(payment.amount)===Number(amount)&&
      payment.method===method&&
      now-Number(payment.createdAt||0)<8000
    );
    if(existing)throw new Error('Posible cobro duplicado: esperá unos segundos');

    state.day.payments[clientId]=state.day.payments[clientId]||[];
    const payment={id:crypto.randomUUID?.()||String(now),amount,method,createdAt:now,source};
    state.day.payments[clientId].push(payment);
    recalculateClientVisitState(clientId,state.day);
    await saveDay();
    state.lastPaymentAction={type:'created',clientId,paymentId:payment.id,createdAt:now};
    const totalPaidForClient=(state.day.payments?.[clientId]||[])
      .reduce((sum,item)=>sum+Number(item.amount||0),0);
    const totalObligationForClient=
      dayOpeningBalance(client,state.day)+
      Number(state.day.accreditations?.[clientId]||0)+
      Number(state.day.visitCredits?.[clientId]||0);
    const remainingAfterPayment=clientDue(client,state.day);
    const overpayment=Math.max(0,totalPaidForClient-totalObligationForClient);
    state.day.lastBalanceUpdate={
      updatedAt:Date.now(),
      clientId,
      paymentId:payment.id,
      amount,
      remaining:remainingAfterPayment,
      overpayment,
      totalPending:operationalClients(state.day).reduce((sum,item)=>sum+clientDue(item,state.day),0)
    };
    await saveDay();
    await auditLog('payment_created','Pago registrado y balance actualizado',{
      clientId,amount,method,source,paymentId:payment.id,
      remaining:remainingAfterPayment,
      overpayment,
      totalPending:state.day.lastBalanceUpdate.totalPending
    });
    return payment;
  }finally{
    state.paymentLock=false;
  }
}
async function quickFullPayment(clientId,method){
  const client=state.clients.find(c=>c.id===clientId);
  if(!client)return;
  if(state.paymentLock)return toast('Esperá a que termine el cobro anterior');
  const amount=clientDue(client);
  if(amount<=0)return toast('El cliente ya está saldado');
  const label=method==='cash'?'efectivo':'transferencia';
  if(!confirm(`¿Registrar ${money(amount)} de ${client.name} por ${label}?`))return;
  try{
    const payment=await registerPayment(clientId,amount,method,'quick_full');
    state.routeFilter='pending';
    closeSheet();
    render();
    showPaymentSuccess(clientId,payment.id);
  }catch(error){
    console.error(error);
    toast(error.message||'No se pudo registrar el pago');
  }
}
async function savePayment(id){
  if(state.paymentLock)return toast('Esperá a que termine el cobro anterior');
  const client=state.clients.find(c=>c.id===id);
  const visitCredit=parseMoneyInput(document.getElementById('visitCreditAmount')?.value);
  const amount=parseMoneyInput(document.getElementById('payAmount')?.value);
  const method=document.getElementById('payMethod')?.value;
  if(visitCredit<=0&&amount<=0)return toast('Ingresá el importe generado hoy o el monto recibido');

  try{
    await saveVisitCredit(id,visitCredit);

    if(amount>0){
      const payment=await registerPayment(id,amount,method,'manual');
      state.routeFilter='pending';
      closeSheet();
      render();
      showPaymentSuccess(id,payment.id);
    }else{
      recalculateClientVisitState(id,state.day);
      await saveDay();
      await auditLog('visit_credit_created','Crédito generado durante la visita',{
        clientId:id,amount:visitCredit,dayDate:state.day.date
      });
      state.routeFilter='pending';
      closeSheet();
      render();
      toast('Crédito registrado. Quedó saldo pendiente.');
    }
  }catch(error){
    console.error(error);
    toast(error.message||'No se pudo registrar la operación');
  }
}

async function saveEditedPayment(clientId,paymentId){
  if(state.paymentLock)return toast('Esperá a que termine la operación anterior');
  const client=state.clients.find(c=>c.id===clientId);
  const found=findDayPayment(clientId,paymentId);
  if(!client||!found.payment)return toast('No se encontró el pago');
  const amount=parseMoneyInput(document.getElementById('editPaymentAmount').value);
  const method=document.getElementById('editPaymentMethod').value;
  if(amount<=0)return toast('Ingresá un monto válido');
  if(!['cash','transfer'].includes(method))return toast('Forma de pago inválida');

  state.paymentLock=true;
  try{
    const previous={...found.payment};
    const invalidated=invalidateVirtualCreditConfirmationsForClient(clientId,state.day);
    found.payment.amount=amount;
    found.payment.method=method;
    found.payment.editedAt=Date.now();
    recalculateClientVisitState(clientId,state.day);
    await saveDay();
    state.lastPaymentAction={type:'edited',clientId,paymentId,previous,createdAt:Date.now()};
    await auditLog('payment_edited','Pago editado',{
      clientId,paymentId,
      previous:{amount:previous.amount,method:previous.method},
      next:{amount,method},
      virtualCreditConfirmationsInvalidated:invalidated
    });
    openPayment(clientId);
    render();
    toast('Pago actualizado');
  }finally{
    state.paymentLock=false;
  }
}
async function undoLastPayment(){
  const action=state.lastPaymentAction;
  if(!action)return toast('No hay una operación reciente para deshacer');
  if(Date.now()-Number(action.createdAt||0)>300000){
    state.lastPaymentAction=null;
    return toast('El plazo para deshacer venció');
  }
  if(!state.day||state.day.status!=='active')return toast('La ruta no está activa');
  const found=findDayPayment(action.clientId,action.paymentId);
  if(action.type==='created'){
    if(!found.payment)return toast('El pago ya no existe');
    const removed={...found.payment};
    invalidateVirtualCreditConfirmationsForClient(action.clientId,state.day);
    found.payments.splice(found.index,1);
    recalculateClientVisitState(action.clientId,state.day);
    await saveDay();
    await auditLog('payment_undo','Se deshizo un pago recién registrado',{
      clientId:action.clientId,paymentId:action.paymentId,amount:removed.amount,method:removed.method
    });
  }else if(action.type==='edited'){
    if(!found.payment||!action.previous)return toast('No se puede restaurar el pago');
    const current={...found.payment};
    invalidateVirtualCreditConfirmationsForClient(action.clientId,state.day);
    Object.assign(found.payment,action.previous,{restoredAt:Date.now()});
    recalculateClientVisitState(action.clientId,state.day);
    await saveDay();
    await auditLog('payment_edit_undo','Se deshizo la edición de un pago',{
      clientId:action.clientId,paymentId:action.paymentId,
      previous:{amount:current.amount,method:current.method},
      restored:{amount:action.previous.amount,method:action.previous.method}
    });
  }else{
    return toast('La operación no admite deshacer');
  }
  state.lastPaymentAction=null;
  closeSheet();
  render();
  toast('Operación deshecha');
}
async function deletePayment(clientId,paymentId){
  const payments=state.day.payments[clientId]||[];
  const index=payments.findIndex(p=>p.id===paymentId);
  if(index<0)return;
  const payment=payments[index];
  if(!confirm(`¿Eliminar el pago de ${money(payment.amount)}?`))return;
  const invalidated=invalidateVirtualCreditConfirmationsForClient(clientId,state.day);
  payments.splice(index,1);
  recalculateClientVisitState(clientId,state.day);
  await saveDay();
  state.lastPaymentAction=null;
  await auditLog('payment_deleted','Pago eliminado',{clientId,paymentId,amount:payment.amount,method:payment.method,virtualCreditConfirmationsInvalidated:invalidated});
  openPayment(clientId);
  render();
  toast('Pago eliminado');
}
async function closeDay(reconciliation=null){
  if(!reconciliation||typeof reconciliation!=='object')return openClosePreview();
  if(!state.day)return false;
  if(state.day.status==='closed'){toast('El día ya está cerrado');return false}
  try{
    const carryover=await reconcileOpeningBalancesForDay(state.day,{force:false,silent:true});
    if(carryover.unresolved.length){
      showCarryoverReview();
      toast('Revisá las diferencias de saldos antes de cerrar');
      return false;
    }
    const checklist=closeChecklist(state.day);
    if(checklist.criticalCount){toast('El cierre está bloqueado por inconsistencias');return false}
    if(reconciliation.dayDate!==state.day.date){toast('La conciliación no corresponde a esta jornada');return false}

    try{await createEmergencySnapshot('before_day_close',true)}catch(error){console.warn('No se pudo crear la copia previa al cierre',error)}

    const closingDay=cloneData(state.day);
    closingDay.reconciliation={...reconciliation};
    closingDay.bankDeposit={...reconciliation.bankDeposit};
    if(closingDay.dailyLoad){
      const correctedSummary=dailyLoadSummary(closingDay);
      closingDay.dailyLoad={...closingDay.dailyLoad,bankDiscount:roundCurrency(Number(reconciliation.bankCommission||0))};
      closingDay.dailyLoad.totals={
        ...(closingDay.dailyLoad.totals||{}),
        toCollect:correctedSummary.toCollect,
        balanceToCollect:correctedSummary.balanceToCollect,
        previousBalanceTotal:correctedSummary.previousBalanceTotal,
        receivableChange:correctedSummary.receivableChange,
        bagTotal:correctedSummary.bagTotal,
        netProfit:roundCurrency(correctedSummary.bagTotal-Number(reconciliation.bankCommission||0))
      };
    }
    const totals=calcDay(closingDay);
    closingDay.preCloseBalances={};
    const updatedAt=Date.now();
    const updatedClients=operationalClients(closingDay).map(client=>{
      closingDay.preCloseBalances[client.id]=dayOpeningBalance(client,closingDay);
      const due=
        dayOpeningBalance(client,closingDay)+
        Number(closingDay.accreditations?.[client.id]||0)+
        Number(closingDay.visitCredits?.[client.id]||0);
      const paid=(closingDay.payments?.[client.id]||[]).reduce((sum,payment)=>sum+Number(payment.amount||0),0);
      return {
        ...client,
        balance:Math.max(0,roundCurrency(due-paid)),
        updatedAt
      };
    });

    closingDay.status='closed';
    closingDay.closedAt=updatedAt;
    closingDay.summary=totals;
    closingDay.adjustments=closingDay.adjustments||[];
    delete closingDay.closingDraft;

    const reconciliationAudit=createAuditEntry('reconciliation_saved','Conciliación guardada',{
      dayDate:closingDay.date,
      cashDifference:reconciliation.cashDifference,
      transferDifference:reconciliation.transferDifference,
      cashBreakdown:reconciliation.cashBreakdown,
      unmanagedCount:(reconciliation.unmanagedClients||[]).length,
      unmanagedAcknowledged:true,
      transferReceived:reconciliation.transferCollected,
      transferPayments:reconciliation.transferPayments,
      transferNet:reconciliation.expectedTransfer,
      bankCashDeposited:reconciliation.bankCashDeposited,
      bankTransferDeposited:reconciliation.bankTransferDeposited,
      bankCommission:reconciliation.bankCommission
    },closingDay.date);
    const closeAudit=createAuditEntry('day_closed','Día cerrado',{
      summary:totals,
      reconciliation,
      preCloseBalances:closingDay.preCloseBalances,
      reopenCount:Number(closingDay.reopenCount||0),
      atomicCommit:true,
      persistenceVerified:false
    },closingDay.date);

    await commitClosedDayPackage(closingDay,updatedClients,reconciliation,[reconciliationAudit,closeAudit]);
    const verification=await verifyClosedDayPersistence(closingDay.date);
    if(!verification.valid)throw new Error('La verificación posterior no confirmó el cierre completo');
    closeAudit.meta.persistenceVerified=true;
    closeAudit.meta.persistenceVerifiedAt=Date.now();
    try{await put('audit',closeAudit)}catch(error){console.warn('El cierre quedó guardado, pero no se pudo actualizar la marca de verificación',error)}

    state.day=verification.day;
    state.reconciliations=state.reconciliations.filter(item=>item.dayDate!==reconciliation.dayDate);
    state.reconciliations.unshift(verification.reconciliation);
    state.audit.unshift(closeAudit,reconciliationAudit);
    const updatesById=new Map(updatedClients.map(client=>[client.id,client]));
    state.clients=state.clients.map(client=>updatesById.get(client.id)||client)
      .sort((a,b)=>(a.order||999)-(b.order||999)||a.name.localeCompare(b.name,'es'));
    state.history=(await getAll('days')).sort((a,b)=>b.date.localeCompare(a.date));

    try{
      const laterIssues=await reconcileOpenDaysAfterClose(closingDay.date);
      if(laterIssues.length)await auditLog('later_open_days_reviewed','Jornadas posteriores revisadas después del cierre',{sourceDay:closingDay.date,issues:laterIssues});
    }catch(error){
      console.warn('El cierre se guardó, pero no se pudieron revisar jornadas posteriores',error);
    }
    try{await createEmergencySnapshot('day_closed',true)}catch(error){console.warn('No se pudo crear la copia posterior al cierre',error)}

    state.dayCloseLock=false;
    closeSheet();
    state.tab='today';
    state.todayMode='dashboard';
    render();
    toast('Jornada cerrada y verificada correctamente');
    return true;
  }catch(error){
    console.error('No se pudo guardar el cierre completo',error);
    toast('No se guardó el cierre. La jornada continúa activa y los datos anteriores permanecen intactos.');
    return false;
  }
}

function exportDaySummary(dayDate){
  const d=state.history.find(x=>x.date===dayDate)||state.day;
  if(!d)return toast('No se encontró el día');
  const totals=calcDay(d);
  const r=d.reconciliation||getReconciliation(dayDate);
  const lines=[
    'CML VIRTUAL - RESUMEN DIARIO',
    `Fecha: ${dayDate}`,
    '',
    `Acreditado: ${money(totals.accredited)}`,
    `Cobrado: ${money(totals.paid)}`,
    `Efectivo: ${money(totals.cash)}`,
    `Transferencias: ${money(totals.transfer)}`,
    `Gastos: ${money(totals.expenses)}`,
    `Neto: ${money(totals.net)}`,
    `Pendiente: ${money(totals.pending)}`,
    '',
    `Origen de carga: ${d.dailyLoad?.source==='import'?'Importación':'Manual'}`,
    `Carga confirmada: ${d.dailyLoad?.confirmedAt?formatDateTime(d.dailyLoad.confirmedAt):'No'}`,
    `PINWEB importado: ${d.accreditationImport?'Sí':'No'}`,
    `Coincidencias PINWEB: ${d.accreditationImport?.matched||0}`,
    `Total importado PINWEB: ${money(d.accreditationImport?.total||0)}`,
    `Revisión previa a ruta: ${d.preRouteValidation?.confirmedAt?formatDateTime(d.preRouteValidation.confirmedAt):'No'}`,
    `Huella de control: ${d.routeSnapshot?.fingerprint||d.preRouteValidation?.fingerprint||'Sin huella'}`,
    `Orden de ruta: ${operationalClients(d).map(c=>c.name).join(' > ')}`,
    `Cantidad de reaperturas: ${Number(d.reopenCount||0)}`,
    ''
  ];
  if(Array.isArray(d.reopenHistory)&&d.reopenHistory.length){
    lines.push('REAPERTURAS');
    d.reopenHistory.forEach((item,index)=>lines.push(`${index+1}. ${formatDateTime(item.reopenedAt)} | ${item.reason}`));
    lines.push('');
  }
  if(r){
    lines.push('CONCILIACIÓN');
    lines.push(`Cierre con clientes sin gestionar: ${r.unmanagedClients?.length||0}`);
    if(r.unmanagedReason)lines.push(`Motivo: ${r.unmanagedReason}`);
    lines.push(`Efectivo contado: ${money(r.countedCash)}`);
    if(r.cashBreakdown){
      lines.push('Desglose de efectivo:');
      Object.entries(r.cashBreakdown).filter(([,qty])=>Number(qty)>0).sort((a,b)=>Number(b[0])-Number(a[0])).forEach(([value,qty])=>{
        lines.push(`  ${qty} x ${money(Number(value))} = ${money(Number(value)*Number(qty))}`);
      });
    }
    lines.push(`Transferencias verificadas: ${money(r.verifiedTransfer)}`);
    if(r.bankDeposit){
      lines.push(`Depositado en efectivo: ${money(r.bankDeposit.cashDeposited||0)}`);
      lines.push(`Correspondiente a transferencias: ${money(r.bankDeposit.transferDeposited||0)}`);
      lines.push(`Comisión bancaria efectivo (0,80%): ${money(r.bankDeposit.bankCommission||r.bankCommission||0)}`);
      if(r.bankDeposit.note)lines.push(`Observación del depósito: ${r.bankDeposit.note}`);
    }
    lines.push(`Diferencia total: ${money(reconciliationDifferenceSummary(r).totalDifference)}`);
    if(r.reason)lines.push(`Justificación: ${r.reason}`);
    lines.push('');
  }
  lines.push('CLIENTES');
  operationalClients(d).forEach(c=>{
    const accreditation=Number(d.accreditations?.[c.id]||0);
    const paid=(d.payments?.[c.id]||[]).reduce((sum,p)=>sum+Number(p.amount||0),0);
    const status=clientRouteStatus(c,d);
    const visit=visitRecord(c.id,d);
    const openingBalance=dayOpeningBalance(c,d);
    lines.push(`${c.name} | Saldo inicial: ${money(openingBalance)} | Acreditación: ${money(accreditation)} | Pagado: ${money(paid)} | Pendiente: ${money(clientDue(c,d))} | Estado: ${status.label}${visit?.reason?' | Motivo: '+visit.reason:''}${visit?.followUpDate?' | Seguimiento: '+visit.followUpDate:''}${visit?.followUpResolvedAt?' | Resolución: '+(visit.followUpResolution||'Resuelto'):''}`);
  });
  const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`CML_Resumen_${dayDate}.txt`;
  a.click();
  URL.revokeObjectURL(a.href);
  auditLog('day_summary_exported','Resumen diario exportado',{dayDate});
  toast('Resumen exportado');
}

function clientStatementDefaultRange(){
  const today=new Date();
  const from=new Date(today.getFullYear(),today.getMonth()-2,1);
  return {from:dateKey(from),to:dateKey(today)};
}
function clientStatementRange(){
  const defaults=clientStatementDefaultRange();
  return {
    from:state.statementFrom||defaults.from,
    to:state.statementTo||defaults.to
  };
}
function clientStatementRows(clientId){
  const client=state.clients.find(item=>item.id===clientId);
  if(!client)return [];
  const {from,to}=clientStatementRange();
  const days=[...state.history];
  if(state.day&&!days.some(day=>day.date===state.day.date))days.push(state.day);
  return days
    .filter(day=>day.date>=from&&day.date<=to)
    .sort((a,b)=>a.date.localeCompare(b.date))
    .map(day=>{
      const accreditation=Number(day.accreditations?.[clientId]||0);
      const payments=Array.isArray(day.payments?.[clientId])?day.payments[clientId]:[];
      const cash=payments.filter(payment=>payment.method==='cash').reduce((sum,payment)=>sum+Number(payment.amount||0),0);
      const transfer=payments.filter(payment=>payment.method==='transfer').reduce((sum,payment)=>sum+Number(payment.amount||0),0);
      const paid=cash+transfer;
      const opening=Number(day.preCloseBalances?.[clientId]);
      const hasOpening=Number.isFinite(opening);
      const closing=hasOpening?Math.max(0,opening+accreditation-paid):null;
      const visit=day.visits?.[clientId]||null;
      const relevant=hasOpening||accreditation||paid||visit;
      return {
        date:day.date,
        status:day.status,
        opening:hasOpening?opening:null,
        accreditation,
        cash,
        transfer,
        paid,
        closing,
        visit,
        relevant
      };
    })
    .filter(row=>row.relevant);
}
function clientStatementSummary(rows){
  const accredited=rows.reduce((sum,row)=>sum+row.accreditation,0);
  const cash=rows.reduce((sum,row)=>sum+row.cash,0);
  const transfer=rows.reduce((sum,row)=>sum+row.transfer,0);
  const paid=cash+transfer;
  const managed=rows.filter(row=>row.visit?.status&&row.visit.status!=='pending').length;
  const firstOpening=rows.find(row=>row.opening!==null)?.opening??null;
  const lastClosing=[...rows].reverse().find(row=>row.closing!==null)?.closing??null;
  return {accredited,cash,transfer,paid,managed,firstOpening,lastClosing};
}
function clientStatementVisitLabel(visit){
  if(!visit)return 'Sin gestión';

    paid:'Pagado',
    partial:'Pago parcial',
    visited:'Visitado',
    rescheduled:'Reprogramado',
    pending:'Pendiente'
  }[visit.status]||visit.status||'Sin gestión';
}

function setQuickClientStatementRange(clientId,type){
  const today=new Date();
  let from,to=dateKey(today);
  if(type==='month'){
    from=dateKey(new Date(today.getFullYear(),today.getMonth(),1));
  }else if(type==='previous'){
    from=dateKey(new Date(today.getFullYear(),today.getMonth()-1,1));
    to=dateKey(new Date(today.getFullYear(),today.getMonth(),0));
  }else if(type==='90'){
    const start=new Date(today);
    start.setDate(start.getDate()-89);
    from=dateKey(start);
  }else{
    from='2000-01-01';
  }
  state.statementFrom=from;
  state.statementTo=to;
  showClientStatement(clientId);
}

  ];
  rows.forEach((row,index)=>{
    lines.push(`${index+1}. ${row.date} | ${clientStatementVisitLabel(row.visit)} | ${row.status}`);
    if(row.opening!==null)lines.push(`   Saldo inicial: ${money(row.opening)}`);
    lines.push(`   Acreditación: ${money(row.accreditation)}`);
    lines.push(`   Efectivo: ${money(row.cash)} | Transferencia: ${money(row.transfer)}`);
    if(row.closing!==null)lines.push(`   Saldo final: ${money(row.closing)}`);
    if(row.visit?.reason)lines.push(`   Observación: ${row.visit.reason}`);
  });
  const blob=new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`CML_estado_cuenta_${normalizeClientKey(client.name).replace(/\s+/g,'_')}_${dateKey()}.txt`;
  a.click();
  URL.revokeObjectURL(a.href);
  auditLog('client_statement_exported','Estado de cuenta TXT exportado',{clientId,records:rows.length,...range});
  toast('Estado de cuenta TXT exportado');
}

function isLatestRegisteredDay(dayDate){
  const latest=[...state.history].sort((a,b)=>b.date.localeCompare(a.date))[0]||null;
  return Boolean(latest&&latest.date===dayDate);
}
function dayDeletionAssessment(day){
  if(!day)return {allowed:false,reason:'No se encontró la jornada'};
  if(!isLatestRegisteredDay(day.date))return {allowed:false,reason:'Por seguridad, las jornadas se eliminan desde la más reciente hacia atrás.'};
  const clientChanges=state.audit.filter(entry=>entry.dayDate===day.date&&['client_created','client_updated','client_deleted'].includes(entry.action));
  if(clientChanges.length)return {allowed:false,reason:'La jornada contiene cambios en fichas de clientes. Revisalos antes de eliminarla.'};
  if(day.status==='closed'){
    const missingOpening=(day.clientIds||[]).filter(clientId=>storedOpeningBalanceForClient(day,clientId)===null);
    if(missingOpening.length)return {allowed:false,reason:'Esta jornada es de una versión antigua y no conserva todos los saldos previos necesarios para una eliminación segura.'};
    const closeTime=Number(day.closedAt||0);
    const laterClientChanges=state.clients.filter(client=>(day.clientIds||[]).includes(client.id)&&Number(client.updatedAt||0)>closeTime+5000);
    if(laterClientChanges.length)return {allowed:false,reason:'Hay saldos o fichas de clientes modificados después de ese cierre. No se puede eliminar automáticamente.'};
  }
  const loanConflicts=state.loans.filter(loan=>
    loan.createdDay===day.date&&(loan.payments||[]).some(payment=>payment.dayDate&&payment.dayDate!==day.date)
  );
  if(loanConflicts.length)return {allowed:false,reason:'Hay préstamos creados ese día con pagos posteriores. No se puede eliminar sin revisar la deuda.'};
  return {allowed:true,reason:''};
}
function openDeleteDay(dayDate){
  const day=state.history.find(item=>item.date===dayDate)||(state.day?.date===dayDate?state.day:null);
  const assessment=dayDeletionAssessment(day);
  if(!assessment.allowed)return toast(assessment.reason,'error');
  const totals=calcDay(day);
  const relatedExpenses=state.expenses.filter(item=>item.dayDate===dayDate).length;
  const relatedImports=state.imports.filter(item=>item.dayDate===dayDate).length;
  const relatedLoans=state.loans.filter(loan=>loan.createdDay===dayDate||(loan.payments||[]).some(payment=>payment.dayDate===dayDate)).length;
  openSheet(`<div class="sheet-handle"></div><div class="adm61-shell"><section class="adm61-hero"><div class="adm61-kicker">ELIMINACIÓN CONTROLADA</div><div class="adm61-title">${formatLongDate(day.date)}</div><div class="adm61-copy">Solo se permite eliminar la jornada más reciente para poder restaurar los saldos anteriores sin romper el historial.</div><div class="adm61-metrics"><div class="adm61-metric"><span>ESTADO</span><b>${day.status==='closed'?'CERRADA':'ABIERTA'}</b></div><div class="adm61-metric"><span>COBRADO</span><b>${money(totals.paid)}</b></div><div class="adm61-metric"><span>GASTOS</span><b>${relatedExpenses}</b></div><div class="adm61-metric"><span>PRÉSTAMOS</span><b>${relatedLoans}</b></div></div></section><section class="adm61-section"><div class="adm61-head"><h3>Qué se eliminará</h3><span>Reversible con copia</span></div><p class="note">La jornada, su conciliación, gastos e importaciones asociadas. Los pagos de préstamos del día se revertirán; si un préstamo fue creado en esta jornada y no tiene movimientos posteriores, también se eliminará.</p><p class="danger-text"><b>Antes de borrar se creará una copia local de emergencia. Si la jornada estaba cerrada, los saldos de clientes volverán al valor que tenían al comenzar ese día.</b></p><div class="field"><label>Confirmación</label><input id="deleteDayConfirm" class="input" placeholder="Escribí ELIMINAR"></div><div class="field"><label>Motivo</label><textarea id="deleteDayReason" class="input" placeholder="Ej.: simulacro de prueba"></textarea></div><button class="btn danger" onclick="confirmDeleteDay('${day.date}')">ELIMINAR JORNADA</button><button class="btn secondary" style="margin-top:8px" onclick="showDayDetail('${day.date}')">CANCELAR</button></section></div>`);
}
function commitDayDeletionPackage(day,updatedClients,updatedLoans,deletedLoanIds,auditEntry){
  return new Promise((resolve,reject)=>{
    const stores=['days','reconciliations','expenses','imports','loans','clients','audit'];
    const transaction=state.db.transaction(stores,'readwrite');
    transaction.objectStore('days').delete(day.date);
    transaction.objectStore('reconciliations').delete(day.date);
    const expenseStore=transaction.objectStore('expenses');
    state.expenses.filter(item=>item.dayDate===day.date).forEach(item=>expenseStore.delete(item.id));
    const importStore=transaction.objectStore('imports');
    state.imports.filter(item=>item.dayDate===day.date).forEach(item=>importStore.delete(item.id));
    const loanStore=transaction.objectStore('loans');
    deletedLoanIds.forEach(id=>loanStore.delete(id));
    updatedLoans.forEach(loan=>loanStore.put(loan));
    const clientStore=transaction.objectStore('clients');
    updatedClients.forEach(client=>clientStore.put(client));
    transaction.objectStore('audit').put(auditEntry);
    transaction.oncomplete=()=>{scheduleEmergencySnapshot('day_deleted');resolve(true)};
    transaction.onerror=()=>reject(transaction.error||new Error('No se pudo eliminar la jornada'));
    transaction.onabort=()=>reject(transaction.error||new Error('La eliminación fue cancelada'));
  });
}
async function confirmDeleteDay(dayDate){
  const day=state.history.find(item=>item.date===dayDate)||(state.day?.date===dayDate?state.day:null);
  const assessment=dayDeletionAssessment(day);
  if(!assessment.allowed)return toast(assessment.reason,'error');
  const confirmation=document.getElementById('deleteDayConfirm')?.value?.trim().toUpperCase()||'';
  const reason=document.getElementById('deleteDayReason')?.value?.trim()||'';
  if(confirmation!=='ELIMINAR')return toast('Escribí ELIMINAR para confirmar');
  if(reason.length<3)return toast('Indicá el motivo de la eliminación');
  try{
    await createEmergencySnapshot('before_day_delete',true,day);
    const now=Date.now();
    const updatedClients=day.status==='closed'?state.clients.map(client=>{
      if(!(day.clientIds||[]).includes(client.id))return client;
      const previousBalance=storedOpeningBalanceForClient(day,client.id);
      return {...client,balance:Math.max(0,roundCurrency(Number(previousBalance||0))),updatedAt:now};
    }):[];
    const updatedLoans=[];
    const deletedLoanIds=[];
    state.loans.forEach(loan=>{
      const createdThisDay=loan.createdDay===day.date;
      const keptPayments=(loan.payments||[]).filter(payment=>payment.dayDate!==day.date);
      if(createdThisDay){
        deletedLoanIds.push(loan.id);
        return;
      }
      if(keptPayments.length!==(loan.payments||[]).length){
        const paid=keptPayments.reduce((sum,payment)=>sum+Number(payment.amount||0),0);
        const remaining=roundCurrency(Math.max(0,Number(loan.amount||0)-paid));
        updatedLoans.push({...loan,payments:keptPayments,remaining,status:remaining<=0?'paid':'active',paidAt:remaining<=0?(loan.paidAt||now):null});
      }
    });
    const auditEntry=createAuditEntry('day_deleted','Jornada eliminada de forma controlada',{
      dayDate:day.date,previousStatus:day.status,reason,
      collected:calcDay(day).paid,
      deletedExpenses:state.expenses.filter(item=>item.dayDate===day.date).length,
      deletedImports:state.imports.filter(item=>item.dayDate===day.date).length,
      deletedLoans:deletedLoanIds,
      revertedLoanPayments:updatedLoans.length,
      balancesRestored:updatedClients.length,
      atomicCommit:true
    },null);
    await commitDayDeletionPackage(day,updatedClients,updatedLoans,deletedLoanIds,auditEntry);
    if(updatedClients.length){
      const byId=new Map(updatedClients.map(client=>[client.id,client]));
      state.clients=state.clients.map(client=>byId.get(client.id)||client);
    }
    const updatedLoanMap=new Map(updatedLoans.map(loan=>[loan.id,loan]));
    state.loans=state.loans.filter(loan=>!deletedLoanIds.includes(loan.id)).map(loan=>updatedLoanMap.get(loan.id)||loan);
    state.expenses=state.expenses.filter(item=>item.dayDate!==day.date);
    state.imports=state.imports.filter(item=>item.dayDate!==day.date);
    state.reconciliations=state.reconciliations.filter(item=>item.dayDate!==day.date);
    state.audit.unshift(auditEntry);
    state.history=(await getAll('days')).sort((a,b)=>b.date.localeCompare(a.date));
    const today=dateKey();
    state.day=state.history.find(item=>item.date===today)||state.history.filter(item=>item.status!=='closed'&&item.date<=today).sort((a,b)=>b.date.localeCompare(a.date))[0]||null;
    closeSheet();
    render();
    toast('Jornada eliminada y saldos anteriores restaurados');
  }catch(error){
    console.error('No se pudo eliminar la jornada',error);
    toast('No se eliminó la jornada. Los datos anteriores permanecen intactos.','error');
  }
}

async function saveLoan(){
  const lender=document.getElementById('loanLender').value.trim();
  const amount=parseMoneyInput(document.getElementById('loanAmount').value);
  if(!lender||amount<=0)return toast('Completá quién te presta y el monto');

  const now=Date.now();
  const loan={
    id:'l'+now,lender,amount,remaining:amount,status:'active',payments:[],
    createdAt:now,createdDay:state.day?.date||''
  };
  state.loans.unshift(loan);
  await put('loans',loan);

  if(state.day&&state.day.status!=='closed'){
    state.day.dailyLoad={
      ...(state.day.dailyLoad||{}),
      loans:roundCurrency(Number(state.day.dailyLoad?.loans||0)+amount)
    };
    await saveDay();
  }

  await auditLog('loan_created',`Préstamo recibido de ${lender}`,{
    loanId:loan.id,amount,dayDate:state.day?.date||''
  });
  showLoans();
  render();
  toast('Préstamo registrado');
}
function loanPaidTotal(loan){
  return (loan.payments||[]).reduce((sum,payment)=>sum+Number(payment.amount||0),0);

function loanPaymentHistory(loan){
  return (loan.payments||[]).slice().sort((a,b)=>Number(b.createdAt||0)-Number(a.createdAt||0));
}

async function payLoan(id){
  if(!state.day)return toast('Abrí una jornada antes de registrar el pago','error');
  if(state.day.status==='closed')return toast('La jornada está cerrada. Reabrila para registrar el pago','error');
  const loan=state.loans.find(item=>item.id===id);
  if(!loan)return toast('No se encontró el préstamo');
  const amount=parseMoneyInput(document.getElementById('loanPayment')?.value);
  const method=document.getElementById('loanPaymentMethod')?.value||'cash';
  if(amount<=0)return toast('Ingresá un monto válido');
  if(amount>Number(loan.remaining||0))return toast(`El máximo pendiente es ${money(loan.remaining)}`);
  if(!['cash','transfer'].includes(method))return toast('Forma de pago inválida');

  const payment={
    id:crypto.randomUUID?.()||String(Date.now()),
    amount:roundCurrency(amount),
    method,
    createdAt:Date.now(),
    dayDate:state.day?.date||''
  };
  loan.remaining=roundCurrency(Number(loan.remaining||0)-payment.amount);
  loan.payments=loan.payments||[];
  loan.payments.push(payment);
  if(loan.remaining<=0){
    loan.remaining=0;
    loan.status='paid';
    loan.paidAt=Date.now();
  }
  await put('loans',loan);
  await auditLog('loan_payment',`Pago de préstamo a ${loan.lender}`,{
    loanId:id,amount:payment.amount,method,dayDate:payment.dayDate,remaining:loan.remaining
  });
  closeSheet();
  render();
  toast(loan.status==='paid'?'Préstamo pagado':'Pago parcial registrado');
}

async function moveClient(id,dir){
  const active=state.clients.filter(c=>c.active!==false).sort((a,b)=>(a.order||999)-(b.order||999));
  const i=active.findIndex(c=>c.id===id),j=i+dir;
  if(i<0||j<0||j>=active.length)return;
  [active[i],active[j]]=[active[j],active[i]];
  for(let k=0;k<active.length;k++){active[k].order=k+1;active[k].updatedAt=Date.now();await put('clients',active[k])}
  state.clients.sort((a,b)=>(a.order||999)-(b.order||999)||a.name.localeCompare(b.name,'es'));
  await auditLog('route_reordered','Orden de ruta modificado',{clientId:id,direction:dir});
  showRouteOrder();
}

async function applyClientImport(){
  const draft=state.importDraft;
  if(!draft||!draft.items.length)return toast('No hay datos válidos');
  if(state.day&&state.day.status!=='closed')return toast('Cerrá el día activo antes de modificar saldos');
  const policy=document.getElementById('importPolicy').value;
  if(!confirm(`¿Aplicar ${draft.items.length} registros?`))return;
  let created=0,updated=0,unchanged=0;
  for(const item of draft.items){
    const existing=importMatch(item);
    if(!existing){
      const client={id:crypto.randomUUID?.()||'cl_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),name:item.name,balance:item.balance,order:item.order,active:item.active,phone:item.phone||'',address:item.address||'',routeNote:item.routeNote||'',notes:'',createdAt:Date.now(),updatedAt:Date.now()};
      state.clients.push(client);await put('clients',client);created++;continue;
    }
    if(policy==='create'){unchanged++;continue}
    const before=JSON.stringify({name:existing.name,balance:existing.balance,order:existing.order,active:existing.active,phone:existing.phone,address:existing.address,routeNote:existing.routeNote});
    if(policy==='balance')existing.balance=item.balance;
    else{existing.name=item.name;existing.balance=item.balance;existing.order=item.order;existing.active=item.active;if(item.phone)existing.phone=item.phone;if(item.address)existing.address=item.address;if(item.routeNote)existing.routeNote=item.routeNote}
    existing.updatedAt=Date.now();
    const after=JSON.stringify({name:existing.name,balance:existing.balance,order:existing.order,active:existing.active,phone:existing.phone,address:existing.address,routeNote:existing.routeNote});
    if(before!==after){await put('clients',existing);updated++}else unchanged++;
  }
  state.clients.sort((a,b)=>(a.order||999)-(b.order||999)||a.name.localeCompare(b.name,'es'));
  const record={id:'im_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),source:draft.source,total:draft.items.length,created,updated,unchanged,errors:draft.errors,policy,createdAt:Date.now()};
  state.imports.unshift(record);await put('imports',record);
  await auditLog('clients_imported','Importación de clientes aplicada',{...record});
  state.importDraft=null;closeSheet();render();toast(`Importación lista: ${created} creados, ${updated} actualizados`);
}

function auditCategoryFor(action=''){
  if(action.startsWith('payment_'))return 'payments';
  if(action.startsWith('route_')||action.startsWith('followup_'))return 'route';
  if(action.startsWith('day_')||action.startsWith('reconciliation_')||action.startsWith('opening_cash_')||action.startsWith('virtual_credit_'))return 'closing';
  if(action.includes('import')||action.startsWith('accreditation'))return 'imports';
  if(action.startsWith('client_')||action.startsWith('loan_')||action.startsWith('expense_'))return 'records';
  if(action.includes('backup')||action.includes('restore')||action.includes('snapshot')||action.includes('storage'))return 'security';
  if(action.includes('integrity')||action.includes('repair')||action.includes('self_test')||action.includes('diagnostic')||action==='render_error')return 'system';
  if(action.startsWith('report_')||action.includes('exported'))return 'exports';
  return 'other';
}

function filteredAuditRows(){
  const search=normalizeClientKey(state.auditSearch||'');
  const category=state.auditCategory||'all';
  const period=state.auditPeriod||'30';
  const now=Date.now();
  const cutoff=period==='all'?0:now-Number(period)*86400000;
  return state.audit.filter(entry=>{
    if(cutoff&&Number(entry.createdAt||0)<cutoff)return false;
    if(category!=='all'&&auditCategoryFor(entry.action)!==category)return false;
    if(!search)return true;
    const client=auditClientName(entry);
    const haystack=normalizeClientKey([
      entry.action,
      entry.detail,
      client,
      auditDayDate(entry),
      JSON.stringify(entry.meta||{})
    ].join(' '));
    return haystack.includes(search);
  });
}

  }[key]||key.replace(/([a-z])([A-Z])/g,'$1 $2').replaceAll('_',' ');

function auditMetaValue(key,value){
  const moneyKeys=new Set([
    'amount','remaining','overpayment','totalPending','cashDifference','transferDifference',
    'transferReceived','transferPayments','transferNet','openingCash','cashCollected',
    'cashExpenses','expectedCash','countedCash','transferCollected','transferExpenses',
    'expectedTransfer','verifiedTransfer','totalDifference','bankCashDeposited',
    'bankTransferDeposited','bankCommission'
  ]);
  if(moneyKeys.has(key))return money(Number(value||0));
  if(key==='method')return value?paymentLabel(value):'Sin especificar';
  if(key==='source'){
    return {
      manual:'Registro manual',
      quick_full:'Cobro total rápido',
      daily_load:'Carga financiera',
      import:'Importación',
      previous_day_close:'Cierre de jornada anterior'
    }[value]||String(value||'Sin especificar');
  }
  if(key==='direction')return Number(value)<0?'Subió en el recorrido':'Bajó en el recorrido';
  if(typeof value==='boolean')return value?'Sí':'No';
  return typeof value==='object'?JSON.stringify(value,null,2):String(value);
}
function auditMetaEntries(meta){
  if(!meta||typeof meta!=='object')return [];
  const knownSummaryKeys=new Set([
    'amount','method','source','remaining','overpayment','totalPending',
    'cashDifference','transferDifference','transferReceived','transferPayments',
    'transferNet','bankCashDeposited','bankTransferDeposited','bankCommission',
    'unmanagedCount','records','clients','filter','direction','reopenCount'
  ]);
  const technicalKeys=new Set([
    'clientId','paymentId','fingerprint','backupKey','before','after','summary',
    'reconciliation','preCloseBalances','cashBreakdown','corrected','unresolved',
    'laterOpenDayIssues'
  ]);
  return Object.entries(meta).map(([key,value])=>({
    key,
    label:auditMetaLabel(key),
    value:auditMetaValue(key,value),
    technical:technicalKeys.has(key)||!knownSummaryKeys.has(key),
    hint:key==='totalPending'
      ?'Suma pendiente de todos los clientes de la jornada después de este movimiento.'
      :key==='overpayment'&&Number(value||0)>0
        ?'Diferencia entre lo pagado y la deuda que tenía el cliente.'
        :''
  }));
}

async function saveSettings(){state.settings.capital=Number(document.getElementById('settingCapital').value.replace(/\D/g,''))||0;state.settings.pinAdvance=Number(document.getElementById('settingPin').value.replace(/\D/g,''))||0;state.settings.bankDiscountDefault=Math.max(0,parseMoneyInput(document.getElementById('settingBankDiscount').value));state.settings.whatsappTemplate=document.getElementById('settingWhatsapp').value.trim()||'Buen día el total es {monto}';for(const [key,value] of Object.entries(state.settings))await put('settings',{key,value});await auditLog('settings_updated','Configuración actualizada');closeSheet();render();toast('Configuración guardada')}
const BACKUP_EMAIL_RECIPIENT='rodrigo.linares@gmail.com';

function backupOpenDaySummary(days){
  return (days||[]).filter(day=>day.status!=='closed').map(day=>({
    date:day.date,
    status:day.status||'active',
    managed:routeVisitStats(day).managed,
    total:routeVisitStats(day).total
  }));
}
function confirmBackupWithOpenDays(backup){
  if(!backup.openDays.length)return true;
  const detail=backup.openDays.map(day=>`${formatLongDate(day.date)} (${day.status==='preparation'?'preparación':'activa'}, ${day.managed}/${day.total} clientes)`).join('\n');
  return confirm(`ATENCIÓN: hay una jornada sin cierre definitivo.\n\n${detail}\n\nEl backup conservará todos los datos, pero esa jornada seguirá figurando como abierta al restaurarlo.\n\n¿Generar el backup igualmente?`);
}
async function createBackupPackage(){
  const [clients,days,settings,loans,audit,expenses,reconciliations,imports]=await Promise.all([
    getAll('clients'),getAll('days'),getAll('settings'),getAll('loans'),
    getAll('audit'),getAll('expenses'),getAll('reconciliations'),getAll('imports')
  ]);
  const exportedAt=new Date().toISOString();
  const openDays=backupOpenDaySummary(days);
  const payload={version:110,exportedAt,backupState:{hasOpenDays:openDays.length>0,openDays},clients,days,settings,loans,audit,expenses,reconciliations,imports};
  const json=JSON.stringify(payload,null,2);
  const suffix=openDays.length?'_JORNADA_ACTIVA':'';
  const filename='CML_Virtual_backup_'+dateKey()+suffix+'.json';
  return {
    blob:new Blob([json],{type:'application/json'}),
    filename,
    records:clients.length+days.length+loans.length+expenses.length,
    openDays
  };
}

async function registerBackupCreation(action,detail,records,openDays=[]){
  state.settings.lastBackupAt=Date.now();
  await put('settings',{key:'lastBackupAt',value:state.settings.lastBackupAt});
  const meta={version:110,records,openDays};
  if(action==='backup_email_shared'||action==='backup_email_prepared')meta.recipient=BACKUP_EMAIL_RECIPIENT;
  await auditLog(action,detail,meta);
  if(state.tab==='more')render();
}

function downloadBackupPackage(backup){
  const url=URL.createObjectURL(backup.blob);
  const a=document.createElement('a');
  a.href=url;
  a.download=backup.filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

async function exportBackup(){
  try{
    const backup=await createBackupPackage();
    if(!confirmBackupWithOpenDays(backup))return toast('Backup cancelado');
    downloadBackupPackage(backup);
    await registerBackupCreation('backup_exported','Backup JSON generado',backup.records,backup.openDays);
    toast('Backup generado');
  }catch(error){
    console.error(error);
    toast('No se pudo generar el backup');
  }
}

async function emailBackup(){
  let backup=null;
  try{
    backup=await createBackupPackage();
    if(!confirmBackupWithOpenDays(backup))return toast('Backup cancelado');
    const backupFile=typeof File==='function'
      ?new File([backup.blob],backup.filename,{type:'application/json',lastModified:Date.now()})
      :null;

    // Compartir archivos requiere HTTPS y compatibilidad del navegador.
    // canShare() puede lanzar una excepción en algunos WebView/gestores de archivos,
    // por eso se valida de forma aislada y nunca se deja caer toda la operación.
    let canShareFiles=false;
    if(window.isSecureContext&&backupFile&&typeof navigator.share==='function'){
      try{
        canShareFiles=typeof navigator.canShare!=='function'||navigator.canShare({files:[backupFile]});
      }catch(shareCheckError){
        console.warn('El navegador no pudo validar el uso compartido de archivos',shareCheckError);
      }
    }

    if(canShareFiles){
      try{
        await navigator.share({
          files:[backupFile],
          title:'Backup de CML Virtual',
          text:`Enviar a ${BACKUP_EMAIL_RECIPIENT}`
        });
        await registerBackupCreation('backup_email_shared','Backup compartido para envío por e-mail',backup.records,backup.openDays);
        toast('Backup adjuntado. Completá el destinatario en Gmail.');
        return;
      }catch(shareError){
        if(shareError?.name==='AbortError'){
          toast('Envío cancelado');
          return;
        }
        console.warn('No se pudo compartir el archivo; se usará el método alternativo',shareError);
      }
    }

    // mailto permite destinatario, asunto y cuerpo, pero no adjuntar archivos.
    // En modo local (content:// o file://) se descarga primero el JSON para
    // que el usuario pueda adjuntarlo manualmente al correo preparado.
    downloadBackupPackage(backup);
    await registerBackupCreation('backup_email_prepared','Backup descargado y correo preparado',backup.records,backup.openDays);
    const subject='Backup CML Virtual '+dateKey();
    const body=`Buen día. Adjunto el backup de CML Virtual generado el ${formatLongDate(dateKey())}.\n\nArchivo descargado: ${backup.filename}`;
    toast('Backup descargado. Adjuntá el archivo en el correo que se abrirá.');
    window.location.href=`mailto:${BACKUP_EMAIL_RECIPIENT}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  }catch(error){
    console.error(error);
    if(backup){
      try{
        downloadBackupPackage(backup);
        toast('El correo no pudo abrirse, pero el backup fue descargado.');
        return;
      }catch(downloadError){
        console.error(downloadError);
      }
    }
    toast('No se pudo generar el backup');
  }
}

async function previewRestoreBackup(){
  const file=document.getElementById('restoreFile')?.files?.[0];
  const preview=document.getElementById('restorePreview');
  const button=document.getElementById('restoreButton');
  const label=document.getElementById('restoreFileLabel');
  const fileName=document.getElementById('restoreFileName');
  if(!file||!preview||!button)return;
  if(fileName)fileName.textContent=file.name;
  label?.classList.remove('invalid');
  label?.classList.add('selected');
  try{
    const data=JSON.parse(await file.text());
    const errors=validateBackupStructure(data);
    window.__cmlRestorePreview=data;
    if(errors.length){
      label?.classList.add('invalid');
      preview.innerHTML=`<div class="eyebrow">ARCHIVO INVÁLIDO</div>${errors.slice(0,12).map(error=>`<p class="danger-text">${escapeHtml(error)}</p>`).join('')}${errors.length>12?`<p class="note">Y ${errors.length-12} error(es) adicionales.</p>`:''}`;
      button.disabled=true;
      return;
    }
    preview.innerHTML=`<div class="mc35-label">ARCHIVO VÁLIDO</div>
      <div class="bk35-preview-row"><span>Versión</span><b>${escapeHtml(data.version??'No indicada')}</b></div>
      <div class="bk35-preview-row"><span>Exportado</span><b>${escapeHtml(data.exportedAt?new Date(data.exportedAt).toLocaleString('es-AR'):'Sin fecha')}</b></div>
      <div class="bk35-preview-row"><span>Clientes</span><b>${data.clients.length}</b></div>
      <div class="bk35-preview-row"><span>Jornadas</span><b>${data.days.length}</b></div>
      <div class="bk35-preview-row"><span>Préstamos</span><b>${(data.loans||[]).length}</b></div>
      <div class="bk35-preview-row"><span>Gastos</span><b>${(data.expenses||[]).length}</b></div>
      ${(data.days||[]).some(day=>day.status!=='closed')?`<p class="danger-text"><b>Atención:</b> el backup contiene una jornada sin cierre definitivo. Al restaurarla continuará activa.</p>`:''}
      <p class="positive-text"><b>La estructura del backup es consistente.</b></p>`;
    button.disabled=false;
  }catch(error){
    window.__cmlRestorePreview=null;
    label?.classList.add('invalid');
    preview.innerHTML='<p class="danger-text">El archivo no contiene JSON válido.</p>';
    button.disabled=true;
  }
}
function replaceDatabaseFromBackup(data){
  return new Promise((resolve,reject)=>{
    const stores=['clients','days','settings','loans','audit','expenses','reconciliations','imports'];
    const transaction=state.db.transaction(stores,'readwrite');
    let settled=false;
    const collections={
      clients:data.clients||[],
      days:data.days||[],
      settings:data.settings||[],
      loans:data.loans||[],
      audit:data.audit||[],
      expenses:data.expenses||[],
      reconciliations:data.reconciliations||[],
      imports:data.imports||[]
    };
    try{
      stores.forEach(storeName=>{
        const store=transaction.objectStore(storeName);
        store.clear();
        collections[storeName].forEach(record=>store.put(record));
      });
    }catch(error){
      settled=true;
      try{transaction.abort()}catch{}
      reject(error);
      return;
    }
    transaction.oncomplete=()=>{
      if(settled)return;
      settled=true;
      resolve(true);
    };
    transaction.onerror=()=>{
      if(settled)return;
      settled=true;
      reject(transaction.error||new Error('No se pudo completar la restauración'));
    };
    transaction.onabort=()=>{
      if(settled)return;
      settled=true;
      reject(transaction.error||new Error('La restauración fue cancelada'));
    };
  });
}
async function restoreBackup(){
  const file=document.getElementById('restoreFile')?.files?.[0];
  if(!file)return toast('Seleccioná un archivo');
  try{
    const data=window.__cmlRestorePreview||JSON.parse(await file.text());
    const errors=validateBackupStructure(data);
    if(errors.length)return toast('El backup contiene errores');
    if(!confirm(`¿Restaurar ${data.clients.length} clientes y ${data.days.length} jornadas? La base actual será reemplazada por el contenido del backup.`))return;
    await createEmergencySnapshot('before_external_restore',true);
    await replaceDatabaseFromBackup(data);
    await put('settings',{key:'lastRestoreAt',value:Date.now()});
    await auditLog('backup_restored','Backup restaurado',{version:data.version||null,clients:data.clients.length,days:data.days.length});
    location.reload();
  }catch(error){
    console.error(error);
    toast('No se pudo restaurar el backup');
  }
}

let sheetHistoryActive=false;
let sheetHistoryClosing=false;

function openSheet(html){
  const sheet=document.getElementById('sheet');
  const backdrop=document.getElementById('sheetBackdrop');
  if(!sheet||!backdrop)return;

  sheet.innerHTML=`<div class="sheet-close"><button type="button" aria-label="Cerrar ventana" title="Cerrar" onclick="closeSheet()">×</button></div>${html}`;
  backdrop.classList.add('show');
  document.body.classList.add('sheet-open');
  sheet.scrollTop=0;

  // Si se está volviendo desde la entrada de historial de la hoja anterior,
  // el nuevo panel se mantiene visible y su entrada se crea al recibir popstate.
  if(sheetHistoryClosing)return;
  if(!sheetHistoryActive){
    history.pushState({cmlSheet:true},'',location.href);
    sheetHistoryActive=true;
  }
}

function closeSheet(options={}){
  const backdrop=document.getElementById('sheetBackdrop');
  if(!backdrop||!backdrop.classList.contains('show'))return;

  backdrop.classList.remove('show');
  document.body.classList.remove('sheet-open');

  if(sheetHistoryActive&&!options.fromPopState){
    sheetHistoryActive=false;
    sheetHistoryClosing=true;
    history.back();
  }else if(!sheetHistoryClosing){
    sheetHistoryActive=false;
  }
}

window.addEventListener('popstate',()=>{
  const backdrop=document.getElementById('sheetBackdrop');
  if(sheetHistoryClosing){
    sheetHistoryClosing=false;
    if(backdrop?.classList.contains('show')){
      history.pushState({cmlSheet:true},'',location.href);
      sheetHistoryActive=true;
    }
    return;
  }
  if(backdrop?.classList.contains('show')){
    closeSheet({fromPopState:true});
  }
});
function toast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.toggle('error',type==='error');
  t.classList.remove('show');
  void t.offsetWidth;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer=setTimeout(()=>t.classList.remove('show'),2400);
}

init().catch(err=>{
  console.error(err);
  alert('No se pudo actualizar la base local de CML Virtual. Cerrá todas las pestañas donde esté abierta la app y abrí nuevamente este archivo. Tus datos anteriores no se borraron.');
});
