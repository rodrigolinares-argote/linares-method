  <title>CML Virtual</title>
  <style>
    :root{
      --bg:#0F1923;--surface:#172332;--surface-2:#1E2D3E;--border:#2D4055;
      --text:#F1F5F9;--muted:#94A3B8;--primary:#3B82F6;--primary-2:#2563EB;
      --success:#22C55E;--warning:#F59E0B;--danger:#EF4444;--radius:18px;
      --shadow:0 12px 28px rgba(0,0,0,.26);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;height:100%;overflow:hidden}
    button,input,select,textarea{font:inherit}
    button{cursor:pointer}
    .app{height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
    .header{padding:calc(12px + env(safe-area-inset-top)) 16px 12px;border-bottom:1px solid var(--border);background:rgba(15,25,35,.96);backdrop-filter:blur(12px);display:flex;justify-content:space-between;align-items:center;gap:12px}
    .header h1{font-size:18px;margin:0}
    .header .date{font-size:12px;color:var(--muted);text-align:right}
    main{overflow:auto;padding:16px 16px 28px}
    .tabbar{padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:#101A25;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
    .tab{border:0;background:transparent;color:var(--muted);padding:8px 4px;border-radius:12px;font-size:11px;font-weight:700}
    .tab span{display:block;font-size:20px;margin-bottom:3px}
    .tab.active{color:var(--text);background:var(--surface-2)}
    .card{background:linear-gradient(180deg,var(--surface),#14202C);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
    .card h2,.card h3{margin:0 0 8px}
    .eyebrow{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.08em}
    .muted{color:var(--muted)}
    .btn{width:100%;border:0;border-radius:14px;padding:14px 16px;font-weight:800;color:white;background:var(--primary)}
    .btn:active{transform:scale(.99)}
    .btn.secondary{background:var(--surface-2);border:1px solid var(--border)}
    .btn.success{background:var(--success);color:#06240f}
    .btn.danger{background:var(--danger)}
    .btn.small{width:auto;padding:9px 12px;font-size:13px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .stat{padding:13px;background:var(--surface-2);border:1px solid var(--border);border-radius:14px}
    .stat b{display:block;font-size:18px;margin-top:4px}
    .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
    .step{padding:9px 5px;text-align:center;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-size:10px;color:var(--muted);font-weight:800}
    .step.active{color:#fff;background:#1D4ED8;border-color:#3B82F6}
    .client-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid rgba(148,163,184,.12)}
    .client-row:last-child{border-bottom:0}
    .client-name{font-weight:800}
    .money{font-variant-numeric:tabular-nums;font-weight:800}
    .badge{font-size:10px;font-weight:800;padding:5px 8px;border-radius:999px}
    .badge.pending{background:rgba(239,68,68,.15);color:#FCA5A5}
    .badge.partial{background:rgba(245,158,11,.15);color:#FCD34D}
    .badge.paid{background:rgba(34,197,94,.15);color:#86EFAC}
    .field{margin:12px 0}
    .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:700}
    .input{width:100%;border:1px solid var(--border);background:#0D1721;color:var(--text);border-radius:14px;padding:13px 14px;outline:none}
    .input:focus{border-color:var(--primary)}
    .empty{min-height:60vh;display:flex;align-items:center;justify-content:center;text-align:center}
    .empty-icon{font-size:48px;margin-bottom:10px}
    .toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
    .search{flex:1}
    .sheet-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.56);display:none;align-items:flex-end;z-index:50;overscroll-behavior:contain}
    .sheet-backdrop.show{display:flex}
    .sheet{
      position:relative;
      width:100%;
      height:min(88dvh,88vh);
      max-height:min(88dvh,88vh);
      overflow-y:auto;
      overflow-x:hidden;
      overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;
      touch-action:pan-y;
      background:#13202C;
      border-radius:24px 24px 0 0;
      border:1px solid var(--border);
      padding:18px 16px calc(28px + env(safe-area-inset-bottom));
    }
    .sheet-handle{width:44px;height:5px;border-radius:99px;background:#42566E;margin:0 auto 16px}
    .sheet-close{
      position:sticky;
      top:0;
      z-index:8;
      display:flex;
      justify-content:flex-end;
      height:0;
      pointer-events:none;
    }
    .sheet-close button{
      pointer-events:auto;
      transform:translateY(-6px);
      width:42px;
      height:42px;
      border-radius:50%;
      border:1px solid var(--border);
      background:#203246;
      color:#fff;
      font-size:25px;
      line-height:1;
      display:grid;
      place-items:center;
      box-shadow:var(--shadow);
    }
    body.sheet-open{overflow:hidden;touch-action:none}
    .toast{position:fixed;left:16px;right:16px;bottom:92px;background:#172332;border:1px solid var(--border);padding:13px 14px;border-radius:14px;display:none;z-index:100;box-shadow:var(--shadow)}
    .toast.show{display:block}
    .splash{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px}
    .logo{width:82px;height:82px;border-radius:22px;background:var(--surface-2);border:2px solid var(--border);display:grid;place-items:center;font-size:36px}
    .progress{width:210px;height:6px;background:var(--surface);border-radius:99px;overflow:hidden}
    .progress>i{display:block;height:100%;width:0;background:var(--primary);animation:load 1s ease forwards}
    @keyframes load{to{width:100%}}
    .section-title{display:flex;justify-content:space-between;align-items:end;margin:4px 2px 10px}
    .section-title h2{font-size:16px;margin:0}
    .note{font-size:12px;line-height:1.45;color:var(--muted)}
    .hidden{display:none!important}
  
  .original-daily-load{max-width:480px;margin:0 auto;padding-bottom:24px}
  .original-title{font-size:18px;color:#6fb1ff;margin:0 0 4px;font-weight:700}
  .original-subtitle{font-size:13px;color:#999;margin-bottom:20px}
  .original-section{background:#1a1d24;border-radius:10px;padding:14px;margin-bottom:16px;border:1px solid #2a2d35}
  .original-section-title{font-size:14px;font-weight:700;color:#fff;background:#1F4E78;margin:-14px -14px 12px;padding:10px 14px;border-radius:10px 10px 0 0}
  .original-client-row{padding:10px 0;border-bottom:1px solid #2a2d35}
  .original-client-row:last-child{border-bottom:none}
  .original-client-name{font-size:13px;color:#ddd;margin-bottom:6px;font-weight:600}
  .original-client-fields{display:flex;gap:6px}
  .original-field-group{flex:1;min-width:0}
  .original-field-group label{font-size:10px;color:#888;display:block;margin-bottom:2px}
  .original-field-group input,.original-field-group select{width:100%;padding:7px 5px;border-radius:6px;border:1px solid #3a3d45;background:#0f1115;color:#fff;font-size:13px;min-height:38px}
  .original-field-group select{font-size:11px;padding:7px 2px}
  .original-balance-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .original-balance-label{flex:1.4;font-size:13px;color:#ddd}
  .original-balance-row input{flex:1;min-width:0;padding:9px 8px;border-radius:6px;border:1px solid #3a3d45;background:#0f1115;color:#fff;font-size:14px}
  .original-hint{font-size:11px;color:#777;margin-top:-4px;margin-bottom:10px}
  .original-total-preview{margin-top:10px;padding:10px;background:#14171c;border-radius:8px;font-size:13px;color:#6fb1ff;font-weight:700;text-align:right}
  .original-result{margin-top:16px;background:#14171c;border:1px solid #2a2d35;border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap;color:#c8e6ff;display:none}
  .original-copy-btn{background:#1F7A1F!important;margin-top:8px}
  .original-alert{display:none}


  .carga-diaria-original{
    font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    background:#0f1115;
    color:#e8e8e8;
    max-width:480px;
    margin-left:auto;
    margin-right:auto;
  }
  .carga-diaria-original *{box-sizing:border-box}
  .carga-diaria-original h1{font-size:18px;color:#6fb1ff;margin:0 0 4px 0}
  .carga-diaria-original .subtitle{font-size:13px;color:#999;margin-bottom:20px}
  .carga-diaria-original .section{background:#1a1d24;border-radius:10px;padding:14px;margin-bottom:16px;border:1px solid #2a2d35}
  .carga-diaria-original .section-title{font-size:14px;font-weight:700;color:#fff;background:#1F4E78;margin:-14px -14px 12px -14px;padding:10px 14px;border-radius:10px 10px 0 0}
  .carga-diaria-original .client-row{padding:10px 0;border-bottom:1px solid #2a2d35}
  .carga-diaria-original .client-row:last-child{border-bottom:none}
  .carga-diaria-original .client-name{font-size:13px;color:#ddd;margin-bottom:6px;font-weight:600}
  .carga-diaria-original .client-fields{display:flex;gap:6px}
  .carga-diaria-original .field-group{flex:1;min-width:0}
  .carga-diaria-original .field-group label{font-size:10px;color:#888;display:block;margin-bottom:2px}
  .carga-diaria-original .field-group input,
  .carga-diaria-original .field-group select{width:100%;padding:7px 5px;border-radius:6px;border:1px solid #3a3d45;background:#0f1115;color:#fff;font-size:13px}
  .carga-diaria-original .field-group select{font-size:11px;padding:7px 2px}
  .carga-diaria-original .balance-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .carga-diaria-original .balance-label{flex:1.4;font-size:13px;color:#ddd}
  .carga-diaria-original .balance-row input{flex:1;min-width:0;padding:9px 8px;border-radius:6px;border:1px solid #3a3d45;background:#0f1115;color:#fff;font-size:14px}
  .carga-diaria-original button{width:100%;padding:14px;border-radius:10px;border:none;background:#2E75B6;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}
  .carga-diaria-original button:active{background:#1F4E78}
  .carga-diaria-original #resultado{margin-top:16px;background:#14171c;border:1px solid #2a2d35;border-radius:10px;padding:12px;font-size:13px;white-space:pre-wrap;color:#c8e6ff;display:none}
  .carga-diaria-original .copy-btn{background:#1F7A1F;margin-top:8px}
  .carga-diaria-original .copy-btn:active{background:#155c15}
  .carga-diaria-original .alerta-monto{margin-top:12px;background:#3a1a1a;border:1px solid #c00;border-radius:8px;padding:10px 12px;font-size:12px;color:#ff8080;display:none}
  .carga-diaria-original .alerta-monto strong{color:#ff4444;display:block;margin-bottom:4px}
  .carga-diaria-original input.campo-alerta,.carga-diaria-original select.campo-alerta{border-color:#c00!important;background:#1a0a0a!important}
  .carga-diaria-original .hint{font-size:11px;color:#777;margin-top:-4px;margin-bottom:10px}
  .carga-diaria-original .total-preview{margin-top:10px;padding:10px;background:#14171c;border-radius:8px;font-size:13px;color:#6fb1ff;font-weight:700;text-align:right}


.client-load-row{border-bottom:1px solid #2A3541;padding:10px 0}
.client-load-row summary{display:flex;justify-content:space-between;align-items:center;gap:12px;cursor:pointer;font-size:16px}
.client-load-row summary small{display:block;color:#8F9BAB;font-weight:500;margin-top:3px}
.client-load-row[open] summary{margin-bottom:10px}


.close-summary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.close-flow{margin-top:14px}
.close-flow-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid rgba(148,163,184,.14)}
.close-flow-row:last-child{border-bottom:0}
.close-flow-row strong{font-variant-numeric:tabular-nums;text-align:right}
.close-flow-row.net{margin-top:4px;padding-top:14px;font-size:17px}
.close-flow-row.net strong{font-size:20px}
.reconciliation-status{border-radius:14px;padding:14px 16px;margin-bottom:14px}
.reconciliation-status.ok{background:rgba(34,197,94,.10);border:1px solid rgba(34,197,94,.38)}
.reconciliation-status.error{background:rgba(239,68,68,.10);border:1px solid rgba(239,68,68,.42)}
.reconciliation-status-title{display:flex;justify-content:space-between;align-items:center;gap:12px;font-weight:800}
.reconciliation-status-detail{margin-top:8px}
@media(max-width:390px){
  .close-summary{grid-template-columns:1fr}
}

/* =========================================================
   CML VIRTUAL v5.2 — DESIGN SYSTEM CONSOLIDADO
   Única capa visual activa. Integra pantallas principales,
   flujos críticos, inteligencia operativa y ciclo de jornada.
   ========================================================= */
body.v52{
  --v44-bg:#030711;
  --v44-bg-soft:#07101b;
  --v44-panel:#0a1523;
  --v44-panel-raised:#0e1c2d;
  --v44-panel-hover:#12243a;
  --v44-border:rgba(126,160,195,.18);
  --v44-border-soft:rgba(126,160,195,.09);
  --v44-text:#f7f9fc;
  --v44-muted:#8d9bad;
  --v44-muted-2:#657487;
  --v44-green:#32e39f;
  --v44-green-deep:#19b87c;
  --v44-cyan:#27d5e4;
  --v44-blue:#3ba8ff;
  --v44-amber:#f4b844;
  --v44-purple:#8b63f7;
  --v44-red:#ff626a;
  background:
    radial-gradient(circle at 8% -100px,rgba(50,227,159,.10),transparent 320px),
    radial-gradient(circle at 98% 5%,rgba(59,168,255,.065),transparent 360px),
    linear-gradient(180deg,#02050d,#06101b 52%,#020710);
  color:var(--v44-text);
}
body.v52 main{
  padding:14px 14px 30px!important;
  background:transparent!important;
}
body.v52 .header{
  min-height:68px!important;
  padding:calc(10px + env(safe-area-inset-top)) 17px 10px!important;
  background:rgba(2,7,17,.88)!important;
  border-bottom:1px solid rgba(126,160,195,.08)!important;
  box-shadow:none!important;
  backdrop-filter:blur(22px);
}
body.v52 .brand{
  gap:12px!important;
}
body.v52 .brand-mark{
  width:58px!important;
  height:42px!important;
  display:block!important;
  position:relative!important;
  overflow:visible!important;
  background:transparent!important;
  border:0!important;
  box-shadow:none!important;
  color:transparent!important;
}
body.v52 .brand-mark::before{
  content:"CML";
  position:absolute;
  left:0;
  top:2px;
  color:#fff;
  font-size:22px;
  line-height:1;
  font-weight:950;
  font-style:italic;
  letter-spacing:-.09em;
}
body.v52 .brand-mark::after{
  content:"VIRTUAL";
  display:block!important;
  position:absolute;
  left:3px;
  top:28px;
  color:#a6b2c0;
  border:0!important;
  font-size:6px;
  font-weight:850;
  font-style:normal;
  letter-spacing:.28em;
}
body.v52 .header h1{
  font-size:15px!important;
  font-weight:900!important;
}
body.v52 .brand-subtitle{
  color:#657487!important;
  font-size:8px!important;
  letter-spacing:.15em!important;
  text-transform:uppercase;
}
body.v52 .header .date{
  color:#8997a9!important;
  font-size:9px!important;
}

/* Navigation */
body.v52 .tabbar{
  min-height:82px!important;
  margin:0 10px calc(10px + env(safe-area-inset-bottom))!important;
  padding:7px!important;
  border:1px solid rgba(126,160,195,.12)!important;
  border-radius:23px!important;
  background:rgba(7,14,25,.97)!important;
  box-shadow:0 22px 62px rgba(0,0,0,.48)!important;
}
body.v52 .tab{
  min-height:64px!important;
  padding:7px 3px!important;
  border-radius:16px!important;
  color:#627185!important;
  background:transparent!important;
  box-shadow:none!important;
  font-size:9px!important;
}
body.v52 .tab.active{
  color:var(--v44-green)!important;
  background:rgba(50,227,159,.075)!important;
  box-shadow:inset 0 0 0 1px rgba(50,227,159,.15)!important;
}
body.v52 .tab.active::after{
  left:35%!important;
  right:35%!important;
  bottom:4px!important;
  background:var(--v44-green)!important;
  box-shadow:0 0 11px rgba(50,227,159,.55)!important;
}
body.v52 .tab-icon svg{
  width:22px!important;
  height:22px!important;
}

/* Universal surfaces */
body.v52 .card,
body.v52 .r32-route-list,
body.v52 .c32-list,
body.v52 .b33-item,
body.v52 .b33-last-close,
body.v52 .m35-status,
body.v52 .m35-tile,
body.v52 .cf37-section,
body.v52 .pay34-section,
body.v52 .s35-section,
body.v52 .op38-form,
body.v52 .mc35-list,
body.v52 .rh36-list,
body.v52 .rh36-client-list,
body.v52 .rh36-detail{
  background:
    linear-gradient(145deg,rgba(24,45,70,.20),transparent 52%),
    rgba(8,19,33,.97)!important;
  color:var(--v44-text)!important;
  border:1px solid var(--v44-border)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.018)!important;
}

/* Home architecture */
body.v52 .v44-home{
  display:flex;
  flex-direction:column;
  gap:13px;
}
body.v52 .v44-overview{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:2px 2px 4px;
}
body.v52 .v44-date{
  display:flex;
  align-items:center;
  gap:10px;
}
body.v52 .v44-date-icon,
body.v52 .v44-profile{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:rgba(50,227,159,.09);
  color:var(--v44-green);
  border:1px solid rgba(50,227,159,.10);
}
body.v52 .v44-profile{
  background:#0e1c2d;
  color:#96a5b7;
  border-color:var(--v44-border);
}
body.v52 .v44-date-icon svg,
body.v52 .v44-profile svg{
  width:19px;
  height:19px;
  fill:none;
  stroke:currentColor;
  stroke-width:1.9;
}
body.v52 .v44-date strong{
  display:block;
  font-size:13px;
}
body.v52 .v44-date span{
  display:flex;
  align-items:center;
  gap:6px;
  margin-top:3px;
  color:var(--v44-green);

/* El logo y el título deben convivir horizontalmente.
   La ausencia de display:flex hacía crecer el header en vertical. */
body.v63 .brand{
  display:flex!important;
  align-items:center!important;
  min-width:0;
  gap:12px!important;
}
body.v63 .brand > div:last-child{
  min-width:0;
}
body.v63 .header{
  min-height:76px!important;
  padding:calc(10px + env(safe-area-inset-top)) 18px 10px!important;
  align-items:center!important;
}
body.v63 .brand-mark{
  flex:0 0 58px!important;
  width:58px!important;
  height:42px!important;
}
body.v63 .header h1{
  overflow:hidden;
  max-width:210px;
  color:#f7f9fc!important;
  font-size:15px!important;
  line-height:1.15!important;
  text-overflow:ellipsis;
  white-space:nowrap;
}
body.v63 .brand-subtitle{
  margin-top:3px!important;
  font-size:7px!important;
  line-height:1!important;
  letter-spacing:.17em!important;
}
body.v63 .header .date{
  flex:0 0 auto;
  max-width:132px!important;
  font-size:9px!important;
  line-height:1.3!important;
  white-space:nowrap;
}
body.v63[data-day-status="closed"] .date::before,
body.v63[data-day-status="none"] .date::before{
  background:#657487!important;
  box-shadow:none!important;
}
body.v63[data-day-status="preparation"] .date::before{
  background:#f4b844!important;
  box-shadow:0 0 9px rgba(244,184,68,.38)!important;
}

/* El contenedor desplazable necesita min-height:0 dentro del grid. */
body.v63 .app{
  min-height:100dvh;
  height:100dvh;
}
body.v63 main{
  min-height:0!important;
  overscroll-behavior:contain;
  scroll-behavior:auto!important;
  scrollbar-width:none;
}
body.v63 main::-webkit-scrollbar{
  display:none;
}

/* Navegación más compacta y sin íconos negros. */
body.v63 .tabbar{
  width:min(calc(100% - 20px),740px)!important;
  min-height:72px!important;
  margin:0 auto calc(9px + env(safe-area-inset-bottom))!important;
  padding:6px!important;
  border-radius:21px!important;
}
body.v63 .tab{
  min-height:58px!important;
  padding:6px 3px!important;
  border-radius:15px!important;
  color:#627185!important;
}
body.v63 .tab.active{
  color:var(--v63-green)!important;
}
body.v63 .tab-icon{
  color:inherit!important;
}
body.v63 .tab-icon svg{
  width:21px!important;
  height:21px!important;
  fill:none!important;
  stroke:currentColor!important;
  stroke-width:1.9!important;
}
body.v63 .tab-icon svg *{
  fill:none!important;
  stroke:currentColor!important;
}
body.v63 .tab.active .tab-icon,
body.v63 .tab.active .tab-icon svg{
  color:var(--v63-green)!important;
  stroke:var(--v63-green)!important;
}
body.v63 .tab span:not(.tab-icon){
  color:inherit!important;
}

/* Evita que el primer contenido parezca pegado o recortado. */
body.v63 #view{
  padding-top:1px;
}
body.v63 #view > :first-child{
  margin-top:0!important;
}

/* El cierre no necesita una tarjeta tan alta en móviles. */
body.v63 .v51-closed-hero{
  padding:19px 18px 18px!important;
}
body.v63 .v51-closed-icon{
  width:40px!important;
  height:40px!important;
}
body.v63 .v51-closed-title{
  margin-top:15px!important;
  font-size:25px!important;
}
body.v63 .v51-closed-label{
  margin-top:18px!important;
}
body.v63 .v51-closed-value{
  font-size:39px!important;
}
body.v63 .v51-closed-metric{
  min-height:76px!important;
  padding:12px!important;
}

/* El aviso de solo lectura queda unido al resumen y no como bloque gigante. */
body.v63 .v59-readonly-note{
  padding:12px 14px!important;
  border-radius:15px!important;
}
body.v63 .v59-readonly-note strong{
  font-size:9px!important;
}
body.v63 .v59-readonly-note span,
body.v63 .v59-readonly-note p{
  font-size:8px!important;
}

@media(max-width:390px){
  body.v63 .header{
    padding-left:14px!important;
    padding-right:14px!important;
  }
  body.v63 .brand-mark{
    flex-basis:54px!important;
    width:54px!important;
  }
  body.v63 .header h1{
    max-width:160px;
  }
  body.v63 .header .date{
    max-width:112px!important;
  }
}


/* =========================================================
   CML VIRTUAL v6.4 — DENSIDAD Y JERARQUÍA OPERATIVA
   Clientes, Ruta y Más optimizados para uso móvil real.
   ========================================================= */
body.v64{
  --v64-line:rgba(126,160,195,.14);
  --v64-soft:rgba(126,160,195,.075);
  --v64-panel:#081522;
  --v64-green:#32e39f;
  --v64-blue:#3ba8ff;
  --v64-amber:#f4b844;
}

/* Espaciado general más eficiente */
body.v64 main{
  padding:12px 12px 24px!important;
}
body.v64 .v54-page-head{
  margin-bottom:10px!important;
}
body.v64 .v54-page-title{
  font-size:24px!important;
}
body.v64 .v54-page-copy{
  max-width:480px;
  font-size:9px!important;
}

/* CLIENTES: resumen compacto y controles apilados correctamente */
body.v64 .v54-client-overview{
  grid-template-columns:repeat(3,minmax(0,1fr))!important;
  gap:7px!important;
  margin-bottom:9px!important;
}
body.v64 .v54-client-stat{
  min-height:66px!important;
  padding:10px!important;
  border-radius:14px!important;
}
body.v64 .v54-client-stat span{
  font-size:6.5px!important;
  white-space:nowrap;
}
body.v64 .v54-client-stat b{
  margin-top:5px!important;
  font-size:13px!important;
  overflow:hidden;
  text-overflow:ellipsis;
}
body.v64 .v54-toolbar{
  grid-template-columns:1fr!important;
  gap:7px!important;
  margin-top:8px!important;
}
body.v64 .v54-search input{
  min-height:46px!important;
  font-size:12px!important;
}
body.v64 .v54-segments{
  display:grid!important;
  grid-template-columns:repeat(3,1fr)!important;
  width:100%;
}
body.v64 .v54-segments button{
  min-height:38px!important;
  padding:6px 8px!important;
}
body.v64 .v54-client-list{
  gap:7px!important;
  margin-top:9px!important;
}
body.v64 .v54-client-card{
  min-height:70px!important;
  grid-template-columns:40px minmax(0,1fr) auto!important;
  gap:10px!important;
  padding:10px 11px!important;
  border-radius:16px!important;
}
body.v64 .v54-client-avatar{
  width:39px!important;
  height:39px!important;
  border-radius:12px!important;
  font-size:12px!important;
}
body.v64 .v54-client-name{
  font-size:11px!important;
}
body.v64 .v54-client-owner{
  margin-top:2px!important;
  font-size:7.5px!important;
}
body.v64 .v54-client-tags{
  gap:4px!important;
  margin-top:5px!important;
}
body.v64 .v54-client-tag{
  padding:3px 6px!important;
  font-size:6px!important;
}
body.v64 .v54-client-balance{
  font-size:12px!important;
}
body.v64 .v54-client-state{
  margin-top:3px!important;
  font-size:6px!important;
}
body.v64 .v54-client-chevron{
  margin-top:2px!important;
  font-size:14px!important;
}

/* RUTA EN CONSULTA: resumen ejecutivo compacto */
body.v64 .route64-shell{
  display:flex;
  flex-direction:column;
  gap:9px;
}
body.v64 .route64-summary{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:14px;
  align-items:center;
  padding:15px;
  border:1px solid rgba(59,168,255,.20);
  border-radius:19px;
  background:
    radial-gradient(circle at 94% 0,rgba(59,168,255,.08),transparent 38%),
    linear-gradient(145deg,#0a1a28,#07111e 72%);
}
body.v64 .route64-kicker{
  color:var(--v64-blue);
  font-size:8px;
  font-weight:900;
  letter-spacing:.13em;
}
body.v64 .route64-title{
  margin-top:5px;
  color:#fff;
  font-size:21px;
  line-height:1.08;
  font-weight:950;
  letter-spacing:-.035em;
}
body.v64 .route64-copy{
  margin-top:5px;
  color:#7f8ea1;
  font-size:8px;
  line-height:1.4;
}
body.v64 .route64-progress{
  --progress:0deg;
  width:72px;
  height:72px;
  display:grid;
  place-items:center;
  position:relative;
  border-radius:50%;
  background:conic-gradient(var(--v64-green) var(--progress),rgba(126,160,195,.10) 0);
}
body.v64 .route64-progress::before{
  content:"";
  position:absolute;
  width:56px;
  height:56px;
  border-radius:50%;
  background:#07111e;
}
body.v64 .route64-progress b{
  position:relative;
  z-index:1;
  color:#fff;
  font-size:15px;
}
body.v64 .route64-metrics{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
}
body.v64 .route64-metric{
  min-height:63px;
  padding:10px;
  border:1px solid var(--v64-line);
  border-radius:14px;
  background:rgba(8,19,33,.97);
}
body.v64 .route64-metric span{
  color:#718196;
  font-size:6.5px;
  font-weight:850;
}
body.v64 .route64-metric b{
  display:block;
  margin-top:5px;
  color:#fff;
  font-size:13px;
}
body.v64 .route64-lock{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 12px;
  border:1px solid rgba(244,184,68,.16);
  border-radius:13px;
  background:rgba(244,184,68,.045);
}
body.v64 .route64-lock-icon{
  width:30px;
  height:30px;
  display:grid;
  place-items:center;
  flex:0 0 auto;
  border-radius:10px;
  background:rgba(244,184,68,.09);
  color:var(--v64-amber);
  font-size:13px;
}
body.v64 .route64-lock strong{
  display:block;
  color:#efc66d;
  font-size:8px;
}
body.v64 .route64-lock span{
  display:block;
  margin-top:2px;
  color:#96815b;
  font-size:7px;
  line-height:1.35;
}
body.v64 .route64-list{
  overflow:hidden;
  border:1px solid var(--v64-line);
  border-radius:18px;
  background:rgba(8,19,33,.97);
}
body.v64 .route64-row{
  display:grid;
  grid-template-columns:34px minmax(0,1fr) auto;
  gap:9px;
  align-items:center;
  min-height:64px;
  padding:9px 11px;
  border-bottom:1px solid var(--v64-soft);
}
body.v64 .route64-row:last-child{border-bottom:0}
body.v64 .route64-order{
  width:32px;
  height:32px;
  display:grid;
  place-items:center;
  border-radius:11px;
  background:#102238;
  color:var(--v64-green);
  font-size:9px;
  font-weight:900;
}
body.v64 .route64-name{
  color:#f1f5f8;
  font-size:10.5px;
  font-weight:900;
}
body.v64 .route64-meta{
  display:flex;
  flex-wrap:wrap;
  gap:4px 7px;
  margin-top:3px;
  color:#718196;
  font-size:7px;
}
body.v64 .route64-status{
  color:var(--v64-green);
  font-weight:900;
}
body.v64 .route64-amount{
  color:#fff;
  font-size:11px;
  font-weight:900;
}
body.v64 .route64-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

/* MÁS: deja de ser una landing y pasa a ser un centro de control */
body.v64 .more64-shell{
  display:flex;
  flex-direction:column;
  gap:9px;
}
body.v64 .more64-head{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  padding:2px 1px 3px;
}
body.v64 .more64-kicker{
  color:var(--v64-green);
  font-size:8px;
  font-weight:900;
  letter-spacing:.13em;
}
body.v64 .more64-title{
  margin-top:4px;
  color:#fff;
  font-size:25px;
  font-weight:950;
  letter-spacing:-.04em;
}
body.v64 .more64-copy{
  margin-top:5px;
  color:#748397;
  font-size:8px;
}
body.v64 .more64-score{
  min-width:66px;
  padding:9px;
  text-align:center;
  border:1px solid rgba(244,184,68,.15);
  border-radius:14px;
  background:rgba(244,184,68,.05);
}
body.v64 .more64-score b{
  display:block;
  color:#efc66d;
  font-size:20px;
}
body.v64 .more64-score span{
  color:#8f7b57;
  font-size:6px;
  font-weight:900;
}
body.v64 .more64-balance{
  display:grid;
  grid-template-columns:38px minmax(0,1fr) auto;
  gap:10px;
  align-items:center;
  min-height:68px;
  padding:11px 12px;
  border:1px solid rgba(50,227,159,.24);
  border-radius:16px;
  background:
    radial-gradient(circle at 96% 0,rgba(50,227,159,.08),transparent 40%),
    rgba(8,19,33,.97);
}
body.v64 .more64-icon{
  width:37px;
  height:37px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:rgba(50,227,159,.09);
  color:var(--v64-green);
}
body.v64 .more64-icon svg{
  width:19px;
  height:19px;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
}
body.v64 .more64-name{
  color:#f2f5f8;
  font-size:11px;
  font-weight:900;
}
body.v64 .more64-desc{
  margin-top:3px;
  color:#748397;
  font-size:7px;
  line-height:1.35;
}
body.v64 .more64-open{
  color:var(--v64-green);
  font-size:8px;
  font-weight:900;
}
body.v64 .more64-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}
body.v64 .more64-card{
  min-height:112px;
  padding:12px;
  text-align:left;
  border:1px solid var(--v64-line);
  border-radius:16px;
  background:
    linear-gradient(145deg,rgba(24,45,70,.16),transparent 54%),
    rgba(8,19,33,.97);
  color:inherit;
}
body.v64 .more64-card.attention{
  border-color:rgba(244,184,68,.18);
}
body.v64 .more64-card .more64-icon{
  width:34px;
  height:34px;
}
body.v64 .more64-card .more64-name{
  margin-top:10px;
}
body.v64 .more64-meta{
  display:block;
  margin-top:10px;
  color:var(--v64-green);
  font-size:6.5px;
  font-weight:900;
  letter-spacing:.04em;
}
body.v64 .more64-card.attention .more64-meta{
  color:var(--v64-amber);
}

@media(max-width:350px){
  body.v64 .v54-client-overview{
    grid-template-columns:1fr 1fr!important;
  }
  body.v64 .v54-client-stat:last-child{
    grid-column:1/-1!important;
  }
  body.v64 .route64-metrics{
    grid-template-columns:1fr 1fr;
  }
  body.v64 .route64-metric:last-child{
    grid-column:1/-1;
  }
  body.v64 .more64-grid{
    grid-template-columns:1fr;
  }
}


/* =========================================================
   CML VIRTUAL v6.5 — SISTEMA VISUAL UNIFICADO
   Tipografía, superficies, formularios, sheets y estados.
   Segunda de las tres entregas finales.
   ========================================================= */
body.v65{
  --v65-bg:#030812;
  --v65-panel:#081522;
  --v65-panel-raised:#0c1b2c;
  --v65-border:rgba(126,160,195,.15);
  --v65-border-soft:rgba(126,160,195,.075);
  --v65-text:#f5f8fb;
  --v65-muted:#7f8da0;
  --v65-green:#32e39f;
  --v65-blue:#3ba8ff;
  --v65-amber:#f4b844;
  --v65-red:#ff626a;
  --v65-radius-sm:11px;
  --v65-radius-md:15px;
  --v65-radius-lg:19px;
}

/* Tipografía y ritmo */
body.v65,
body.v65 button,
body.v65 input,
body.v65 select,
body.v65 textarea{
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;
}
body.v65 h1,
body.v65 h2,
body.v65 h3,
body.v65 h4,
body.v65 p{
  text-wrap:pretty;
}
body.v65 .eyebrow{
  color:var(--v65-green)!important;
  font-size:8px!important;
  line-height:1.2!important;
  letter-spacing:.13em!important;
}
body.v65 .note,
body.v65 .muted{
  color:var(--v65-muted)!important;
  line-height:1.45!important;
}

/* Superficies universales */
body.v65 .card{
  margin-bottom:10px!important;
  padding:14px!important;
  border:1px solid var(--v65-border)!important;
  border-radius:var(--v65-radius-lg)!important;
  background:
    linear-gradient(145deg,rgba(24,45,70,.16),transparent 54%),
    rgba(8,19,33,.98)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.018)!important;
}
body.v65 .card h2,
body.v65 .card h3{
  color:var(--v65-text)!important;
  letter-spacing:-.02em;
}
body.v65 .stat{
  padding:11px!important;
  border:1px solid var(--v65-border)!important;
  border-radius:var(--v65-radius-md)!important;
  background:#0b1929!important;
}
body.v65 .stat b{
  color:var(--v65-text);
  font-size:15px!important;
}

/* Botones */
body.v65 .btn{
  min-height:48px!important;
  padding:12px 15px!important;
  border-radius:14px!important;
  font-size:9px!important;
  line-height:1.15!important;
  font-weight:900!important;
  letter-spacing:.035em!important;
  transition:transform .14s ease,filter .14s ease,border-color .14s ease!important;
}
body.v65 .btn:not(.secondary):not(.danger),
body.v65 .btn.success{
  background:linear-gradient(180deg,#3be9ae,#24cb91)!important;
  color:#03130d!important;
  box-shadow:0 9px 22px rgba(50,227,159,.11)!important;
}
body.v65 .btn.secondary{
  border:1px solid rgba(126,160,195,.17)!important;
  background:#102037!important;
  color:#e7edf3!important;
}
body.v65 .btn.danger{
  border:1px solid rgba(255,98,106,.20)!important;
  background:rgba(255,98,106,.095)!important;
  color:#ff9da4!important;
}
body.v65 .btn.small{
  min-height:38px!important;
  width:auto!important;
  padding:9px 11px!important;
  font-size:8px!important;
}
body.v65 .btn:active,
body.v65 button:active{
  transform:scale(.985);
}
body.v65 button:disabled,
body.v65 .btn:disabled{
  opacity:.42!important;
  cursor:not-allowed!important;
  filter:saturate(.4);
}

/* Campos */
body.v65 .field{
  margin:10px 0!important;
}
body.v65 .field label{
  margin-bottom:6px!important;
  color:#8796a8!important;
  font-size:8px!important;
  line-height:1.25!important;
  font-weight:850!important;
  letter-spacing:.025em;
}
body.v65 .input,
body.v65 input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]),
body.v65 select,
body.v65 textarea{
  min-height:47px;
  padding:11px 12px!important;
  border:1px solid var(--v65-border)!important;
  border-radius:13px!important;
  background:#06101c!important;
  color:#f5f8fb!important;
  font-size:11px!important;
  line-height:1.35!important;
  caret-color:var(--v65-green);
  transition:border-color .14s ease,box-shadow .14s ease,background .14s ease!important;
}
body.v65 textarea{
  min-height:96px;
  resize:vertical;
}
body.v65 input::placeholder,
body.v65 textarea::placeholder{
  color:#4f6074!important;
  opacity:1;
}
body.v65 .input:focus,
body.v65 input:focus,
body.v65 select:focus,
body.v65 textarea:focus{
  outline:0!important;
  border-color:rgba(50,227,159,.55)!important;
  background:#071321!important;
  box-shadow:0 0 0 3px rgba(50,227,159,.065)!important;
}
body.v65 select{
  appearance:auto;
}

/* Accesibilidad táctil y foco */
body.v65 button:focus-visible,
body.v65 [role="button"]:focus-visible,
body.v65 input:focus-visible,
body.v65 select:focus-visible,
body.v65 textarea:focus-visible{
  outline:2px solid rgba(50,227,159,.72)!important;
  outline-offset:2px!important;
}

/* Sheets / modales */
body.v65 .sheet-backdrop{
  background:rgba(0,3,8,.72)!important;
  backdrop-filter:blur(5px);
}
body.v65 .sheet{
  width:min(100%,720px)!important;
  height:min(92dvh,920px)!important;
  max-height:min(92dvh,920px)!important;
  margin:0 auto;
  padding:10px 13px calc(22px + env(safe-area-inset-bottom))!important;
  border:1px solid rgba(126,160,195,.18)!important;
  border-bottom:0!important;
  border-radius:22px 22px 0 0!important;

<script>
function roundCurrency(value){
  const number=Number(value||0);
  return Number.isFinite(number)?Math.round((number+Number.EPSILON)*100)/100:0;
}
function fmt(n){
  if(n===null||n===undefined||n===''||isNaN(n))return '0';
  return new Intl.NumberFormat('es-AR',{
    minimumFractionDigits:0,
    maximumFractionDigits:2
  }).format(roundCurrency(n));
}

const APP_VERSION='6.29';
const DB_NAME='cml_virtual_db', DB_VERSION=7;
const CAPITAL_FIJO=200000;
const DEFAULT_CLIENTS=[
  'Leandro Sarmiento','Trilu San Miguel','Polonia15','Yakel','Yakel2',
  'Kiosco Naty','Fab Four','Leandro Saavedra','Marta','Lucía Martín'
].map((name,i)=>({id:'c'+(i+1),name,active:true,order:i+1,balance:0}));

const state={tab:'today',db:null,clients:[],day:null,history:[],loans:[],audit:[],expenses:[],reconciliations:[],imports:[],importDraft:null,accreditationDraft:null,clientFilter:'active',routeFilter:'pending',routeSearch:'',paymentLock:false,dayCloseLock:false,lastPaymentAction:null,closingDraft:null,pendingRecovery:null,storageInfo:null,snapshotTimer:null,selfTestResult:null,repairPreview:null,auditSearch:'',auditCategory:'all',auditPeriod:'30',incidentFilter:'all',statementFrom:'',statementTo:'',followUpFilter:'due',reportFrom:'',reportTo:'',settings:{capital:200000,pinAdvance:0,bankDiscountDefault:0,whatsappTemplate:'Buen día el total es {monto}'}};

const money=n=>new Intl.NumberFormat('es-AR',{
  style:'currency',
  currency:'ARS',
  minimumFractionDigits:0,
  maximumFractionDigits:2
}).format(roundCurrency(n));
function dateKey(d=new Date()){
  const date=d instanceof Date?d:new Date(d);
  if(Number.isNaN(date.getTime()))return '';
  return [
    date.getFullYear(),
    String(date.getMonth()+1).padStart(2,'0'),
    String(date.getDate()).padStart(2,'0')
  ].join('-');
}
const niceDate=d=>new Intl.DateTimeFormat('es-AR',{weekday:'long',day:'2-digit',month:'short'}).format(d);
function headerDateKey(){
  // El encabezado informa la fecha local actual del dispositivo.
  // La fecha de la jornada se muestra dentro de cada pantalla operativa.
  return dateKey();
}
function updateHeaderDate(){
  const target=document.getElementById('date');
  if(!target)return;
  const key=headerDateKey();
  target.textContent=niceDate(localDateFromKey(key));
  target.setAttribute('title',formatLongDate(key));
}
function resetMainScroll(){
  const main=document.querySelector('main');
  if(main)main.scrollTop=0;
  window.scrollTo?.(0,0);
  requestAnimationFrame(()=>{
    if(main)main.scrollTop=0;
    window.scrollTo?.(0,0);
  });
}
async function synchronizeLocalDateChange(previousDate){
  const current=dateKey();
  if(current===previousDate)return current;

  state.history=(await getAll('days')).sort((a,b)=>b.date.localeCompare(a.date));
  const todayDay=state.history.find(day=>day.date===current)||null;

  // No se abandona silenciosamente una jornada anterior que todavía está abierta.
  // Solo se selecciona automáticamente la jornada del nuevo día cuando la vista
  // actual está vacía o corresponde a una jornada ya cerrada.
  if(todayDay&&(!state.day||state.day.status==='closed')){
    state.day=todayDay;
    await ensureCurrentDayOpeningBalances();
  }else if(!state.day){
    const openDay=state.history
      .filter(day=>day.status!=='closed'&&day.date<=current)
      .sort((a,b)=>b.date.localeCompare(a.date))[0]||null;
    state.day=todayDay||openDay;
    await ensureCurrentDayOpeningBalances();
  }

  render();
  return current;
}
function installDateRefresh(){
  let lastLocalDate=dateKey();
  let refreshing=false;
  const refresh=async()=>{
    updateHeaderDate();
    const current=dateKey();
    if(current===lastLocalDate||refreshing)return;
    refreshing=true;
    try{
      lastLocalDate=await synchronizeLocalDateChange(lastLocalDate);
    }catch(error){
      console.error('No se pudo sincronizar el cambio de fecha local',error);
    }finally{
      refreshing=false;
    }
  };
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)refresh()});
  window.addEventListener('focus',refresh);
  setInterval(refresh,60000);
}

function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,DB_VERSION);
    req.onupgradeneeded=e=>{
      const db=e.target.result;
      if(!db.objectStoreNames.contains('clients')) db.createObjectStore('clients',{keyPath:'id'});
      if(!db.objectStoreNames.contains('days')) db.createObjectStore('days',{keyPath:'date'});
      if(!db.objectStoreNames.contains('settings')) db.createObjectStore('settings',{keyPath:'key'});
      if(!db.objectStoreNames.contains('loans')) db.createObjectStore('loans',{keyPath:'id'});
      if(!db.objectStoreNames.contains('audit')) db.createObjectStore('audit',{keyPath:'id'});
      if(!db.objectStoreNames.contains('expenses')) db.createObjectStore('expenses',{keyPath:'id'});
      if(!db.objectStoreNames.contains('reconciliations')) db.createObjectStore('reconciliations',{keyPath:'dayDate'});
      if(!db.objectStoreNames.contains('imports')) db.createObjectStore('imports',{keyPath:'id'});
    };
    req.onsuccess=()=>{
      const db=req.result;
      const requiredStores=['clients','days','settings','loans','audit','expenses','reconciliations','imports'];
      const missing=requiredStores.filter(name=>!db.objectStoreNames.contains(name));
      if(missing.length){
        db.close();
        reject(new Error('La base local quedó desactualizada. Cerrá y volvé a abrir esta versión.'));
        return;
      }
      resolve(db);
    };
    req.onerror=()=>reject(req.error);
    req.onblocked=()=>reject(new Error('La actualización de la base está bloqueada por otra pestaña abierta.'));
  });
}
function tx(store,mode='readonly'){return state.db.transaction(store,mode).objectStore(store)}
function getAll(store){return new Promise((res,rej)=>{const r=tx(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
function getRecord(store,key){return new Promise((res,rej)=>{const r=tx(store).get(key);r.onsuccess=()=>res(r.result??null);r.onerror=()=>rej(r.error)})}
function put(store,value){return new Promise((res,rej)=>{const r=tx(store,'readwrite').put(value);r.onsuccess=()=>{if(['clients','days','settings','loans','expenses','reconciliations'].includes(store))scheduleEmergencySnapshot('database_change');res(value)};r.onerror=()=>rej(r.error)})}
function del(store,key){return new Promise((res,rej)=>{const r=tx(store,'readwrite').delete(key);r.onsuccess=()=>{if(['clients','days','settings','loans','expenses','reconciliations'].includes(store))scheduleEmergencySnapshot('database_delete');res()};r.onerror=()=>rej(r.error)})}
function commitClosedDayPackage(day,clients,reconciliation,auditEntries=[]){
  return new Promise((resolve,reject)=>{
    let settled=false;
    const transaction=state.db.transaction(['days','clients','reconciliations','audit'],'readwrite');
    transaction.objectStore('days').put(day);
    transaction.objectStore('reconciliations').put(reconciliation);
    const clientStore=transaction.objectStore('clients');
    clients.forEach(client=>clientStore.put(client));
    const auditStore=transaction.objectStore('audit');
    auditEntries.forEach(entry=>auditStore.put(entry));
    transaction.oncomplete=()=>{
      if(settled)return;
      settled=true;
      scheduleEmergencySnapshot('day_close_transaction');
      resolve(true);
    };
    transaction.onerror=()=>{
      if(settled)return;
      settled=true;
      reject(transaction.error||new Error('No se pudo guardar el cierre completo'));
    };
    transaction.onabort=()=>{
      if(settled)return;
      settled=true;
      reject(transaction.error||new Error('El cierre fue cancelado antes de guardarse'));
    };
  });
}
async function verifyClosedDayPersistence(dayDate){
  const [day,reconciliation]=await Promise.all([
    getRecord('days',dayDate),
    getRecord('reconciliations',dayDate)
  ]);
  const valid=Boolean(day&&day.status==='closed'&&Number(day.closedAt)>0&&reconciliation&&reconciliation.dayDate===dayDate);
  return {valid,day,reconciliation};
}


const EMERGENCY_SNAPSHOT_PREFIX='cml_emergency_snapshot_';
const EMERGENCY_SNAPSHOT_LIMIT=3;

function emergencySnapshotKeys(){
  try{
    const storage=window.localStorage;
    const keys=[];
    for(let i=0;i<storage.length;i++){
      const key=storage.key(i);
      if(key?.startsWith(EMERGENCY_SNAPSHOT_PREFIX))keys.push(key);
    }
    return keys.sort((a,b)=>{
      try{
        return Number(JSON.parse(storage.getItem(b))?.createdAt||0)-Number(JSON.parse(storage.getItem(a))?.createdAt||0);
      }catch{return 0}
    });
  }catch{
    return [];
  }
}
function readEmergencySnapshots(){
  return emergencySnapshotKeys().map(key=>{
    try{
      const data=JSON.parse(localStorage.getItem(key));

    if(!snapshot)return null;

    localStorage.setItem(key,JSON.stringify(snapshot));
    rotateEmergencySnapshots();
    state.settings.lastEmergencySnapshotAt=snapshot.createdAt;
    if(state.db){
      const record={key:'lastEmergencySnapshotAt',value:snapshot.createdAt};
      const request=tx('settings','readwrite').put(record);

        request.onerror=()=>reject(request.error);
      });

function detectPendingRecovery(){
  const snapshot=newestEmergencySnapshot();
  if(!snapshot)return null;
  const dbDay=state.day;
  const snapshotDay=snapshot.day;
  if(!snapshotDay)return null;
  const dbUpdated=Math.max(
    Number(dbDay?.closedAt||0),
    Number(dbDay?.routeActivatedAt||0),
    Number(dbDay?.createdAt||0),
    ...Object.values(dbDay?.payments||{}).flat().map(p=>Number(p.editedAt||p.createdAt||0)),
    ...Object.values(dbDay?.visits||{}).map(v=>Number(v.updatedAt||0))
  );
  const snapshotUpdated=Math.max(
    Number(snapshotDay.closedAt||0),
    Number(snapshotDay.routeActivatedAt||0),
    Number(snapshotDay.createdAt||0),
    ...Object.values(snapshotDay.payments||{}).flat().map(p=>Number(p.editedAt||p.createdAt||0)),
    ...Object.values(snapshotDay.visits||{}).map(v=>Number(v.updatedAt||0))
  );
  const dayFingerprint=day=>JSON.stringify({
    date:day?.date||null,
    status:day?.status||null,
    openingCash:Number(day?.openingCash||0),
    openingCashConfirmed:Boolean(day?.openingCashConfirmed),
    clientIds:day?.clientIds||[],
    routeOrder:day?.routeOrder||[],
    openingBalances:day?.openingBalances||{},
    accreditations:day?.accreditations||{},
    payments:day?.payments||{},
    visits:day?.visits||{},
    visitCredits:day?.visitCredits||{},
    dailyLoad:day?.dailyLoad||null,
    reconciliation:day?.reconciliation||null,
    closedAt:Number(day?.closedAt||0)
  });
  const contentDiffers=!dbDay||dayFingerprint(snapshotDay)!==dayFingerprint(dbDay);
  if(snapshotDay.date===dateKey()&&contentDiffers&&(!dbDay||snapshotUpdated>dbUpdated+2000)){
    return snapshot;
  }
  return null;
}
async function refreshStorageInfo(){

  try{
    if(navigator.storage){
      info.supported=true;
      if(navigator.storage.persisted)info.persisted=await navigator.storage.persisted();
      if(navigator.storage.estimate){
        const estimate=await navigator.storage.estimate();
        info.usage=Number(estimate.usage||0);
        info.quota=Number(estimate.quota||0);
        info.percent=info.quota?Math.round((info.usage/info.quota)*100):0;
      }
    }
  }catch(error){console.warn(error)}
  state.storageInfo=info;
  return info;
}

function validateEmergencySnapshot(snapshot){
  const errors=[];
  if(!snapshot||typeof snapshot!=='object')errors.push('Formato inválido');
  if(!Array.isArray(snapshot?.clients))errors.push('Faltan clientes');
  const ids=new Set();
  (snapshot?.clients||[]).forEach(client=>{
    if(!client?.id)errors.push('Cliente sin ID');
    else if(ids.has(client.id))errors.push(`ID duplicado: ${client.id}`);
    else ids.add(client.id);
    if(!client?.name?.trim())errors.push('Cliente sin nombre');
  });
  if(snapshot?.day&&!snapshot.day.date)errors.push('Jornada sin fecha');
  return errors;
}

function dayOpeningBalance(client,day=state.day){

    return Math.max(0,Number(day.openingBalances[client.id]||0));
  }
  // Las jornadas cerradas anteriores a v1.45 no tenían esta fotografía.
  // Se conserva 0 para no alterar cálculos históricos ya guardados.
  return 0;
}
function clientNet(client,day=state.day){
  if(!day)return 0;
  const openingBalance=dayOpeningBalance(client,day);

  const visitCredit=Number(day.visitCredits?.[client.id]||0);
  const paid=(day.payments?.[client.id]||[]).reduce((sum,payment)=>sum+Number(payment.amount||0),0);
  return openingBalance+accreditation+visitCredit-paid;

function storedOpeningBalanceForClient(day,clientId){
  if(day?.openingBalances&&Object.prototype.hasOwnProperty.call(day.openingBalances,clientId)){
    return Math.max(0,Number(day.openingBalances[clientId]||0));
  }
  if(day?.preCloseBalances&&Object.prototype.hasOwnProperty.call(day.preCloseBalances,clientId)){
    return Math.max(0,Number(day.preCloseBalances[clientId]||0));
  }

function clientClosingBalanceForDay(day,clientId){
  const opening=storedOpeningBalanceForClient(day,clientId);
  if(opening===null)return null;
  const accreditation=Number(day?.accreditations?.[clientId]||0);
  const visitCredit=Number(day?.visitCredits?.[clientId]||0);
  const paid=(day?.payments?.[clientId]||[]).reduce((sum,payment)=>sum+Number(payment?.amount||0),0);
  return Math.max(0,roundCurrency(opening+accreditation+visitCredit-paid));
}
function expectedOpeningBalanceForClient(client,dayDate){
  const priorDays=[...state.history]
    .filter(day=>
      day.status==='closed'&&
      day.date<dayDate&&
      (
        Object.prototype.hasOwnProperty.call(day.openingBalances||{},client.id)||
        Object.prototype.hasOwnProperty.call(day.preCloseBalances||{},client.id)||
        (day.clientIds||[]).includes(client.id)
      )
    )
    .sort((a,b)=>b.date.localeCompare(a.date));
  for(const sourceDay of priorDays){
    const amount=clientClosingBalanceForDay(sourceDay,client.id);
    if(amount===null)continue;
    const manualBalanceOverride=state.audit.some(entry=>
      entry.action==='client_updated'&&
      entry.meta?.clientId===client.id&&
      Number(entry.createdAt||0)>Number(sourceDay.closedAt||0)&&
      Number(entry.meta?.before?.balance)!==Number(entry.meta?.after?.balance)
    );
    const laterClientUpdate=Number(client.updatedAt||0)>Number(sourceDay.closedAt||0)+5000;
    if(manualBalanceOverride||laterClientUpdate){
      return {
        amount:Math.max(0,roundCurrency(Number(client.balance||0))),
        sourceDate:'',
        source:'client_record_override'
      };
    }
    return {amount,sourceDate:sourceDay.date,source:'closed_day'};
  }
  return {
    amount:Math.max(0,roundCurrency(Number(client.balance||0))),
    sourceDate:'',
    source:'client_record'
  };
}
function clientHasFinancialActivity(day,clientId){
  const accreditation=Number(day?.accreditations?.[clientId]||0);
  const visitCredit=Number(day?.visitCredits?.[clientId]||0);
  const payments=day?.payments?.[clientId]||[];
  return accreditation!==0||visitCredit!==0||payments.some(payment=>Number(payment?.amount||0)!==0);
}
function detectCarryoverMismatches(day=state.day){
  if(!day||day.status==='closed')return [];
  ensureDayCollections(day);
  return operationalClients(day).map(client=>{
    const expected=expectedOpeningBalanceForClient(client,day.date);
    const hasOpening=Object.prototype.hasOwnProperty.call(day.openingBalances||{},client.id);
    const current=hasOpening?Math.max(0,roundCurrency(Number(day.openingBalances[client.id]||0))):null;
    const difference=current===null?expected.amount:roundCurrency(expected.amount-current);
    return {
      client,
      current,
      expected:expected.amount,
      sourceDate:expected.sourceDate,
      source:expected.source,
      difference,
      financialActivity:clientHasFinancialActivity(day,client.id)
    };
  }).filter(item=>item.current===null||Math.abs(item.difference)>0.009);
}
async function reconcileOpeningBalancesForDay(day=state.day,{force=false,silent=false}={}){
  if(!day||day.status==='closed')return {corrected:[],unresolved:[]};
  ensureDayCollections(day);
  const mismatches=detectCarryoverMismatches(day);
  const corrected=[];
  const unresolved=[];
  mismatches.forEach(item=>{
    if(force||!item.financialActivity){
      day.openingBalances[item.client.id]=item.expected;
      corrected.push(item);
    }else{
      unresolved.push(item);
    }
  });
  if(corrected.length){
    day.carryoverReconciliation={
      correctedAt:Date.now(),
      forced:Boolean(force),
      clients:corrected.map(item=>({
        clientId:item.client.id,
        from:item.current,
        to:item.expected,
        sourceDate:item.sourceDate||null
      }))
    };
    if(day.routeSnapshot?.fingerprint){
      day.routeSnapshot={
        ...day.routeSnapshot,
        fingerprint:dailyLoadFingerprint(day),
        carryoverReconciledAt:Date.now()
      };
    }
    if(day.preRouteValidation?.fingerprint){
      day.preRouteValidation={
        ...day.preRouteValidation,
        fingerprint:dailyLoadFingerprint(day),
        carryoverReconciledAt:Date.now()
      };
    }
    await put('days',day);
    if(state.day?.date===day.date)state.day=day;
    state.history=(await getAll('days')).sort((a,b)=>b.date.localeCompare(a.date));
    await auditLog('opening_balances_reconciled','Saldos anteriores sincronizados con el último cierre',{
      dayDate:day.date,
      forced:Boolean(force),
      corrected:corrected.map(item=>({
        clientId:item.client.id,
        previous:item.current,
        expected:item.expected,
        sourceDate:item.sourceDate||''
      })),
      unresolved:unresolved.map(item=>item.client.id)
    });
    if(!silent)toast(`${corrected.length} saldo(s) anterior(es) actualizado(s)`);
  }
  return {corrected,unresolved};
}
async function reconcileOpenDaysAfterClose(closedDate){
  const openDays=[...state.history]
    .filter(day=>day.status!=='closed'&&day.date>closedDate)
    .sort((a,b)=>a.date.localeCompare(b.date));
  const unresolved=[];
  for(const day of openDays){
    const result=await reconcileOpeningBalancesForDay(day,{force:false,silent:true});
    if(result.unresolved.length){
      unresolved.push({dayDate:day.date,clients:result.unresolved.map(item=>item.client.id)});
    }
  }
  return unresolved;
}

function operationalClients(day=state.day){

function reconciliationDifferenceSummary(record={}){
  const countedCash=Number(record.countedCash);
  const expectedCash=Number(record.expectedCash);
  const verifiedTransfer=Number(record.verifiedTransfer);
  const expectedTransfer=Number(record.expectedTransfer);
  const cashDifference=Number.isFinite(countedCash)&&Number.isFinite(expectedCash)
    ?roundCurrency(countedCash-expectedCash)
    :roundCurrency(record.cashDifference||0);
  const transferDifference=Number.isFinite(verifiedTransfer)&&Number.isFinite(expectedTransfer)
    ?roundCurrency(verifiedTransfer-expectedTransfer)
    :roundCurrency(record.transferDifference||0);
  const totalDifference=roundCurrency(Math.abs(cashDifference)+Math.abs(transferDifference));
  return {
    cashDifference,
    transferDifference,
    totalDifference,
    hasDifference:cashDifference!==0||transferDifference!==0
  };
}

function normalizeText(value=''){
  return String(value).trim().replace(/\s+/g,' ');
}
function normalizeClientKey(value=''){
  return normalizeText(value).toLocaleLowerCase('es-AR')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}
function parseDelimitedText(text){
  const raw=String(text||'').replace(/\r/g,'').trim();
  if(!raw)return [];
  const lines=raw.split('\n').filter(line=>line.trim());
  if(!lines.length)return [];
  const delimiter=lines.some(line=>line.includes('\t'))?'\t':lines.some(line=>line.includes(';'))?';':',';
  return lines.map(line=>{
    if(delimiter==='\t')return line.split('\t').map(normalizeText);
    const cells=[];let current='',quoted=false;
    for(let i=0;i<line.length;i++){
      const ch=line[i];
      if(ch==='"'){
        if(quoted&&line[i+1]==='"'){current+='"';i++}
        else quoted=!quoted;
      }else if(ch===delimiter&&!quoted){
        cells.push(normalizeText(current));current='';
      }else current+=ch;
    }
    cells.push(normalizeText(current));
    return cells;
  });
}
function detectImportColumns(rows){

  const find=terms=>headers.findIndex(h=>terms.some(t=>h.includes(t)));
  const name=find(['cliente','nombre','comercio','razon social']);
  const balance=find(['saldo','deuda','balance']);
  const order=find(['orden','ruta','recorrido']);
  const active=find(['activo','estado','habilitado']);
  const phone=find(['telefono','teléfono','celular','whatsapp']);
  const address=find(['direccion','dirección','domicilio']);
  const routeNote=find(['observacion ruta','observación ruta','referencia','nota ruta']);
  const recognized=[name,balance,order,active,phone,address,routeNote].filter(i=>i>=0).length;
  return {hasHeader:recognized>=1,name:name>=0?name:0,balance:balance>=0?balance:1,order:order>=0?order:2,active:active>=0?active:3,phone,address,routeNote};
}

  data.forEach((row,index)=>{
    const line=index+(columns.hasHeader?2:1);
    const name=normalizeText(row[columns.name]||'');
    if(!name)return;
    const key=normalizeClientKey(name);
    if(seen.has(key)){errors.push(`Fila ${line}: cliente duplicado (${name}).`);return}
    seen.add(key);
    const balance=parseMoneyInput(row[columns.balance]||'0');
    const orderRaw=parseInt(String(row[columns.order]||'').replace(/\D/g,''),10);
    if(balance<0){errors.push(`Fila ${line}: el saldo de ${name} no puede ser negativo.`);return}
    items.push({name,key,balance,order:Number.isFinite(orderRaw)&&orderRaw>0?orderRaw:items.length+1,active:parseActiveValue(row[columns.active]),phone:columns.phone>=0?normalizeText(row[columns.phone]||''):'',address:columns.address>=0?normalizeText(row[columns.address]||''):'',routeNote:columns.routeNote>=0?normalizeText(row[columns.routeNote]||''):'',line});
  });
  items.sort((a,b)=>a.order-b.order||a.name.localeCompare(b.name,'es'));
  return {source,items,errors,columns,createdAt:Date.now()};
}


function detectAccreditationColumns(rows){
  if(!rows.length)return {hasHeader:false,name:0,amount:1};
  const headers=rows[0].map(v=>normalizeClientKey(v));
  const find=terms=>headers.findIndex(h=>terms.some(t=>h.includes(t)));
  const name=find(['cliente','nombre','comercio','razon social','punto de venta']);
  const amount=find(['acreditacion','acreditación','importe','monto','saldo acreditado','credito','crédito']);
  const recognized=[name,amount].filter(i=>i>=0).length;
  return {hasHeader:recognized>=1,name:name>=0?name:0,amount:amount>=0?amount:1};
}
function parsePinwebAmount(value){
  const raw=String(value??'').trim();
  if(!raw)return 0;
  let cleaned=raw.replace(/\s/g,'').replace(/\$/g,'');
  const hasComma=cleaned.includes(',');
  const hasDot=cleaned.includes('.');
  if(hasComma&&hasDot){
    if(cleaned.lastIndexOf(',')>cleaned.lastIndexOf('.')){
      cleaned=cleaned.replace(/\./g,'').replace(',','.');
    }else{
      cleaned=cleaned.replace(/,/g,'');
    }
  }else if(hasComma){
    const decimals=cleaned.length-cleaned.lastIndexOf(',')-1;
    cleaned=decimals===2?cleaned.replace(/\./g,'').replace(',','.') : cleaned.replace(/,/g,'');
  }else if(hasDot){
    const decimals=cleaned.length-cleaned.lastIndexOf('.')-1;
    if(decimals!==2)cleaned=cleaned.replace(/\./g,'');
  }
  cleaned=cleaned.replace(/[^\d.-]/g,'');
  const number=Number(cleaned);
  return Number.isFinite(number)?roundCurrency(number):NaN;
}
function clientImportKeys(client){
  return [
    client?.name,
    client?.pinwebUser,
    ...(Array.isArray(client?.importAliases)?client.importAliases:[])
  ].map(value=>normalizeClientKey(value||'')).filter(Boolean);
}
function findClientForAccreditationImport(importedName){
  const key=normalizeClientKey(importedName);
  if(!key)return null;
  return state.clients.find(client=>
    client.active!==false&&clientImportKeys(client).includes(key)
  )||null;
}
function buildAccreditationDraft(rows,source='excel_pegado'){
  const columns=detectAccreditationColumns(rows);
  const data=columns.hasHeader?rows.slice(1):rows;
  const seen=new Set(),items=[],errors=[],unknown=[];
  data.forEach((row,index)=>{
    const line=index+(columns.hasHeader?2:1);
    const importedName=normalizeText(row[columns.name]||'');
    const rawAmount=row[columns.amount]||'';
    if(!importedName&&!normalizeText(rawAmount))return;
    if(!importedName){errors.push(`Fila ${line}: falta el nombre del cliente.`);return}
    const key=normalizeClientKey(importedName);
    if(seen.has(key)){errors.push(`Fila ${line}: cliente duplicado en el archivo (${importedName}).`);return}
    seen.add(key);
    const amount=parsePinwebAmount(rawAmount);
    if(!Number.isFinite(amount)||amount<0){errors.push(`Fila ${line}: monto inválido para ${importedName}.`);return}
    const client=findClientForAccreditationImport(importedName);
    if(!client){
      unknown.push({line,name:importedName,amount});
      return;
    }
    items.push({line,clientId:client.id,clientName:client.name,importedName,amount});
  });
  return {source,items,errors,unknown,columns,createdAt:Date.now()};
}

function ensureDayCollections(day=state.day){
  if(!day)return;
  day.payments=day.payments||{};
  day.accreditations=day.accreditations||{};
  day.visitCredits=day.visitCredits||{};
  day.visits=day.visits||{};
  day.openingBalances=day.openingBalances||{};
  day.virtualCreditConfirmations=day.virtualCreditConfirmations||{};
}
function paymentOverpaymentItems(day=state.day){
  if(!day)return [];
  ensureDayCollections(day);
  const items=[];
  operationalClients(day).forEach(client=>{
    const obligation=roundCurrency(
      dayOpeningBalance(client,day)+
      Number(day.accreditations?.[client.id]||0)+
      Number(day.visitCredits?.[client.id]||0)
    );
    let cumulative=0;
    const payments=(day.payments?.[client.id]||[])
      .map((payment,index)=>({payment,index}))
      .filter(item=>Number(item.payment?.amount||0)>0)
      .sort((a,b)=>Number(a.payment.createdAt||0)-Number(b.payment.createdAt||0)||a.index-b.index);
    payments.forEach(({payment})=>{
      const before=Math.max(0,roundCurrency(cumulative-obligation));
      cumulative=roundCurrency(cumulative+Number(payment.amount||0));
      const after=Math.max(0,roundCurrency(cumulative-obligation));
      const amount=roundCurrency(after-before);
      if(amount>0){
        items.push({
          clientId:client.id,
          client,
          paymentId:payment.id,
          payment,
          amount,
          obligation,
          cumulativePaid:cumulative
        });
      }
    });
  });
  return items;
}
function virtualCreditConfirmation(item,day=state.day){
  if(!item||!day)return null;
  const record=day.virtualCreditConfirmations?.[item.paymentId]||null;
  if(!record)return null;
  if(record.clientId!==item.clientId)return null;
  if(Math.abs(Number(record.amount||0)-Number(item.amount||0))>0.005)return null;
  return record;
}
function pendingVirtualCredits(day=state.day){
  return paymentOverpaymentItems(day).filter(item=>!virtualCreditConfirmation(item,day));
}
function invalidateVirtualCreditConfirmationsForClient(clientId,day=state.day){
  if(!day?.virtualCreditConfirmations)return 0;
  let removed=0;
  Object.entries(day.virtualCreditConfirmations).forEach(([paymentId,record])=>{
    if(record?.clientId===clientId){delete day.virtualCreditConfirmations[paymentId];removed+=1}
  });
  return removed;
}
async function confirmVirtualCredit(clientId,paymentId,returnTo='payment'){
  if(!state.day||state.day.status==='closed')return toast('La jornada no está abierta');
  const item=paymentOverpaymentItems(state.day).find(row=>row.clientId===clientId&&row.paymentId===paymentId);
  if(!item)return toast('Este pago ya no genera saldo virtual pendiente');
  ensureDayCollections(state.day);
  const confirmation={
    paymentId,
    clientId,
    amount:item.amount,
    confirmedAt:Date.now()
  };
  state.day.virtualCreditConfirmations[paymentId]=confirmation;
  await saveDay();
  await auditLog('virtual_credit_confirmed','Acreditación de saldo virtual confirmada en PINWEB',{
    clientId,paymentId,amount:item.amount,dayDate:state.day.date
  });
  if(returnTo==='checklist')return openCloseChecklist();
  showPaymentSuccess(clientId,paymentId);

}
function visitRecord(clientId,day=state.day){
  ensureDayCollections(day);
  return day?.visits?.[clientId]||null;
}
function routePaymentsFor(clientId,day=state.day){
  return (day?.payments?.[clientId]||[]).filter(payment=>payment.source!=='daily_load');
}
function clientRouteStatus(client,day=state.day){
  const remaining=clientDue(client,day);
  const routePaid=routePaymentsFor(client.id,day)
    .reduce((sum,payment)=>sum+Number(payment.amount||0),0);
  const visit=visitRecord(client.id,day);
  if(routePaid>0&&remaining<=0)return {key:'paid',label:'COMPLETADO',badge:'paid'};
  if(routePaid>0&&remaining>0)return {key:'partial',label:'PARCIAL',badge:'partial'};
  if(visit?.status==='no_payment')return {key:'visited',label:'VISITADO',badge:'partial'};
  if(visit?.status==='rescheduled')return {key:'rescheduled',label:'REPROGRAMADO',badge:'partial'};
  return {key:'pending',label:'POR GESTIONAR',badge:'pending'};
}

function preparationReadiness(day=state.day){
  const clients=operationalClients(day);
  const withoutPhone=clients.filter(c=>!String(c.phone||'').trim());
  const withoutAddress=clients.filter(c=>!String(c.address||'').trim());
  const duplicateOrders=[];
  const seen=new Set();
  clients.forEach(c=>{
    const order=Number(c.order);
    if(seen.has(order))duplicateOrders.push(c.name);
    seen.add(order);
  });
  const backupAge=daysSince(state.settings.lastBackupAt);
  return {
    clients:clients.length,
    withoutPhone,
    withoutAddress,
    duplicateOrders,
    backupAge,
    backupOk:backupAge!==null&&backupAge<7,
    imported:dailyDataReady(day)
  };
}
function moveRouteClient(clientId,direction){
  if(!state.day||state.day.status==='closed')return toast('La jornada está cerrada');
  const order=[...(state.day.routeOrder?.length?state.day.routeOrder:state.day.clientIds||[])];
  const index=order.indexOf(clientId);
  if(index<0)return;
  const next=index+direction;
  if(next<0||next>=order.length)return;
  [order[index],order[next]]=[order[next],order[index]];
  state.day.routeOrder=order;
  saveDay().then(()=>{
    auditLog('route_order_changed','Orden de ruta modificado',{clientId,direction});
    showRoutePlanner();
  });
}
async function resetRouteOrder(){
  if(!state.day)return;
  if(!confirm('¿Restablecer el orden según la configuración de clientes?'))return;
  state.day.routeOrder=[...(state.day.clientIds||[])].sort((a,b)=>{
    const ca=state.clients.find(c=>c.id===a),cb=state.clients.find(c=>c.id===b);
    return Number(ca?.order||999)-Number(cb?.order||999)||(ca?.name||'').localeCompare(cb?.name||'','es');
  });
  await saveDay();
  await auditLog('route_order_reset','Orden de ruta restablecido');
  showRoutePlanner();
  toast('Orden restablecido');
}

function routeClients(day=state.day){
  const routeIds=new Set(day?.routeOrder||[]);
  let clients=operationalClients(day).filter(client=>routeIds.has(client.id));
  const query=routeSearchValue();
  if(query){
    clients=clients.filter(client=>[
      client.name,client.address,client.routeNote,client.phone
    ].some(value=>normalizeClientKey(value||'').includes(query)));
  }
  if(state.routeFilter==='all')return clients;
  return clients.filter(client=>{
    const status=clientRouteStatus(client,day).key;
    if(state.routeFilter==='pending')return status==='pending';
    if(state.routeFilter==='visited')return status==='visited'||status==='rescheduled';
    if(state.routeFilter==='paid')return status!=='pending';
    return true;
  });
}
function routeStatsClients(day=state.day){
  const operational=operationalClients(day);
  const routeOrder=Array.isArray(day?.routeOrder)?day.routeOrder:[];
  if(routeOrder.length){
    const routeIds=new Set(routeOrder);
    return operational.filter(client=>routeIds.has(client.id));
  }
  // Mientras la jornada está en preparación, todos los clientes operativos
  // son candidatos de la ruta y deben contabilizarse como pendientes.
  return day?.status==='preparation'?operational:[];
}
function routeVisitStats(day=state.day){
  const clients=routeStatsClients(day);
  let paid=0,partial=0,visited=0,pending=0;
  clients.forEach(client=>{
    const key=clientRouteStatus(client,day).key;
    if(key==='paid')paid++;
    else if(key==='partial')partial++;
    else if(key==='visited'||key==='rescheduled')visited++;
    else pending++;
  });
  return {total:clients.length,paid,partial,visited,pending,managed:paid+partial+visited};
}

function allClientPayments(clientId){

function latestPaymentAfter(clientId,timestamp){

function followUpItems(){
  const today=dateKey();
  const items=[];
  state.history.forEach(day=>{
    Object.entries(day.visits||{}).forEach(([clientId,visit])=>{
      if(!visit?.followUpDate||visit.followUpResolvedAt)return;
      if(latestPaymentAfter(clientId,visit.updatedAt))return;
      const client=state.clients.find(c=>c.id===clientId);
      if(!client)return;
      const remaining=clientDue(client,day);
      const category=visit.followUpDate<today?'overdue':visit.followUpDate===today?'today':'upcoming';
      items.push({
        dayDate:day.date,
        clientId,
        client,
        visit,
        remaining,
        category,
        key:`${day.date}|${clientId}`
      });
    });
  });
  return items.sort((a,b)=>a.visit.followUpDate.localeCompare(b.visit.followUpDate)||a.client.name.localeCompare(b.client.name,'es'));
}
function visibleFollowUps(){
  const items=followUpItems();
  if(state.followUpFilter==='all')return items;
  if(state.followUpFilter==='due')return items.filter(item=>item.category==='overdue'||item.category==='today');
  return items.filter(item=>item.category===state.followUpFilter);
}
function followUpStats(){
  const items=followUpItems();
  return {
    total:items.length,
    overdue:items.filter(i=>i.category==='overdue').length,
    today:items.filter(i=>i.category==='today').length,
    upcoming:items.filter(i=>i.category==='upcoming').length
  };
}

    selfTestAssert(results,'Jornada actual legible',!state.day||!!state.day.date,'La jornada no tiene fecha');
    selfTestAssert(results,'Clientes cargados',Array.isArray(state.clients),'La colección no es válida');
    selfTestAssert(results,'Historial cargado',Array.isArray(state.history),'El historial no es válido');
    selfTestAssert(results,'Gastos cargados',Array.isArray(state.expenses),'La colección no es válida');
    const snapshot=await buildEmergencySnapshot('self_test');
    selfTestAssert(results,'Snapshot construible',!!snapshot&&Array.isArray(snapshot.clients),'No se pudo construir');
    const validation=validateEmergencySnapshot(snapshot);
    selfTestAssert(results,'Snapshot válido',validation.length===0,validation.join(' · '));
  }catch(error){
    results.push({name:'Pruebas de base de datos',ok:false,detail:error.message||String(error)});
  }
  return results;
}

function buildRepairPreview(){
  const changes=[];
  const clients=state.clients.map(cloneData);
  const days=state.history.map(cloneData);
  const expenses=state.expenses.map(cloneData);
  const reconciliations=state.reconciliations.map(cloneData);
  const clientIds=new Set(clients.map(client=>client.id));

  days.forEach(day=>{
    let changed=false;
    if(day.openingCash===undefined||!Number.isFinite(Number(day.openingCash))||Number(day.openingCash)<0){
      day.openingCash=Number(state.settings.capital||0);
      changes.push({type:'day_opening_cash',record:day.date,detail:`Capital inicial establecido en ${money(day.openingCash)}`});changed=true;
    }
    if(typeof day.openingCashConfirmed!=='boolean'){
      day.openingCashConfirmed=day.status!=='preparation';
      changes.push({type:'day_opening_confirmation',record:day.date,detail:'Confirmación del capital normalizada'});changed=true;
    }
    if(!Array.isArray(day.reopenHistory)&&Number(day.reopenCount||0)>0){
      day.reopenHistory=[];
      changes.push({type:'reopen_history_initialized',record:day.date,detail:'Historial de reaperturas inicializado'});changed=true;
    }
    if(Array.isArray(day.reopenHistory)&&Number(day.reopenCount||0)!==day.reopenHistory.length){
      day.reopenCount=day.reopenHistory.length;
      changes.push({type:'reopen_count_repaired',record:day.date,detail:'Contador de reaperturas sincronizado'});changed=true;
    }
    if(!Array.isArray(day.clientIds)){day.clientIds=[];changes.push({type:'day_client_ids',record:day.date,detail:'Lista de clientes inicializada'});changed=true}
    const validIds=[...new Set(day.clientIds.filter(id=>clientIds.has(id)))];
    if(JSON.stringify(validIds)!==JSON.stringify(day.clientIds)){day.clientIds=validIds;changes.push({type:'day_client_ids_cleaned',record:day.date,detail:'Referencias inexistentes o duplicadas eliminadas'});changed=true}
    const originalOrder=Array.isArray(day.routeOrder)?day.routeOrder:[];
    const repairedOrder=[...new Set(originalOrder.filter(id=>day.clientIds.includes(id)))];
    day.clientIds.forEach(id=>{if(!repairedOrder.includes(id))repairedOrder.push(id)});
    if(JSON.stringify(repairedOrder)!==JSON.stringify(originalOrder)){day.routeOrder=repairedOrder;changes.push({type:'route_order_repaired',record:day.date,detail:'Orden de ruta reconstruido'});changed=true}
    day.accreditations=day.accreditations&&typeof day.accreditations==='object'?day.accreditations:{};
    day.payments=day.payments&&typeof day.payments==='object'?day.payments:{};
    day.visits=day.visits&&typeof day.visits==='object'?day.visits:{};
    Object.entries(day.payments).forEach(([clientId,payments])=>{
      if(!Array.isArray(payments)){day.payments[clientId]=[];changes.push({type:'payments_reset',record:`${day.date}/${clientId}`,detail:'Colección de pagos inválida reemplazada'});changed=true;return}
      payments.forEach((payment,index)=>{
        if(!payment.id){payment.id=`repair_${day.date}_${clientId}_${index}_${Date.now()}`;changes.push({type:'payment_id',record:`${day.date}/${clientId}`,detail:'ID de pago generado'});changed=true}
        payment.amount=Number(payment.amount||0);
        if(!['cash','transfer'].includes(payment.method)){payment.method='cash';changes.push({type:'payment_method',record:`${day.date}/${clientId}`,detail:'Medio inválido normalizado a efectivo'});changed=true}
        if(!Number(payment.createdAt)){payment.createdAt=Number(day.createdAt||Date.now());changes.push({type:'payment_date',record:`${day.date}/${clientId}`,detail:'Fecha del pago reconstruida'});changed=true}
      });
    });
    if(changed)day.repairedAt=Date.now();
  });

  expenses.forEach(expense=>{
    let changed=false;
    if(!['cash','transfer'].includes(expense.method)){expense.method='cash';changes.push({type:'expense_method',record:expense.id,detail:'Gasto normalizado como efectivo'});changed=true}
    if(!Number(expense.createdAt)){expense.createdAt=Date.now();changes.push({type:'expense_date',record:expense.id,detail:'Fecha de creación agregada'});changed=true}
    if(changed)expense.repairedAt=Date.now();
  });

  reconciliations.forEach(rec=>{
    let changed=false;
    const day=days.find(item=>item.date===rec.dayDate);
    if(day){
      const totals=calcDay(day);
      if(rec.openingCash===undefined){rec.openingCash=totals.openingCash;changes.push({type:'reconciliation_opening_cash',record:rec.dayDate,detail:'Capital inicial agregado'});changed=true}
      if(rec.expectedCash===undefined||!Number.isFinite(Number(rec.expectedCash))){rec.expectedCash=totals.expectedCash;changes.push({type:'reconciliation_expected_cash',record:rec.dayDate,detail:'Caja esperada recalculada'});changed=true}
      if(rec.expectedTransfer===undefined||!Number.isFinite(Number(rec.expectedTransfer))){rec.expectedTransfer=totals.expectedTransfer;changes.push({type:'reconciliation_expected_transfer',record:rec.dayDate,detail:'Transferencia esperada recalculada'});changed=true}
      const differences=reconciliationDifferenceSummary(rec);
      if(roundCurrency(rec.cashDifference||0)!==differences.cashDifference){
        rec.cashDifference=differences.cashDifference;
        changes.push({type:'reconciliation_cash_difference',record:rec.dayDate,detail:'Diferencia de efectivo recalculada'});changed=true;
      }
      if(roundCurrency(rec.transferDifference||0)!==differences.transferDifference){
        rec.transferDifference=differences.transferDifference;
        changes.push({type:'reconciliation_transfer_difference',record:rec.dayDate,detail:'Diferencia de transferencias recalculada contra el neto esperado'});changed=true;
      }
      if(roundCurrency(rec.totalDifference||0)!==differences.totalDifference){
        rec.totalDifference=differences.totalDifference;
        changes.push({type:'reconciliation_total_difference',record:rec.dayDate,detail:'Diferencia total normalizada sin compensar medios de pago'});changed=true;
      }
    }
    if(changed)rec.repairedAt=Date.now();
  });
  return {createdAt:Date.now(),changes,datasets:{clients,days,expenses,reconciliations}};
}
async function applyRepairPreview(){
  const preview=state.repairPreview;
  if(!preview||!preview.changes.length)return toast('No hay reparaciones pendientes');
  if(!confirm(`Se aplicarán ${preview.changes.length} correcciones. Antes se creará una copia de emergencia. ¿Continuar?`))return;
  await createEmergencySnapshot('before_data_repair',true);
  try{
    for(const client of preview.datasets.clients)await put('clients',client);
    for(const day of preview.datasets.days)await put('days',day);
    for(const expense of preview.datasets.expenses)await put('expenses',expense);
    for(const reconciliation of preview.datasets.reconciliations)await put('reconciliations',reconciliation);
    await auditLog('data_repair_applied','Reparación segura aplicada',{changes:preview.changes.length,types:[...new Set(preview.changes.map(change=>change.type))]});
    state.repairPreview=null;
    location.reload();
  }catch(error){console.error(error);toast('No se pudo completar la reparación')}
}
